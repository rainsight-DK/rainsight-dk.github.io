<meta name="theme-color" content="#1E3A8A">
<style>
:root{--navy:#1E3A8A;--navy-d:#1E40AF;--bg:#EFF6FF;--card:#FFFFFF;--ink:#172554;--mut:#64748B;--line:#BFDBFE;--danger:#B91C1C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .brand{font-size:19px;font-weight:800}
header .sub{font-size:12.5px;opacity:.9;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
button.danger{color:var(--danger);border-color:#F3C2C2}
button.small{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:56px;resize:vertical}
label.fl{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
label.fl:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fix{flex:0 0 auto}
.mut{color:var(--mut);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;border:none;border-radius:0;padding:11px 0 13px;font-size:12.5px;color:var(--mut)}
nav button.on{color:var(--navy);font-weight:800}
h2.sec{font-size:17px;margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#172554;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:9;max-width:90vw;text-align:center}
img.card-photo{width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:8px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
</style>
</head>

function shrinkImage(file, done){
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 1200, scale = Math.min(1, max / Math.max(img.width, img.height));
      var cv = document.createElement("canvas"); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      done(cv.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = function(){ done(null); };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function stampLocation(state){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos){
    state.lat = pos.coords.latitude; state.lon = pos.coords.longitude;
    fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + state.lat + "&lon=" + state.lon).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.display_name){ state.locationAddress = j.display_name; if(view === "review") renderReview(true); }
    }).catch(function(){});
  }, function(){}, { timeout: 8000 });
}
/* heuristic parse of free text (typed/spoken/OCR) */
function parseText(text){
  var out = { name: "", title: "", company: "", phones: [], emails: [], address: "", website: "" };
  if(!text) return out;
  var emailRe = /[\w.+-]+@[\w-]+\.[\w.]+/g;
  var em; while((em = emailRe.exec(text)) !== null){ if(out.emails.indexOf(em[0]) < 0) out.emails.push(em[0]); }
  var um = text.match(/(https?:\/\/|www\.)\S+/); if(um) out.website = um[0];
  var phoneRe = /\+?\d[\d\s().-]{6,}\d/g, pm;
  while((pm = phoneRe.exec(text)) !== null){
    var num = pm[0].trim(); if(num.replace(/\D/g, "").length < 7) continue;
    var before = text.slice(Math.max(0, pm.index - 14), pm.index);
    var label = /fax/i.test(before) ? "Fax " : "";
    var val = label + num.replace(/^(phone|tel|mobile|cell)\s*:?\s*/i, "");
    if(out.phones.indexOf(val) < 0) out.phones.push(val);
  }
  var rest = text.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, " ").replace(/\+?\d[\d\s().-]{6,}\d/g, " ").replace(/(phone|tel|mobile|cell|fax|email|e-mail)\s*:?/gi, " ");
  var segs = rest.split(/[\n,;]+/).map(function(x){ return x.trim(); }).filter(function(x){ return x.length > 1; });
  if(segs[0]) out.name = segs[0];
  if(segs[1]) out.company = segs[1];
  if(segs[2]) out.title = segs[2];
  return out;
}

    '<button id="capUpload" style="width:100%;padding:13px;margin-bottom:9px">🖼️ Upload Photo <span class="mut">(from camera roll)</span></button>' +
    '<button id="capType" style="width:100%;padding:13px">🎙️ Type or Speak <span class="mut">(great while driving)</span></button></div>' +
    '<div class="card"><h2 class="sec">Tags</h2><div class="pills">' + DB.tags.map(function(t){ return '<span class="pill">' + esc(t.name) + '</span>'; }).join("") + '</div>' +
    '<div class="row" style="margin-top:10px"><input id="newTag" placeholder="New tag name"><button class="primary fix" id="addTagBtn">Add tag</button></div></div>';
  function startPhoto(useCamera){
    reviewState = { id: "", draftId: "", photos: [], capturedDate: new Date().toISOString(), locationAddress: "", lat: null, lon: null, inputMethod: "photo", name: "", title: "", company: "", phones: [], emails: [], address: "", website: "", notes: "", comment: "", tags: [], rawText: "" };
    stampLocation(reviewState);
    view = "review"; render(); toast(useCamera ? "Add the front photo to begin" : "Add a photo to begin");
  }
  $("capPhoto").addEventListener("click", function(){ startPhoto(true); });
  $("capUpload").addEventListener("click", function(){ startPhoto(false); });
  $("capType").addEventListener("click", function(){
    reviewState = { id: "", draftId: "", photos: [], capturedDate: new Date().toISOString(), locationAddress: "", lat: null, lon: null, inputMethod: "text", name: "", title: "", company: "", phones: [], emails: [], address: "", website: "", notes: "", comment: "", tags: [], rawText: "" };
    stampLocation(reviewState); view = "review"; render();
  });
  $("addTagBtn").addEventListener("click", function(){ var v = $("newTag").value.trim(); if(!v) return; if(!DB.tags.some(function(t){ return t.name === v; })) DB.tags.push({ name: v }); save(); renderCapture(); });
}

/* ---------- Review / edit form ---------- */
function startReviewFromContact(c){
  reviewState = JSON.parse(JSON.stringify(c)); reviewState.draftId = ""; reviewState.rawText = "";
  view = "review"; render(); window.scrollTo(0,0);
}
function startReviewFromDraft(dr, asText){
  var parsed = parseText(dr.rawText || "");
  reviewState = { id: "", draftId: dr.id, photos: dr.photos || [], capturedDate: dr.capturedDate || new Date().toISOString(), locationAddress: dr.locationAddress || "", lat: dr.lat, lon: dr.lon, inputMethod: "text",
    name: parsed.name, title: parsed.title, company: parsed.company, phones: parsed.phones, emails: parsed.emails, address: parsed.address, website: parsed.website,
    notes: "", comment: dr.comment || "", tags: [], rawText: dr.rawText || "" };
  view = "review"; render(); window.scrollTo(0,0);
}
function renderReview(keepScroll){
  var r = reviewState; if(!r){ view = "capture"; render(); return; }
  var h = '<div class="card"><h2 class="sec">' + (r.id ? "Edit Contact" : "Review & Save") + '</h2>' +
    '<div class="mut">Captured ' + fmtDT(r.capturedDate) + (r.locationAddress ? ' · ' + esc(r.locationAddress) : ' · location pending…') + '</div>' +
    '<label class="fl">Card photos</label><div id="rvPhotos"></div>' +
    '<div class="row"><button id="addFront">+ Front photo</button><button id="addBack">+ Back photo</button></div>' +
    '<div class="row" style="margin-top:9px"><button id="ocrBtn">🔍 Read card with OCR (online, best-effort)</button></div>' +
    '<div id="ocrStatus" class="mut" style="margin-top:4px"></div>' +
    '<label class="fl">Raw text (typed / spoken / OCR)</label><textarea id="r_raw" style="min-height:70px" placeholder="Say something like \'Tree remover ABC, phone 123-456-7890\' or type the details…">' + esc(r.rawText) + '</textarea>' +
    '<div class="row" style="margin-top:6px"><button id="micBtn" class="fix">🎙️ Tap mic to speak</button><button id="parseBtn">Parse text into fields</button></div>' +
    '<label class="fl">Name *</label><input id="r_name" value="' + esc(r.name) + '">' +
    '<label class="fl">Title</label><input id="r_title" value="' + esc(r.title) + '">' +
    '<label class="fl">Company</label><input id="r_company" value="' + esc(r.company) + '">' +
    '<label class="fl">Phones (one per line)</label><textarea id="r_phones">' + esc(r.phones.join("\n")) + '</textarea>' +
    '<label class="fl">Emails (one per line)</label><textarea id="r_emails">' + esc(r.emails.join("\n")) + '</textarea>' +
    '<label class="fl">Address</label><textarea id="r_address">' + esc(r.address) + '</textarea>' +
    '<label class="fl">Website</label><input id="r_web" value="' + esc(r.website) + '">' +
    '<label class="fl">Notes</label><textarea id="r_notes">' + esc(r.notes) + '</textarea>' +
    '<label class="fl">Comment</label><input id="r_comment" value="' + esc(r.comment) + '">' +
    '<label class="fl">Tags</label><div class="pills" id="r_tags">' + DB.tags.map(function(t){ return '<span class="pill' + (r.tags.indexOf(t.name) >= 0 ? " on" : "") + '" data-tag="' + esc(t.name) + '">' + esc(t.name) + '</span>'; }).join("") + '</div>' +
    '<div class="row" style="margin-top:14px"><button class="primary" id="r_save">Save contact</button><button id="r_draft">Save for later</button><button class="danger" id="r_discard">Discard</button></div></div>';
  $("main").innerHTML = h;
  function renderRvPhotos(){
    var box = $("rvPhotos");
    box.innerHTML = r.photos.length ? r.photos.map(function(ph, i){ return '<div class="row" style="margin-bottom:6px"><img class="thumb" src="' + ph + '"><span class="mut">' + (i === 0 ? "Front" : "Back") + '</span><button class="small danger fix" data-phdel="' + i + '">✕</button></div>'; }).join("") : '<p class="mut" style="margin:0">No photos yet.</p>';
    document.querySelectorAll("[data-phdel]").forEach(function(b){ b.addEventListener("click", function(){ sync(); r.photos.splice(parseInt(b.getAttribute("data-phdel"), 10), 1); renderReview(true); }); });
  }
  function sync(){
    r.rawText = $("r_raw").value; r.name = $("r_name").value; r.title = $("r_title").value; r.company = $("r_company").value;
    r.phones = $("r_phones").value.split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
    r.emails = $("r_emails").value.split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
    r.address = $("r_address").value; r.website = $("r_web").value; r.notes = $("r_notes").value; r.comment = $("r_comment").value;
  }
  renderRvPhotos();
  document.querySelectorAll("[data-tag]").forEach(function(p){ p.addEventListener("click", function(){ sync(); var t = p.getAttribute("data-tag"); var ix = r.tags.indexOf(t); if(ix >= 0) r.tags.splice(ix, 1); else r.tags.push(t); renderReview(true); }); });
  $("addFront").addEventListener("click", function(){ $("frontFile").click(); });
  $("addBack").addEventListener("click", function(){ $("backFile").click(); });
  $("frontFile").onchange = function(){ var f = this.files && this.files[0]; this.value = ""; if(!f) return; shrinkImage(f, function(url){ if(url){ sync(); r.photos[0] = url; renderReview(true); } }); };
  $("backFile").onchange = function(){ var f = this.files && this.files[0]; this.value = ""; if(!f) return; shrinkImage(f, function(url){ if(url){ sync(); r.photos[1] = url; renderReview(true); } }); };
  $("parseBtn").addEventListener("click", function(){ sync(); var p = parseText(r.rawText); if(p.name) r.name = p.name; if(p.title) r.title = p.title; if(p.company) r.company = p.company; if(p.phones.length) r.phones = p.phones; if(p.emails.length) r.emails = p.emails; if(p.website) r.website = p.website; renderReview(true); toast("Parsed — check the fields"); });
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  $("micBtn").addEventListener("click", function(){
    if(!SR){ alert("Speech recognition is not available in this browser — type the details instead."); return; }
    var rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
    rec.onresult = function(ev){ var txt = ev.results[0][0].transcript; sync(); r.rawText = (r.rawText ? r.rawText + " " : "") + txt; renderReview(true); };
    rec.onerror = function(){ toast("Mic did not work — type instead"); };
    try { rec.start(); toast("Listening…"); } catch(e){}
  });
  $("ocrBtn").addEventListener("click", function(){
    if(!r.photos.length){ alert("Add a card photo first."); return; }
    if(!window.Tesseract){ alert("OCR library could not load (needs internet). You can still type the details."); return; }
    sync(); var st = $("ocrStatus"); st.textContent = "Reading the card… this can take a while.";
    var img = r.photos[0];
    function run(lang){ return Tesseract.recognize(img, lang); }
    run("eng+kor").catch(function(){ return run("eng"); }).then(function(res){
      var text = (res && res.data && res.data.text || "").trim();
      if(!text){ st.textContent = "OCR found no readable text — type the details or use Parse on your own text."; return; }
      r.rawText = text; var p = parseText(text);
      if(p.name) r.name = p.name; if(p.title) r.title = p.title; if(p.company) r.company = p.company;
      if(p.phones.length) r.phones = p.phones; if(p.emails.length) r.emails = p.emails; if(p.website) r.website = p.website;
      renderReview(true); $("ocrStatus").textContent = "OCR done (best-effort) — review and fix the fields before saving.";
    }).catch(function(){ st.textContent = "OCR failed — type the details instead."; });
  });
  $("r_save").addEventListener("click", function(){
    sync();
    if(!r.name.trim()){ alert("A name is required."); return; }
    var rec = { id: r.id || "c" + Date.now(), name: r.name.trim(), title: r.title, company: r.company, phones: r.phones, emails: r.emails, address: r.address, website: r.website, notes: r.notes, comment: r.comment, tags: r.tags, photos: r.photos, capturedDate: r.capturedDate, locationAddress: r.locationAddress, lat: r.lat, lon: r.lon, inputMethod: r.inputMethod || "photo" };
    if(r.id){ var ix = -1; DB.contacts.forEach(function(x, i){ if(x.id === r.id) ix = i; }); if(ix >= 0) DB.contacts[ix] = rec; }
    else DB.contacts.push(rec);
    if(r.draftId) DB.drafts = DB.drafts.filter(function(x){ return x.id !== r.draftId; });
    save(); reviewState = null; currentId = rec.id; view = "detail"; render(); toast("Contact saved");
  });
  $("r_draft").addEventListener("click", function(){
    sync();
    var dr = { id: r.draftId || "d" + Date.now(), rawText: r.rawText, comment: r.comment, photos: r.photos, capturedDate: r.capturedDate, locationAddress: r.locationAddress, lat: r.lat, lon: r.lon };
    if(r.draftId){ var ix = -1; DB.drafts.forEach(function(x, i){ if(x.id === r.draftId) ix = i; }); if(ix >= 0) DB.drafts[ix] = dr; }
    else DB.drafts.push(dr);
    save(); reviewState = null; view = "drafts"; render(); toast("Saved to Drafts");
  });
  $("r_discard").addEventListener("click", function(){ if(confirm("Discard this capture?")){ reviewState = null; view = "capture"; render(); } });
}

/* ---------- Contacts ---------- */
function renderContacts(){
  var list = DB.contacts.slice().sort(function(a, b){ return (a.name || "").localeCompare(b.name || ""); });
  if(query){ var q = query.toLowerCase(); list = list.filter(function(c){ return (c.name + " " + c.company + " " + c.phones.join(" ") + " " + c.emails.join(" ")).toLowerCase().indexOf(q) >= 0; }); }
  var h = '<div class="card"><h2 class="sec">My Contacts (' + DB.contacts.length + ')</h2><input id="q" placeholder="Search name, company, phone, email…" value="' + esc(query) + '"></div>';
  if(!list.length) h += '<div class="card"><p class="mut" style="margin:0">' + (query ? "No matches." : "No contacts yet — capture a card.") + '</p></div>';
  list.forEach(function(c){
    h += '<div class="card" data-c="' + c.id + '" style="cursor:pointer"><div class="row">' + (c.photos && c.photos[0] ? '<img class="thumb fix" src="' + c.photos[0] + '">' : '') + '<div><b style="font-size:16px">' + esc(c.name) + '</b><div class="mut">' + esc(c.title) + (c.company ? '<br>' + esc(c.company) : '') + '</div>' +
      (c.tags && c.tags.length ? '<div class="pills">' + c.tags.map(function(t){ return '<span class="pill on" style="cursor:default">' + esc(t) + '</span>'; }).join("") + '</div>' : '') + '</div></div></div>';
  });
  $("main").innerHTML = h;
  $("q").addEventListener("input", function(){ query = this.value; var pos = this.selectionStart; renderContacts(); var nq = $("q"); nq.focus(); nq.setSelectionRange(pos, pos); });
  document.querySelectorAll("[data-c]").forEach(function(el){ el.addEventListener("click", function(){ currentId = el.getAttribute("data-c"); view = "detail"; render(); window.scrollTo(0,0); }); });
}
function vcfFor(c){
  function e(s){ return String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
  var lines = ["BEGIN:VCARD", "VERSION:3.0", "FN:" + e(c.name)];
  if(c.company) lines.push("ORG:" + e(c.company));
  if(c.title) lines.push("TITLE:" + e(c.title));
  (c.phones || []).forEach(function(ph){ var isFax = /^fax/i.test(ph); lines.push("TEL;TYPE=" + (isFax ? "FAX" : "WORK") + ":" + e(ph.replace(/^fax\s*/i, ""))); });
  (c.emails || []).forEach(function(em){ lines.push("EMAIL:" + e(em)); });
  if(c.address) lines.push("ADR:;;" + e(c.address) + ";;;;");
  if(c.website) lines.push("URL:" + e(c.website));
  var note = c.notes || ""; if(c.comment) note = (note ? note + " — " : "") + c.comment;
  if(note) lines.push("NOTE:" + e(note));
  lines.push("END:VCARD");
  return lines.join("\r\n");
}
function renderDetail(){
  var c = contactById(currentId); if(!c){ view = "contacts"; render(); return; }
  var h = '<button class="small" id="backBtn">← Contacts</button>' +
    '<div class="card" style="margin-top:10px">' +
    (c.photos || []).map(function(ph, i){ return '<img class="card-photo" src="' + ph + '" alt="card ' + (i === 0 ? "front" : "back") + '">'; }).join("") +
    '<b style="font-size:19px">' + esc(c.name) + '</b>' +
    (c.title ? '<div>' + esc(c.title) + '</div>' : '') + (c.company ? '<div class="mut">' + esc(c.company) + '</div>' : '') +
    (c.phones || []).map(function(ph){ var num = ph.replace(/^fax\s*/i, ""); return '<div style="margin-top:7px">📞 <a href="tel:' + esc(num.replace(/[^+\d]/g, "")) + '">' + esc(ph) + '</a></div>'; }).join("") +
    (c.emails || []).map(function(em){ return '<div style="margin-top:5px">✉️ <a href="mailto:' + esc(em) + '">' + esc(em) + '</a></div>'; }).join("") +
    (c.address ? '<div style="margin-top:7px">📍 <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.address) + '">' + esc(c.address) + '</a></div>' : '') +
    (c.website ? '<div style="margin-top:5px">🌐 ' + esc(c.website) + '</div>' : '') +
    (c.notes ? '<p style="margin:10px 0 0"><b>Notes:</b> ' + esc(c.notes) + '</p>' : '') +
    (c.comment ? '<p style="margin:6px 0 0"><b>Comment:</b> ' + esc(c.comment) + '</p>' : '<p class="mut" style="margin:6px 0 0">Comment: —</p>') +
    (c.tags && c.tags.length ? '<div class="pills">' + c.tags.map(function(t){ return '<span class="pill on" style="cursor:default">' + esc(t) + '</span>'; }).join("") + '</div>' : '') +
    '<div class="mut" style="margin-top:10px">Captured ' + fmtDT(c.capturedDate) + (c.inputMethod ? ' via ' + esc(c.inputMethod) : '') +
    (c.locationAddress ? '<br>📍 ' + esc(c.locationAddress) : '') +
    (c.lat != null ? '<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + c.lat + ',' + c.lon + '">Open capture location in Maps ↗</a>' : '') + '</div>' +
    '<div class="row" style="margin-top:12px"><button id="vcfBtn">Export to Google Contacts (.vcf)</button><button id="shareBtn">Share summary</button></div>' +
    '<div class="row" style="margin-top:8px"><button id="editBtn">✏️ Edit</button><button class="danger" id="delBtn">🗑 Delete</button></div></div>';
  $("main").innerHTML = h;
  $("backBtn").addEventListener("click", function(){ view = "contacts"; render(); window.scrollTo(0,0); });
  $("vcfBtn").addEventListener("click", function(){ download((c.name || "contact").replace(/[^a-z0-9]+/gi, "-") + ".vcf", vcfFor(c), "text/vcard"); });
  $("shareBtn").addEventListener("click", function(){
    var text = [c.name, c.title, c.company, (c.phones || []).join(", "), (c.emails || []).join(", "), c.address].filter(Boolean).join("\n");
    if(navigator.share){ navigator.share({ title: c.name, text: text }).catch(function(){}); }
    else window.location.href = "mailto:?subject=" + encodeURIComponent("Contact: " + c.name) + "&body=" + encodeURIComponent(text);
  });
  $("editBtn").addEventListener("click", function(){ startReviewFromContact(c); });
  $("delBtn").addEventListener("click", function(){ if(confirm("Delete this contact?")){ DB.contacts = DB.contacts.filter(function(x){ return x.id !== c.id; }); save(); view = "contacts"; render(); } });
}

/* ---------- Drafts ---------- */
function renderDrafts(){
  var h = '<div class="card"><h2 class="sec">Drafts (' + DB.drafts.length + ')</h2>';
  if(!DB.drafts.length) h += '<p class="mut" style="margin:0">No drafts — start a capture and tap Save for later; it\'ll show up here.</p>';
  DB.drafts.forEach(function(dr){
    h += '<div style="border-top:1px dashed var(--line);padding-top:9px;margin-top:9px"><div class="mut">' + fmtDT(dr.capturedDate) + (dr.locationAddress ? ' · ' + esc(dr.locationAddress) : '') + '</div>' +
      '<div>' + esc((dr.rawText || "").slice(0, 120) || "(photo only)") + ((dr.rawText || "").length > 120 ? "…" : "") + '</div>' +
      '<div class="row" style="margin-top:6px"><button class="small" data-open="' + dr.id + '">Open</button><button class="small danger" data-del="' + dr.id + '">Delete</button></div></div>';
  });
  h += '</div>';
  $("main").innerHTML = h;
  document.querySelectorAll("[data-open]").forEach(function(b){ b.addEventListener("click", function(){ var dr = null; DB.drafts.forEach(function(x){ if(x.id === b.getAttribute("data-open")) dr = x; }); if(dr) startReviewFromDraft(dr); }); });
  document.querySelectorAll("[data-del]").forEach(function(b){ b.addEventListener("click", function(){ if(confirm("Delete this draft?")){ DB.drafts = DB.drafts.filter(function(x){ return x.id !== b.getAttribute("data-del"); }); save(); renderDrafts(); } }); });
}

/* ---------- Backup ---------- */
function renderBackup(){
  $("main").innerHTML = '<div class="card"><h2 class="sec">Backup</h2><p class="mut" style="margin-top:0">Contacts, drafts, tags and card photos live only on this device. Export a backup file and keep it somewhere safe (for example Google Drive); import it on another device or browser to restore everything. Backups with photos can be large.</p>' +
    '<div class="row"><button id="exportBtn">⬇ Export backup</button><button id="importBtn">⬆ Import backup</button></div></div>' +
    '<div class="card"><h2 class="sec">Export all contacts</h2><button id="vcfAllBtn">Download all as one .vcf (Google Contacts)</button></div>';
  $("exportBtn").addEventListener("click", function(){ download("contactscanner-backup.json", JSON.stringify(DB, null, 2), "application/json"); });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
  $("vcfAllBtn").addEventListener("click", function(){ download("all-contacts.vcf", DB.contacts.map(vcfFor).join("\r\n"), "text/vcard"); });
}
function download(name, text, type){
  var blob = new Blob([text], {type: type || "application/octet-stream"}); var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
$("importFile").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ try { var data = JSON.parse(rd.result); if(!data || !Array.isArray(data.contacts) || !Array.isArray(data.tags)) throw 0;
    if(confirm("Import this backup? It will replace all current contacts, drafts and tags.")){ DB = data; if(!Array.isArray(DB.drafts)) DB.drafts = []; save(); view = "contacts"; render(); toast("Backup imported"); } } catch(e){ alert("That file is not a valid ContactScanner backup."); } };
  rd.readAsText(f); this.value = "";
});

function render(){ setNav(); if(view === "capture") renderCapture(); else if(view === "review") renderReview(); else if(view === "contacts") renderContacts(); else if(view === "detail") renderDetail(); else if(view === "drafts") renderDrafts(); else if(view === "backup") renderBackup(); }
render();
window.CS = { getDB: function(){ return DB; }, parseText: parseText, vcfFor: vcfFor };
</script>
