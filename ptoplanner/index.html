<style>
:root{--pink:#9D174D;--pink2:#BE185D;--bg:#FDF2F8;--card:#FFFFFF;--ink:#500724;--mut:#64748B;--line:#FBCFE8;--danger:#B91C1C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pink);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .brand{font-size:19px;font-weight:800}
header .sub{font-size:12.5px;opacity:.9;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px}
button.primary{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
button.danger{color:var(--danger);border-color:#F3C2C2}
button.small{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:48px;resize:vertical}
label.fl{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
label.fl:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fix{flex:0 0 auto}
.mut{color:var(--mut);font-size:13px}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.pill.on{background:var(--pink);color:#fff;border-color:var(--pink);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;border:none;border-radius:0;padding:11px 0 13px;font-size:12.5px;color:var(--mut)}
nav button.on{color:var(--pink);font-weight:800}
h2.sec{font-size:17px;margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#500724;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:9;max-width:90vw;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{text-align:center;font-size:11px;color:var(--mut);padding:3px 0;font-weight:700}
.day{min-height:44px;border:1px solid #FCE7F3;border-radius:8px;padding:3px;font-size:12.5px;cursor:pointer;background:#fff;position:relative}
.day.out{opacity:.32}
.day.today{border-color:var(--pink2);border-width:2px}
.day.sel{background:#FDF2F8;border-color:var(--pink);border-width:2px}
.dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px}
.legend span{font-size:12px;color:var(--mut)}
.bal{display:flex;gap:8px}.bal .card{flex:1;text-align:left}
.bal .big{font-size:24px;font-weight:800}
.evrow{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px}.chk input{width:20px;height:20px}
</style>
</head>

function calendarHTML(person){
  var first = new Date(curYear, curMonth, 1);

  var cells = ['<div class="dow">Su</div><div class="dow">Mo</div><div class="dow">Tu</div><div class="dow">We</div><div class="dow">Th</div><div class="dow">Fr</div><div class="dow">Sa</div>'];
  for(var i = 0; i < 42; i++){
    var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    var iso = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    var evs = eventsOn(iso, person);
    var seen = {}, dots = "";
    evs.forEach(function(e){ if(!seen[e.category]){ seen[e.category] = 1; dots += '<span class="dot" style="background:' + CATS[e.category][1] + '"></span>'; } });
    cells.push('<div class="day' + (d.getMonth() !== curMonth ? " out" : "") + (iso === todayISO() ? " today" : "") + (iso === selDay ? " sel" : "") + '" data-day="' + iso + '">' + d.getDate() + '<div class="dots">' + dots + '</div></div>');
    if(i >= 34 && d.getMonth() !== curMonth && d.getDay() === 6) break;
  }
  return '<div class="cal">' + cells.join("") + '</div>';
}

    }).join("");
    document.querySelectorAll("[data-savebase]").forEach(function(btn){ btn.addEventListener("click", function(){
      var person = btn.getAttribute("data-savebase"); var v = parseFloat($("base_" + person).value) || 0;
      var rec = null; DB.balances.forEach(function(x){ if(x.person === person && x.year === balYear) rec = x; });
      if(!rec){ rec = { person: person, year: balYear, base: v, adjustments: [] }; DB.balances.push(rec); } else rec.base = v;
      save(); renderBalances(); toast("Balance saved");
    }); });
    document.querySelectorAll("[data-addadj]").forEach(function(btn){ btn.addEventListener("click", function(){
      var person = btn.getAttribute("data-addadj"); var label = $("adjlabel_" + person).value.trim(); var days = parseFloat($("adjdays_" + person).value);
      if(!label || !days) return;
      var rec = null; DB.balances.forEach(function(x){ if(x.person === person && x.year === balYear) rec = x; });
      if(!rec){ rec = { person: person, year: balYear, base: parseFloat($("base_" + person).value) || 15, adjustments: [] }; DB.balances.push(rec); }
      rec.adjustments.push({ label: label, days: days }); save(); renderBalances();
    }); });
    document.querySelectorAll("[data-deladj]").forEach(function(btn){ btn.addEventListener("click", function(){
      var parts = btn.getAttribute("data-deladj").split(":"); var rec = null;
      DB.balances.forEach(function(x){ if(x.person === parts[0] && x.year === balYear) rec = x; });
      if(rec){ rec.adjustments.splice(parseInt(parts[1], 10), 1); save(); renderBalances(); }
    }); });
  }
  renderBalances();
  $("balYearSel").addEventListener("change", function(){ balYear = parseInt(this.value, 10); renderBalances(); });
  function renderChildren(){
    $("childBox").innerHTML = DB.children.length ? DB.children.map(function(c, i){ return '<div class="row" style="margin-top:6px"><span style="flex:1"><b>' + esc(c.name) + '</b> <span class="mut">' + esc(c.schoolName || "") + (c.grade ? ' · ' + esc(c.grade) : '') + (c.birthday ? ' · 🎂 ' + fmtDate(c.birthday) : '') + '</span></span><button class="small danger fix" data-chdel="' + i + '">✕</button></div>'; }).join("") : '<p class="mut" style="margin:0">No child profiles yet. Add one to get started.</p>';
    document.querySelectorAll("[data-chdel]").forEach(function(b){ b.addEventListener("click", function(){ DB.children.splice(parseInt(b.getAttribute("data-chdel"), 10), 1); save(); renderChildren(); }); });
  }
  renderChildren();
  $("ch_add").addEventListener("click", function(){ var n = $("ch_name").value.trim(); if(!n) return; DB.children.push({ name: n, schoolName: $("ch_school").value, grade: $("ch_grade").value, birthday: $("ch_bday").value, notes: "" }); save(); renderChildren(); toast("Child added"); });
  function renderSchools(){
    $("schoolBox").innerHTML = DB.schools.map(function(s, i){ return '<div class="row" style="margin-top:6px"><span style="flex:1"><b>' + esc(s.name) + '</b> <span class="mut">Child: ' + esc(s.childName) + ' · ' + s.year + '</span></span><button class="small danger fix" data-scdel="' + i + '">✕</button></div>'; }).join("");
    document.querySelectorAll("[data-scdel]").forEach(function(b){ b.addEventListener("click", function(){ DB.schools.splice(parseInt(b.getAttribute("data-scdel"), 10), 1); save(); renderSchools(); }); });
  }
  renderSchools();
  $("sc_add").addEventListener("click", function(){ var n = $("sc_name").value.trim(); if(!n) return; DB.schools.push({ name: n, childName: $("sc_child").value.trim() || "Kid 1", year: parseInt($("sc_year").value, 10) || balYear }); save(); renderSchools(); });
  function renderCompanies(){
    $("coBox").innerHTML = DB.companies.map(function(c, i){ return '<div class="row" style="margin-top:6px"><span style="flex:1"><b>' + esc(c.name) + '</b> <span class="mut">— ' + personName(c.person) + '</span></span><button class="small danger fix" data-codel="' + i + '">✕</button></div>'; }).join("");
    document.querySelectorAll("[data-codel]").forEach(function(b){ b.addEventListener("click", function(){ DB.companies.splice(parseInt(b.getAttribute("data-codel"), 10), 1); save(); renderCompanies(); }); });
  }
  renderCompanies();
  $("co_add").addEventListener("click", function(){ var n = $("co_name").value.trim(); if(!n) return; DB.companies.push({ name: n, person: $("co_person").value }); save(); renderCompanies(); });
  $("copyLink").addEventListener("click", function(){ var url = window.location.href; if(navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast("App link copied"); }); else toast(url); });
  $("icsBtn").addEventListener("click", function(){ download("pto-planner.ics", icsAll(), "text/calendar"); });
}
function icsAll(){
  function ds(iso){ return iso.replace(/-/g, ""); }
  function nextDay(iso){ var p = iso.split("-"); var d = new Date(parseInt(p[0],10), parseInt(p[1],10) - 1, parseInt(p[2],10) + 1); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  var evts = DB.events.map(function(e){
    return ["BEGIN:VEVENT", "UID:" + e.id + "@ptoplanner", "DTSTART;VALUE=DATE:" + ds(e.date), "DTEND;VALUE=DATE:" + nextDay(e.endDate || e.date),
      "SUMMARY:" + ((e.notes || CATS[e.category][0]) + " (" + personName(e.person) + ")").replace(/,/g, "\\,"), "END:VEVENT"].join("\r\n");
  });
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//PTOPlanner//EN"].concat(evts, ["END:VCALENDAR"]).join("\r\n");
}

/* ---------- Backup ---------- */
function renderBackup(){
  $("main").innerHTML = '<div class="card"><h2 class="sec">Backup</h2><p class="mut" style="margin-top:0">Events, balances, children, schools and companies live only on this device. Export a backup file and keep it somewhere safe (for example Google Drive); import it on another device or browser to restore everything.</p>' +
    '<div class="row"><button id="exportBtn">⬇ Export backup</button><button id="importBtn">⬆ Import backup</button></div></div>';
  $("exportBtn").addEventListener("click", function(){ download("pto-planner-backup.json", JSON.stringify(DB, null, 2), "application/json"); });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
}
function download(name, text, type){
  var blob = new Blob([text], {type: type || "application/octet-stream"}); var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
$("importFile").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ try { var data = JSON.parse(rd.result); if(!data || !Array.isArray(data.events) || !Array.isArray(data.balances)) throw 0;
    if(confirm("Import this backup? It will replace all current planner data.")){ DB = data; save(); view = "home"; render(); toast("Backup imported"); } } catch(e){ alert("That file is not a valid PTO Planner backup."); } };
  rd.readAsText(f); this.value = "";
});

function render(){ setNav(); if(view === "home") renderHome(); else if(view === "evform") renderEvForm(); else if(view === "settings") renderSettings(); else if(view === "backup") renderBackup(); }
render();
window.PTO = { getDB: function(){ return DB; }, balanceFor: balanceFor, eventsOn: eventsOn, weekdayCount: weekdayCount, setMonth: function(y, m){ curYear = y; curMonth = m; }, setDay: function(iso){ selDay = iso; }, icsAll: icsAll };
</script>
