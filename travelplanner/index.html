<style>
:root{--teal:#0F766E;--teal-d:#115E59;--bg:#F0FDF9;--card:#FFFFFF;--ink:#134E4A;--mut:#5F7370;--line:#CCE8E0;--chip:#E6F4F1;--danger:#B91C1C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--teal);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .brand{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
header .sub{font-size:12.5px;opacity:.85;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px}
button.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
button.primary:active{background:var(--teal-d)}
button.danger{color:var(--danger);border-color:#F3C2C2}
button.small{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label.fl{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
label.fl:first-child{margin-top:0}
.row{display:flex;gap:8px}.row>*{flex:1}
.mut{color:var(--mut);font-size:13px}
.plan-card{cursor:pointer}
.plan-card h3{margin:0 0 4px;font-size:16.5px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{background:var(--chip);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600}
.day-h{font-size:16px;font-weight:800;margin:18px 0 8px}
.act{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--line);cursor:pointer}
.act:first-of-type{border-top:none}
.act .time{flex:0 0 86px;font-size:12.5px;color:var(--mut);line-height:1.5}
.act .body{flex:1;min-width:0}
.act .name{font-weight:700;font-size:15px}
.act .place{font-size:13px;color:var(--mut)}
.act .price{font-size:12.5px;font-weight:700;color:var(--teal-d);white-space:nowrap}
.act .detail{display:none;margin-top:6px;font-size:13.5px;line-height:1.55}
.act.open .detail{display:block}
.act .detail .tips{font-style:italic;border-left:3px solid var(--teal);padding-left:8px;margin-top:6px;color:var(--teal-d)}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.pill.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:50%;font-size:18px;padding:0}
.stepper .val{font-size:17px;font-weight:800;min-width:20px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;border:none;border-radius:0;padding:11px 0 13px;font-size:13px;color:var(--mut)}
nav button.on{color:var(--teal);font-weight:800}
.weather{background:#E0F2FE;border:1px solid #BAE6FD;color:#075985;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;display:none}
h2.sec{font-size:17px;margin:4px 0 10px}
.kv{font-size:13px;color:var(--mut);line-height:1.7}
.kv b{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#134E4A;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:9;max-width:90vw;text-align:center}
</style>
</head>

function planText(p){

  });

}

  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();

}
function icsFor(p){

  }); });

}
var WMO = {0:"☀️ Clear",1:"🌤 Mostly clear",2:"⛅ Partly cloudy",3:"☁️ Overcast",45:"🌫 Fog",48:"🌫 Fog",51:"🌦 Light drizzle",53:"🌦 Drizzle",55:"🌦 Drizzle",61:"🌧 Light rain",63:"🌧 Rain",65:"🌧 Heavy rain",66:"🌧 Freezing rain",67:"🌧 Freezing rain",71:"🌨 Light snow",73:"🌨 Snow",75:"🌨 Heavy snow",77:"🌨 Snow",80:"🌦 Showers",81:"🌦 Showers",82:"🌦 Heavy showers",85:"🌨 Snow showers",86:"🌨 Snow showers",95:"⛈ Thunderstorm",96:"⛈ Thunderstorm",99:"⛈ Thunderstorm"};
function loadWeather(p){
  var el = $("weatherBox"); if(!el) return;
  var place = (p.destination || "").split(",")[0].trim(); if(!place) return;
  fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name=" + encodeURIComponent(place))
    .then(function(r){ return r.json(); })
    .then(function(g){ if(!g.results || !g.results.length) throw 0; var loc = g.results[0];
      var end = addDays(p.plan_date, Math.max(0, p.num_days - 1));
      return fetch("https://api.open-meteo.com/v1/forecast?latitude=" + loc.latitude + "&longitude=" + loc.longitude + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&start_date=" + p.plan_date + "&end_date=" + end).then(function(r){ return r.json(); });
    })
    .then(function(f){ if(!f.daily || !f.daily.time) return;
      var parts = [];
      f.daily.time.forEach(function(t, i){ parts.push(fmtDate(t) + ": " + (WMO[f.daily.weather_code[i]] || "") + ", " + Math.round(f.daily.temperature_2m_min[i]) + "–" + Math.round(f.daily.temperature_2m_max[i]) + "°C" + (f.daily.precipitation_sum[i] > 0 ? ", " + f.daily.precipitation_sum[i] + " mm rain" : "")); });

    }).catch(function(){});
}

    box.innerHTML = '<label class="fl">Find ideas for ' + esc(place) + '</label>' +
      '<div class="row"><button data-link="https://www.google.com/search?q=' + q1 + '">🔎 Google: things to do</button>' +
      '<button data-link="https://www.tripadvisor.com/Search?q=' + q2 + '">🦉 TripAdvisor</button></div>' +
      '<div class="row" style="margin-top:8px"><button data-link="https://www.google.com/maps/search/' + q2 + '">🗺 Google Maps</button>' +
      '<button data-link="https://duckduckgo.com/?q=' + q1 + '">🌐 Web search</button></div>';
    var bs = box.querySelectorAll("[data-link]");
    for(var i=0;i<bs.length;i++) bs[i].addEventListener("click", function(){ window.open(this.getAttribute("data-link"), "_blank"); });
  }
  ideaLinks();
  ["f_location","f_destination"].forEach(function(id){ $(id).addEventListener("change", ideaLinks); });
  var steps = document.querySelectorAll("[data-step]");
  for(var i=0;i<steps.length;i++) steps[i].addEventListener("click", function(){
    var parts = this.getAttribute("data-step").split(":"); var k = parts[0], d = parseInt(parts[1],10);
    var max = k === "adults" ? 8 : (k === "kids" ? 5 : 2), min = k === "adults" ? 1 : 0;
    f[k] = Math.min(max, Math.max(min, (f[k] || 0) + d)); $("val_" + k).textContent = f[k];
  });
  var pills = document.querySelectorAll("[data-type]");
  for(var j=0;j<pills.length;j++) pills[j].addEventListener("click", function(){
    var t = this.getAttribute("data-type"); var ix = (f.activityTypes || []).indexOf(t);
    if(ix >= 0) f.activityTypes.splice(ix,1); else f.activityTypes.push(t);
    this.className = "pill" + (ix >= 0 ? "" : " on");
  });
  $("resetBtn").addEventListener("click", function(){ plannerState = defaultPlanner(); renderPlanner(); });
  $("startPlanBtn").addEventListener("click", function(){
    readForm();
    var days = [];
    for(var d = 0; d < f.numDays; d++) days.push({ date: addDays(f.planDate || new Date().toISOString().slice(0,10), d), label: "Day " + (d + 1), activities: [] });
    var np = { id: "u" + Date.now(), title: (f.location || f.destination || "My plan") + " — " + fmtDate(f.planDate), plan_date: f.planDate, num_days: f.numDays,
      destination: f.destination || f.location || "", origin: f.origin || "", created: "New", inputs: JSON.parse(JSON.stringify(f)), days: days };
    startEdit(np);
  });
}

/* ---------- Plan editor ---------- */
function startEdit(plan){ editState = plan; view = "edit"; render(); window.scrollTo(0,0); }
function renderEdit(){
  var p = editState; if(!p){ go("plans"); return; }
  var h = '<div class="card"><h2 class="sec">Edit plan</h2>' +
    '<label class="fl">Title</label><input id="e_title" value="' + esc(p.title) + '">' +
    '<div class="row"><div><label class="fl">Start date</label><input id="e_date" type="date" value="' + esc(p.plan_date) + '"></div>' +
    '<div><label class="fl">Destination</label><input id="e_dest" value="' + esc(p.destination) + '"></div></div>' +
    '<label class="fl">Origin</label><input id="e_origin" value="' + esc(p.origin) + '"></div>';
  p.days.forEach(function(d, di){
    h += '<div class="card"><label class="fl">Day ' + (di + 1) + ' — label</label><input data-daylabel="' + di + '" value="' + esc(d.label) + '">' +
      '<div class="mut" style="margin-top:4px">' + fmtDate(d.date) + '</div>';
    d.activities.forEach(function(a, ai){
      h += '<div style="border-top:1px dashed var(--line);padding-top:10px;margin-top:10px"><b>' + esc(a.start) + '–' + esc(a.end) + '</b> ' + esc(a.name) +
        ' <button class="small" data-editact="' + di + ':' + ai + '">Edit</button> <button class="small danger" data-delact="' + di + ':' + ai + '">✕</button></div>';
    });
    h += '<button class="small" data-addact="' + di + '" style="margin-top:10px">+ Add activity</button> ' +
      '<button class="small danger" data-delday="' + di + '">Remove day</button></div>';
  });
  h += '<div class="card"><button id="addDayBtn">+ Add day</button> <button class="primary" id="savePlanBtn">💾 Save plan</button> <button id="cancelEditBtn">Cancel</button></div>';
  $("main").innerHTML = h;
  function syncHead(){ p.title = $("e_title").value; p.plan_date = $("e_date").value; p.destination = $("e_dest").value; p.origin = $("e_origin").value;
    p.days.forEach(function(d, di){ var el = document.querySelector('[data-daylabel="' + di + '"]'); if(el) d.label = el.value; d.date = addDays(p.plan_date, di); });
    p.num_days = p.days.length; }
  $("addDayBtn").addEventListener("click", function(){ syncHead(); p.days.push({ date: addDays(p.plan_date, p.days.length), label: "Day " + (p.days.length + 1), activities: [] }); renderEdit(); });
  $("cancelEditBtn").addEventListener("click", function(){ editState = null; if(planById(p.id)){ currentPlanId = p.id; view = "plan"; } else view = "plans"; render(); });
  $("savePlanBtn").addEventListener("click", function(){
    syncHead();
    var ix = -1; for(var i=0;i<DB.plans.length;i++) if(DB.plans[i].id === p.id) ix = i;
    if(ix >= 0) DB.plans[ix] = p; else DB.plans.unshift(p);
    save(); editState = null; currentPlanId = p.id; view = "plan"; render(); toast("Plan saved");
  });
  var q = function(sel, fn){ var els = document.querySelectorAll(sel); for(var i=0;i<els.length;i++) els[i].addEventListener("click", fn); };
  q("[data-delday]", function(){ syncHead(); var di = parseInt(this.getAttribute("data-delday"),10); if(confirm("Remove this day?")){ p.days.splice(di,1); renderEdit(); } });
  q("[data-addact]", function(){ syncHead(); editActivity(parseInt(this.getAttribute("data-addact"),10), -1); });
  q("[data-editact]", function(){ syncHead(); var pr = this.getAttribute("data-editact").split(":"); editActivity(parseInt(pr[0],10), parseInt(pr[1],10)); });
  q("[data-delact]", function(){ syncHead(); var pr = this.getAttribute("data-delact").split(":"); p.days[parseInt(pr[0],10)].activities.splice(parseInt(pr[1],10), 1); renderEdit(); });
}
function editActivity(di, ai){
  var p = editState; var a = ai >= 0 ? p.days[di].activities[ai] : { start: "09:00", end: "10:00", name: "", place: "", address: "", price: "", url: "", category: "", desc: "", tips: "" };
  var h = '<div class="card"><h2 class="sec">' + (ai >= 0 ? "Edit" : "Add") + ' activity — Day ' + (di + 1) + '</h2>' +
    '<div class="row"><div><label class="fl">Start</label><input id="a_start" type="time" value="' + esc(a.start) + '"></div><div><label class="fl">End</label><input id="a_end" type="time" value="' + esc(a.end) + '"></div></div>' +
    '<label class="fl">Name</label><input id="a_name" value="' + esc(a.name) + '">' +
    '<label class="fl">Place</label><input id="a_place" value="' + esc(a.place) + '">' +
    '<label class="fl">Address</label><input id="a_address" value="' + esc(a.address) + '">' +
    '<div class="row"><div><label class="fl">Price</label><input id="a_price" value="' + esc(a.price) + '"></div><div><label class="fl">Category</label><input id="a_category" value="' + esc(a.category) + '"></div></div>' +
    '<label class="fl">Link (URL)</label><input id="a_url" value="' + esc(a.url) + '">' +
    '<label class="fl">Description</label><textarea id="a_desc">' + esc(a.desc) + '</textarea>' +
    '<label class="fl">Tips</label><textarea id="a_tips">' + esc(a.tips) + '</textarea>' +
    '<div class="row" style="margin-top:14px"><button class="primary" id="a_save">Save activity</button><button id="a_cancel">Back</button></div></div>';
  $("main").innerHTML = h; window.scrollTo(0,0);
  $("a_cancel").addEventListener("click", renderEdit);
  $("a_save").addEventListener("click", function(){
    var na = { start: $("a_start").value, end: $("a_end").value, name: $("a_name").value || "Activity", place: $("a_place").value, address: $("a_address").value, price: $("a_price").value, url: $("a_url").value, category: $("a_category").value, desc: $("a_desc").value, tips: $("a_tips").value };
    if(ai >= 0) p.days[di].activities[ai] = na; else p.days[di].activities.push(na);
    p.days[di].activities.sort(function(x, y){ return String(x.start).localeCompare(String(y.start)); });
    renderEdit();
  });
}

/* ---------- Settings ---------- */
function renderSettings(){
  var s = DB.settings;
  var h = '<div class="card"><h2 class="sec">Family defaults</h2>' +
    '<div class="row"><div><label class="fl">Adults</label><input id="s_adults" type="number" min="1" max="8" value="' + s.adults + '"></div>' +
    '<div><label class="fl">Kids</label><input id="s_kids" type="number" min="0" max="5" value="' + s.kids + '"></div>' +
    '<div><label class="fl">Kids\' ages</label><input id="s_kidsAges" value="' + esc(s.kidsAges) + '"></div></div>' +
    '<label class="fl">Home address</label><input id="s_home" value="' + esc(s.homeAddress) + '">' +
    '<label class="fl">Default origin</label><input id="s_origin" value="' + esc(s.defaultOrigin) + '">' +
    '<label class="fl">Default transport</label><select id="s_transport">' + TRANSPORTS.map(function(t){ return '<option value="' + t[0] + '"' + (s.transport === t[0] ? " selected" : "") + '>' + t[1] + '</option>'; }).join("") + '</select>' +
    '<label class="fl">Preferred activities</label><div class="pills">' + ACTIVITY_TYPES.map(function(t){ return '<span class="pill' + ((s.preferredActivities || []).indexOf(t) >= 0 ? " on" : "") + '" data-stype="' + esc(t) + '">' + esc(t) + '</span>'; }).join("") + '</div>' +
    '<label class="fl">Special notes</label><textarea id="s_notes">' + esc(s.specialNotes || "") + '</textarea>' +
    '<button class="primary" id="saveSettingsBtn" style="margin-top:12px">Save settings</button></div>' +
    '<div class="card"><h2 class="sec">Backup</h2><p class="mut" style="margin-top:0">Your plans and settings live only on this device. Export a backup file and keep it somewhere safe (for example Google Drive); import it on another device or browser to restore everything.</p>' +
    '<div class="row"><button id="exportBtn">⬇ Export backup</button><button id="importBtn">⬆ Import backup</button></div></div>' +
    '<div class="card"><h2 class="sec">Danger zone</h2><button class="danger" id="wipeBtn">Delete all saved plans</button></div>';
  $("main").innerHTML = h;
  var pills = document.querySelectorAll("[data-stype]");
  for(var i=0;i<pills.length;i++) pills[i].addEventListener("click", function(){
    var t = this.getAttribute("data-stype"); s.preferredActivities = s.preferredActivities || [];
    var ix = s.preferredActivities.indexOf(t); if(ix >= 0) s.preferredActivities.splice(ix,1); else s.preferredActivities.push(t);
    this.className = "pill" + (ix >= 0 ? "" : " on");
  });
  $("saveSettingsBtn").addEventListener("click", function(){
    s.adults = parseInt($("s_adults").value,10) || 2; s.kids = parseInt($("s_kids").value,10) || 0; s.kidsAges = $("s_kidsAges").value;
    s.homeAddress = $("s_home").value; s.defaultOrigin = $("s_origin").value; s.transport = $("s_transport").value; s.specialNotes = $("s_notes").value;
    save(); plannerState = null; toast("Settings saved");
  });
  $("exportBtn").addEventListener("click", function(){ download("travelplanner-backup.json", JSON.stringify(DB, null, 2), "application/json"); });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
  $("wipeBtn").addEventListener("click", function(){ if(confirm("Delete ALL saved plans? Settings are kept. This cannot be undone.")){ DB.plans = []; save(); toast("All plans deleted"); } });
}
$("importFile").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ try { var data = JSON.parse(rd.result); if(!data || !Array.isArray(data.plans) || !data.settings) throw 0;
    if(confirm("Import this backup? It will replace all current plans and settings.")){ DB = data; save(); plannerState = null; go("plans"); toast("Backup imported"); } } catch(e){ alert("That file is not a valid TravelPlanner backup."); } };
  rd.readAsText(f); this.value = "";
});

function render(){ setNav(); if(view === "plans") renderPlans(); else if(view === "plan") renderPlan(); else if(view === "planner") renderPlanner(); else if(view === "edit") renderEdit(); else if(view === "settings") renderSettings(); }
render();
window.TP = { getDB: function(){ return DB; } };
</script>
</body>
</html>
