<meta name="theme-color" content="#EA580C">
<style>
:root{--or:#EA580C;--or-d:#C2410C;--bg:#FFF7ED;--card:#FFFFFF;--ink:#431407;--mut:#78716C;--line:#FED7AA;--chip:#FFF7ED;--danger:#B91C1C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--or);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .brand{font-size:20px;font-weight:800;display:flex;gap:8px;align-items:center}
header .sub{font-size:12.5px;opacity:.9;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px}
button.primary{background:var(--or);border-color:var(--or);color:#fff;font-weight:700}
button.danger{color:var(--danger);border-color:#F3C2C2}
button.small{padding:6px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:52px;resize:vertical}
label.fl{display:block;font-size:12.5px;font-weight:700;margin:12px 0 5px;letter-spacing:.03em}
label.fl:first-child{margin-top:0}
.row{display:flex;gap:8px}.row>*{flex:1}
.mut{color:var(--mut);font-size:13px}
.step{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--or)}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.pill.on{background:var(--or);color:#fff;border-color:var(--or);font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;border:none;border-radius:0;padding:11px 0 13px;font-size:13px;color:var(--mut)}
nav button.on{color:var(--or);font-weight:800}
h2.sec{font-size:17px;margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#431407;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:9;max-width:90vw;text-align:center}
a{color:var(--or-d)}
img.photo{width:100%;height:170px;object-fit:cover;border-radius:10px;margin-bottom:8px}
input[type=range]{padding:0}
</style>
</head>

<script>
"use strict";
var LS_KEY = "eventScoutV1";
var MEM = null;
function lsGet(){ try { return window.localStorage.getItem(LS_KEY); } catch(e){ return MEM; } }
function lsSet(v){ MEM = v; try { window.localStorage.setItem(LS_KEY, v); } catch(e){} }
function save(){ lsSet(JSON.stringify(DB)); }
function defaultPrefs(){
  return { company:["Just me"], city:"", startFrom:"", home:"", transport:"My car", distance:25,
    interests:["Any interests"], budget:"none", budgetMax:"", when:"any", startDate:"", endDate:"",
    timeOfDay:"Any time of day", duration:"Any length", notes:"" };
}
function seedDB(){ return { prefs: defaultPrefs(), events: [] }; }
var DB;
try { var raw = lsGet(); DB = raw ? JSON.parse(raw) : seedDB(); if(!DB || !DB.prefs || !Array.isArray(DB.events)) DB = seedDB(); }
catch(e){ DB = seedDB(); }
save();

var COMPANY = ["Just me","My partner","Kids","Toddler or baby","Friends","Parents","Guests from out of town","Our dog"];
var TRANSPORT = ["My car","Rental car","Public transit","Walking","Bike"];
var INTERESTS = ["Any interests","Food & drink","Live music","Art & museums","Theater & shows","Comedy","Sports","Outdoors & nature","Festivals & fairs","Markets & pop-ups","Family & kids","Fitness & wellness","Classes & workshops","Film","Nightlife"];
var WHEN = [["any","Any upcoming day"],["today","Today"],["tomorrow","Tomorrow"],["weekend","This weekend"],["pick","Pick dates"]];
var TOD = ["Any time of day","Morning","Afternoon","Evening","Before 6pm"];
var DUR = ["Any length","Up to 1 hour","Up to 3 hours","Half day","Full day"];
var CATEGORIES = ["Live music","Food & drink","Art & museums","Theater & shows","Comedy","Sports","Outdoors & nature","Festivals & fairs","Markets & pop-ups","Family & kids","Fitness & wellness","Classes & workshops","Film","Nightlife","Other"];

var view = "search";
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function $(id){ return document.getElementById(id); }
function toast(msg){ var t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(function(){ t.style.display = "none"; }, 2600); }
function enc(s){ return encodeURIComponent(String(s || "")); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function isoOf(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function fmtDay(iso){ if(!iso) return ""; var p = iso.split("-"); var d = new Date(+p[0], +p[1]-1, +p[2]); var W = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return W[d.getDay()] + ", " + M[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }

function whenWords(p){
  var now = new Date();
  if(p.when === "today") return "today " + fmtDay(isoOf(now));
  if(p.when === "tomorrow"){ var t = new Date(now); t.setDate(t.getDate() + 1); return "tomorrow " + fmtDay(isoOf(t)); }
  if(p.when === "weekend"){ var s = new Date(now); var add = (6 - now.getDay() + 7) % 7; s.setDate(s.getDate() + add); var u = new Date(s); u.setDate(u.getDate() + 1); return "this weekend " + fmtDay(isoOf(s)) + " " + fmtDay(isoOf(u)); }
  if(p.when === "pick" && p.startDate) return fmtDay(p.startDate) + (p.endDate && p.endDate !== p.startDate ? " to " + fmtDay(p.endDate) : "");
  return "upcoming";
}
function interestWords(p){ return p.interests.filter(function(x){ return x !== "Any interests"; }); }
function buildLinks(p){
  var city = p.city.trim(); if(!city) return [];
  var ints = interestWords(p), when = whenWords(p);
  var base = ["events", city].concat(ints).join(" ") + " " + when;
  var withNotes = base + (p.budget === "free" ? " free" : (p.budget === "price" && p.budgetMax ? " under $" + p.budgetMax : "")) + (p.notes ? " " + p.notes : "");
  var links = [];
  links.push({ name: "Ticketmaster", desc: "Concerts, sports, theater and family shows on sale near " + city + ".", url: "https://www.ticketmaster.com/search?q=" + enc(city + " " + ints.join(" ") + " " + when) });
  links.push({ name: "Eventbrite", desc: "Local classes, festivals, food events and community gatherings.", url: "https://www.google.com/search?q=" + enc("site:eventbrite.com " + withNotes) });
  links.push({ name: "Meetup", desc: "Groups and recurring local meetups matching your interests.", url: "https://www.google.com/search?q=" + enc("site:meetup.com " + withNotes) });
  links.push({ name: "Facebook Events", desc: "What local venues and organizers are posting publicly.", url: "https://www.google.com/search?q=" + enc("site:facebook.com/events " + withNotes) });
  if(ints.indexOf("Live music") >= 0 || !ints.length)
    links.push({ name: "Bandsintown", desc: "Live music near you, by artist and venue.", url: "https://www.google.com/search?q=" + enc("site:bandsintown.com concerts " + city + " " + when) });
  links.push({ name: "Google Maps", desc: "Events and things to do around " + city + ", on the map.", url: "https://www.google.com/maps/search/" + enc((ints[0] || "events") + " near " + city) });
  links.push({ name: "All the web", desc: "Everything else: venue calendars, city guides, newspapers.", url: "https://www.google.com/search?q=" + enc(withNotes + " " + p.timeOfDay + (p.duration !== "Any length" ? " " + p.duration : "")) });
  return links;
}
function briefText(p){
  var ints = interestWords(p);
  return "EventScout brief — Events in " + p.city + " · " + whenWords(p) + " · " + p.timeOfDay + " · " + p.duration +
    "\nWho: " + p.company.join(", ") + " · Getting there: " + p.transport + " · Up to " + p.distance + " miles" + (p.startFrom ? " from " + p.startFrom : "") +
    "\nInterests: " + (ints.length ? ints.join(", ") : "anything") +
    "\nBudget: " + (p.budget === "free" ? "Free only" : p.budget === "price" ? "Up to $" + (p.budgetMax || "?") + " per person" : "No limit") +
    (p.notes ? "\nNotes: " + p.notes : "");
}

function setNav(){ var bs = document.querySelectorAll("nav button"); for(var i=0;i<bs.length;i++) bs[i].className = bs[i].getAttribute("data-nav") === view ? "on" : ""; }
document.querySelector("nav").addEventListener("click", function(e){ var b = e.target.closest("[data-nav]"); if(b){ syncForm(); view = b.getAttribute("data-nav"); render(); window.scrollTo(0,0); } });

function chipRow(items, selected, multi, attr){
  return items.map(function(x){ var on = multi ? selected.indexOf(x) >= 0 : selected === x; return '<span class="pill' + (on ? " on" : "") + '" data-' + attr + '="' + esc(x) + '">' + esc(x) + '</span>'; }).join("");
}
function renderSearch(){
  var p = DB.prefs;
  var h = '<div class="card"><div class="step">LIVE SOURCES · NOTHING STALE</div><h2 class="sec" style="font-size:19px">Find something worth going out for.</h2>' +
    '<p class="mut" style="margin:0">Tell EventScout who\'s coming, how far you\'ll go and what you feel like. It turns that into ready-made searches on the real event sites — Ticketmaster, Eventbrite, Meetup and more — so you see the actual, current listings.</p>' +
    '<div style="text-align:right;margin-top:6px"><button class="small" id="startOver">Start over</button></div></div>';

  h += '<div class="card"><div class="step">01 · COMPANY</div><h2 class="sec">Who\'s coming along</h2><p class="mut" style="margin-top:0">This shapes what to look for: stroller access, dog rules, group size, noise.</p>' +
    '<div class="pills" id="companyPills">' + chipRow(COMPANY, p.company, true, "company") + '</div>' +
    '<div class="row" style="margin-top:8px"><input id="customCompany" placeholder="Add someone"><button id="addCompanyBtn">Add your own option</button></div></div>';

  h += '<div class="card"><div class="step">02 · PLACE</div><h2 class="sec">Where and how far</h2>' +
    '<label class="fl">CITY OR AREA</label><input id="f_city" value="' + esc(p.city) + '" placeholder="e.g. Canton, GA">' +
    '<label class="fl">STARTING FROM</label><input id="f_from" value="' + esc(p.startFrom) + '" placeholder="Address or neighborhood">' +
    '<div class="row" style="margin-top:8px"><button class="small" id="saveHomeBtn">Save as my home</button><button class="small" id="useHomeBtn"' + (p.home ? "" : " disabled") + '>🏠 Use my home</button></div>' +
    '<label class="fl">GETTING THERE</label><div class="pills">' + chipRow(TRANSPORT, p.transport, false, "transport") + '</div>' +
    '<label class="fl">HOW FAR WE WILL DRIVE — <span id="distVal">' + p.distance + ' mi</span></label><input type="range" id="f_dist" min="1" max="100" value="' + p.distance + '"><div class="mut">Distance is measured from your starting point, door to door.</div></div>';

  h += '<div class="card"><div class="step">03 · INTERESTS</div><h2 class="sec">What you feel like doing</h2><p class="mut" style="margin-top:0">Pick as many as you want, type your own, or leave it open with Any interests.</p>' +
    '<div class="pills" id="interestPills">' + chipRow(INTERESTS, p.interests, true, "interest") + '</div>' +
    '<div class="row" style="margin-top:8px"><input id="customInterest" placeholder="Add a type"><button id="addInterestBtn">Add your own option</button></div></div>';

  h += '<div class="card"><div class="step">04 · BUDGET</div><h2 class="sec">What it can cost</h2><p class="mut" style="margin-top:0">Per person, for tickets or entry.</p>' +
    '<div class="pills">' + [["none","No budget limit"],["free","Free only"],["price","Up to a price I set"]].map(function(b){ return '<span class="pill' + (p.budget === b[0] ? " on" : "") + '" data-budget="' + b[0] + '">' + b[1] + '</span>'; }).join("") + '</div>' +
    (p.budget === "price" ? '<label class="fl">UP TO ($ PER PERSON)</label><input id="f_bmax" type="number" min="0" value="' + esc(p.budgetMax) + '">' : '') + '</div>';

  h += '<div class="card"><div class="step">05 · TIMING</div><h2 class="sec">When and for how long</h2>' +
    '<div class="pills">' + WHEN.map(function(x){ return '<span class="pill' + (p.when === x[0] ? " on" : "") + '" data-when="' + x[0] + '">' + x[1] + '</span>'; }).join("") + '</div>' +
    (p.when === "pick" ? '<div class="row"><div><label class="fl">FROM</label><input id="f_sd" type="date" value="' + esc(p.startDate) + '"></div><div><label class="fl">TO</label><input id="f_ed" type="date" value="' + esc(p.endDate) + '"></div></div>' : '') +
    '<label class="fl">TIME OF DAY</label><div class="pills">' + chipRow(TOD, p.timeOfDay, false, "tod") + '</div>' +
    '<label class="fl">HOW LONG WE CAN STAY</label><div class="pills">' + chipRow(DUR, p.duration, false, "dur") + '</div></div>';

  h += '<div class="card"><div class="step">06 · ANYTHING ELSE</div><h2 class="sec">Other conditions</h2><p class="mut" style="margin-top:0">The details only you would know.</p>' +
    '<textarea id="f_notes" placeholder="e.g. stroller-friendly, no long walks, needs parking, something our guests from out of town would love">' + esc(p.notes) + '</textarea></div>';

  h += '<button class="primary" id="findBtn" style="width:100%;padding:14px"' + (p.city.trim() ? "" : " disabled") + '>🔎 Find events</button>' +
    (p.city.trim() ? "" : '<p class="mut" style="text-align:center">Add a city or area in step 02 above to switch the search on.</p>') +
    '<div id="linksBox"></div>' +
    '<p class="mut" style="text-align:center;margin-top:14px">EventScout points at the live event sites — always double-check the details on the source page.</p>';
  $("main").innerHTML = h;
  bindSearch();
}
function syncForm(){
  if(view !== "search" || !$("f_city")) return;
  var p = DB.prefs;
  p.city = $("f_city").value; p.startFrom = $("f_from").value; p.distance = parseInt($("f_dist").value, 10) || 25;
  if($("f_notes")) p.notes = $("f_notes").value;
  if($("f_bmax")) p.budgetMax = $("f_bmax").value;
  if($("f_sd")) p.startDate = $("f_sd").value; if($("f_ed")) p.endDate = $("f_ed").value;
  save();
}
function bindSearch(){
  var p = DB.prefs;
  function pills(attr, fn){ document.querySelectorAll("[data-" + attr + "]").forEach(function(el){ el.addEventListener("click", function(){ syncForm(); fn(el.getAttribute("data-" + attr)); save(); renderSearch(); }); }); }
  pills("company", function(v){ var i = p.company.indexOf(v); if(i >= 0) p.company.splice(i,1); else p.company.push(v); });
  pills("transport", function(v){ p.transport = v; });
  pills("interest", function(v){ if(v === "Any interests"){ p.interests = ["Any interests"]; return; } p.interests = p.interests.filter(function(x){ return x !== "Any interests"; }); var i = p.interests.indexOf(v); if(i >= 0) p.interests.splice(i,1); else p.interests.push(v); if(!p.interests.length) p.interests = ["Any interests"]; });
  pills("budget", function(v){ p.budget = v; });
  pills("when", function(v){ p.when = v; });
  pills("tod", function(v){ p.timeOfDay = v; });
  pills("dur", function(v){ p.duration = v; });
  ["f_city","f_from","f_notes","f_bmax","f_sd","f_ed"].forEach(function(id){ var el = $(id); if(el) el.addEventListener("input", function(){ syncForm(); var fb = $("findBtn"); if(fb) fb.disabled = !DB.prefs.city.trim(); }); });
  $("f_dist").addEventListener("input", function(){ $("distVal").textContent = this.value + " mi"; syncForm(); });
  $("addCompanyBtn").addEventListener("click", function(){ var v = $("customCompany").value.trim(); if(!v) return; syncForm(); if(COMPANY.indexOf(v) < 0) COMPANY.push(v); if(p.company.indexOf(v) < 0) p.company.push(v); save(); renderSearch(); });
  $("addInterestBtn").addEventListener("click", function(){ var v = $("customInterest").value.trim(); if(!v) return; syncForm(); if(INTERESTS.indexOf(v) < 0) INTERESTS.push(v); p.interests = p.interests.filter(function(x){ return x !== "Any interests"; }); if(p.interests.indexOf(v) < 0) p.interests.push(v); save(); renderSearch(); });
  $("saveHomeBtn").addEventListener("click", function(){ syncForm(); if(!p.startFrom && !p.city){ alert("Type your address in Starting from first."); return; } p.home = p.startFrom || p.city; save(); renderSearch(); toast("Saved as my home"); });
  var uh = $("useHomeBtn"); if(uh) uh.addEventListener("click", function(){ syncForm(); p.startFrom = p.home; save(); renderSearch(); });
  $("startOver").addEventListener("click", function(){ var home = DB.prefs.home; DB.prefs = defaultPrefs(); DB.prefs.home = home; save(); renderSearch(); });
  $("findBtn").addEventListener("click", function(){
    syncForm();
    var links = buildLinks(DB.prefs);
    var box = $("linksBox");
    box.innerHTML = '<div class="card" style="margin-top:12px"><h2 class="sec">Found near you — live searches</h2>' +
      links.map(function(l, i){ return '<div class="row" style="align-items:center;margin-top:8px"><div><b>' + esc(l.name) + '</b><div class="mut">' + esc(l.desc) + '</div></div><button data-link="' + i + '">Search ↗</button></div>'; }).join("") +
      '<div class="row" style="margin-top:12px"><button id="copyBrief">📋 Copy the brief</button></div>' +
      '<p class="mut">Found something good? Open the Shortlist tab and add it with its source link, so the whole family can find it again.</p></div>';
    box.querySelectorAll("[data-link]").forEach(function(b){ b.addEventListener("click", function(){ window.open(links[parseInt(b.getAttribute("data-link"),10)].url, "_blank"); }); });
    $("copyBrief").addEventListener("click", function(){ var txt = briefText(DB.prefs); if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ toast("Brief copied"); }); else prompt("Copy the brief:", txt); });
    box.scrollIntoView();
  });
}

/* ---------- Shortlist ---------- */
function counts(){
  var now = new Date(); var monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7)); monday.setHours(0,0,0,0);
  var sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);
  var wk = 0, mo = 0;
  DB.events.forEach(function(e){ if(!e.day) return; var d = new Date(e.day + "T12:00:00"); if(d >= monday && d <= sunday) wk++; if(d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) mo++; });
  return { wk: wk, mo: mo };
}
function renderShortlist(){
  var c = counts();
  var evs = DB.events.slice().sort(function(a, b){ return (a.day || "9999") < (b.day || "9999") ? -1 : 1; });
  var h = '<div class="card"><h2 class="sec">Shortlist</h2><div class="mut">' + DB.events.length + ' events saved</div>' +
    '<div class="badges"><span class="badge">This week (' + c.wk + ')</span><span class="badge">This month (' + c.mo + ')</span></div>' +
    '<div class="row" style="margin-top:10px"><button class="primary" id="addEvBtn">+ Add an event</button><button id="goSearch">Go to search</button></div></div>';
  if(!evs.length) h += '<div class="card" style="text-align:center;padding:28px 14px"><div style="font-size:30px">🔖</div><b>No events on your shortlist yet</b><p class="mut">Use the search page to find something worth going out for, then add it here with its source link.</p></div>';
  evs.forEach(function(e){
    h += '<div class="card">' + (e.imageUrl ? '<img class="photo" src="' + esc(e.imageUrl) + '" alt="" onerror="this.style.display=\'none\'">' : '') +
      '<b>' + esc(e.title) + '</b>' + (e.category ? ' <span class="badge">' + esc(e.category) + '</span>' : '') +
      '<div class="mut" style="margin-top:3px">' + esc(e.dateText || fmtDay(e.day)) + (e.location ? '<br>📍 ' + esc(e.location) : '') + (e.distance ? ' · ' + esc(e.distance) : '') + (e.cost ? '<br>💵 ' + esc(e.cost) : '') + '</div>' +
      (e.summary ? '<p style="line-height:1.55;margin:8px 0">' + esc(e.summary) + '</p>' : '') +
      ((e.interested || []).length ? '<div class="mut">Interested: ' + esc(e.interested.join(", ")) + '</div>' : '') +
      '<div class="row" style="margin-top:8px">' + (e.sourceUrl ? '<button data-src="' + e.id + '">Open source ↗</button>' : '<span></span>') + '<button data-edit="' + e.id + '">Edit</button><button class="danger" data-del="' + e.id + '">× Remove</button></div></div>';
  });
  if(evs.length) h += '<div class="card"><h2 class="sec">Share the shortlist</h2><div class="row"><button id="shWa">WhatsApp</button><button id="shSms">Text message</button><button id="shMail">Email</button></div>' +
    '<button class="danger" id="removeAll" style="margin-top:10px;width:100%">Remove all</button>' +
    '<p class="mut">Tip: tap × Remove on a card to take one event off.</p></div>';
  $("main").innerHTML = h;
  $("addEvBtn").addEventListener("click", function(){ eventForm(null); });
  $("goSearch").addEventListener("click", function(){ view = "search"; render(); window.scrollTo(0,0); });
  document.querySelectorAll("[data-src]").forEach(function(b){ b.addEventListener("click", function(){ var e = null; DB.events.forEach(function(x){ if(x.id === b.getAttribute("data-src")) e = x; }); if(e && e.sourceUrl) window.open(e.sourceUrl, "_blank"); }); });
  document.querySelectorAll("[data-edit]").forEach(function(b){ b.addEventListener("click", function(){ var e = null; DB.events.forEach(function(x){ if(x.id === b.getAttribute("data-edit")) e = x; }); eventForm(e); }); });
  document.querySelectorAll("[data-del]").forEach(function(b){ b.addEventListener("click", function(){ DB.events = DB.events.filter(function(x){ return x.id !== b.getAttribute("data-del"); }); save(); renderShortlist(); }); });
  if(evs.length){
    function shareText(){ return "Our EventScout shortlist:\n" + evs.map(function(e){ return "• " + e.title + " — " + (e.dateText || fmtDay(e.day)) + (e.location ? " @ " + e.location : "") + (e.cost ? " (" + e.cost + ")" : "") + (e.sourceUrl ? "\n  " + e.sourceUrl : ""); }).join("\n"); }
    $("shWa").addEventListener("click", function(){ window.open("https://wa.me/?text=" + enc(shareText()), "_blank"); });
    $("shSms").addEventListener("click", function(){ window.open("sms:?&body=" + enc(shareText()), "_blank"); });
    $("shMail").addEventListener("click", function(){ window.open("mailto:?subject=" + enc("Our EventScout shortlist") + "&body=" + enc(shareText()), "_blank"); });
    $("removeAll").addEventListener("click", function(){ if(confirm("Remove all events from the shortlist?")){ DB.events = []; save(); renderShortlist(); } });
  }
}
function eventForm(e){
  var isNew = !e;
  e = e || { id: "", title: "", summary: "", day: "", dateText: "", location: "", distance: "", cost: "", category: "Family & kids", imageUrl: "", sourceUrl: "", sourceName: "", savedBy: "", interested: [] };
  var h = '<div class="card"><h2 class="sec">' + (isNew ? "Add an event" : "Edit event") + '</h2>' +
    '<label class="fl">EVENT TITLE</label><input id="e_title" value="' + esc(e.title) + '">' +
    '<label class="fl">SUMMARY</label><textarea id="e_summary">' + esc(e.summary) + '</textarea>' +
    '<div class="row"><div><label class="fl">DAY</label><input id="e_day" type="date" value="' + esc(e.day) + '"></div><div><label class="fl">DATE & TIME (AS SHOWN)</label><input id="e_datetext" value="' + esc(e.dateText) + '" placeholder="Sat, Nov 14, 2026 7:00 PM"></div></div>' +
    '<div class="row"><div><label class="fl">LOCATION</label><input id="e_loc" value="' + esc(e.location) + '"></div><div><label class="fl">DISTANCE</label><input id="e_dist" value="' + esc(e.distance) + '" placeholder="12 mi"></div></div>' +
    '<div class="row"><div><label class="fl">COST</label><input id="e_cost" value="' + esc(e.cost) + '" placeholder="$25 or Free"></div><div><label class="fl">CATEGORY</label><select id="e_cat">' + CATEGORIES.map(function(c){ return '<option' + (e.category === c ? " selected" : "") + '>' + c + '</option>'; }).join("") + '</select></div></div>' +
    '<label class="fl">SOURCE LINK</label><input id="e_src" value="' + esc(e.sourceUrl) + '">' +
    '<div class="row"><div><label class="fl">SOURCE NAME</label><input id="e_srcname" value="' + esc(e.sourceName) + '" placeholder="Ticketmaster"></div><div><label class="fl">IMAGE URL (OPTIONAL)</label><input id="e_img" value="' + esc(e.imageUrl) + '"></div></div>' +
    '<label class="fl">WHO IS INTERESTED (NAMES, COMMA-SEPARATED)</label><input id="e_int" value="' + esc((e.interested || []).join(", ")) + '">' +
    '<div class="row" style="margin-top:12px"><button class="primary" id="e_save">Save event</button><button id="e_cancel">Back</button></div></div>';
  $("main").innerHTML = h; window.scrollTo(0,0);
  $("e_cancel").addEventListener("click", renderShortlist);
  $("e_save").addEventListener("click", function(){
    var title = $("e_title").value.trim(); if(!title){ alert("Give the event a title."); return; }
    var rec = { id: e.id || ("ev" + Date.now()), title: title, summary: $("e_summary").value, day: $("e_day").value, dateText: $("e_datetext").value, location: $("e_loc").value, distance: $("e_dist").value, cost: $("e_cost").value, category: $("e_cat").value, imageUrl: $("e_img").value, sourceUrl: $("e_src").value, sourceName: $("e_srcname").value, savedBy: e.savedBy || "", interested: $("e_int").value.split(",").map(function(x){ return x.trim(); }).filter(Boolean) };
    if(isNew) DB.events.push(rec); else { var ix = -1; DB.events.forEach(function(x, i){ if(x.id === rec.id) ix = i; }); if(ix >= 0) DB.events[ix] = rec; }
    save(); view = "shortlist"; renderShortlist(); toast("Saved to your shortlist");
  });
}

/* ---------- Backup ---------- */
function renderBackup(){
  $("main").innerHTML = '<div class="card"><h2 class="sec">Backup</h2><p class="mut" style="margin-top:0">Your search settings and shortlist live only on this device. Export a backup file and keep it somewhere safe (for example Google Drive); import it on another device or browser to restore everything.</p>' +
    '<div class="row"><button id="exportBtn">⬇ Export backup</button><button id="importBtn">⬆ Import backup</button></div></div>';
  $("exportBtn").addEventListener("click", function(){ download("eventscout-backup.json", JSON.stringify(DB, null, 2)); });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
}
function download(name, text){
  var blob = new Blob([text], {type: "application/json"}); var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
$("importFile").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ try { var data = JSON.parse(rd.result); if(!data || !data.prefs || !Array.isArray(data.events)) throw 0;
    if(confirm("Import this backup? It will replace your current settings and shortlist.")){ DB = data; save(); view = "search"; render(); toast("Backup imported"); } } catch(e){ alert("That file is not a valid EventScout backup."); } };
  rd.readAsText(f); this.value = "";
});

function render(){ setNav(); if(view === "search") renderSearch(); else if(view === "shortlist") renderShortlist(); else if(view === "backup") renderBackup(); }
render();
window.ES = { getDB: function(){ return DB; }, buildLinks: buildLinks, whenWords: whenWords };
</script>
