<style>
  :root{
    --gold:#E9B44C; --gold-dark:#C98F1B;
    --ink:#232038; --muted:#6E6A85; --card:#FFFFFF; --line:#E7E2F2;
  }
  body.dark{
    --bg:#17142B; --bg2:#1F1B3A; --card:#262145; --ink:#F2EFE6; --muted:#B9B4D0; --line:#3A3560;
  }
  body.bright{
    --bg:#FAF6EF; --bg2:#F3EDDF; --card:#FFFFFF; --ink:#232038; --muted:#6E6A85; --line:#E7E2F2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; min-height:100vh}
  header{position:sticky; top:0; z-index:20; background:var(--bg2); border-bottom:1px solid var(--line); padding:10px 14px; display:flex; align-items:center; gap:10px}
  .logo{font-size:20px; font-weight:800; letter-spacing:.5px; cursor:pointer; white-space:nowrap}
  .logo span{color:var(--gold)}
  nav{display:flex; gap:6px; margin-left:auto}
  nav button, .hbtn{background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:7px 13px; font-size:14px; cursor:pointer}
  nav button.active{background:var(--gold); border-color:var(--gold); color:#241D05; font-weight:700}
  .hbtn{font-size:15px; padding:7px 10px}
  main{max-width:760px; margin:0 auto; padding:18px 14px 60px}
  .kicker{font-size:12px; letter-spacing:2.5px; color:var(--gold-dark); font-weight:700; text-transform:uppercase}
  body.dark .kicker{color:var(--gold)}
  h1{font-family:Georgia,"Times New Roman",serif; font-size:30px; margin:6px 0 4px; line-height:1.2}
  h2{font-family:Georgia,"Times New Roman",serif; font-size:22px; margin:22px 0 10px}
  .sub{color:var(--muted); margin:0 0 14px; line-height:1.5}
  .gold-btn{background:var(--gold); color:#241D05; border:none; border-radius:12px; padding:12px 18px; font-size:16px; font-weight:700; cursor:pointer}
  .gold-btn:disabled{opacity:.45}
  .ghost-btn{background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:11px 16px; font-size:15px; cursor:pointer}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin:0 0 12px}
  .child-card{display:flex; align-items:center; gap:12px}
  .child-emoji{font-size:34px}
  .child-name{font-size:18px; font-weight:700}
  .child-meta{color:var(--muted); font-size:14px}
  .story-card{display:flex; gap:12px; align-items:flex-start}
  .tile{flex:0 0 64px; width:64px; height:64px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:34px; color:#fff; overflow:hidden}
  .tile img{width:100%; height:100%; object-fit:cover}
  .story-main{flex:1; min-width:0}
  .story-title{font-family:Georgia,serif; font-size:19px; font-weight:700; margin:0 0 2px}
  .story-meta{color:var(--muted); font-size:13px; margin:0 0 4px}
  .story-sum{font-size:14px; line-height:1.45; margin:0 0 6px}
  .badges{display:flex; gap:6px; flex-wrap:wrap; margin:4px 0}
  .badge{font-size:11.5px; border:1px solid var(--line); border-radius:999px; padding:2.5px 9px; color:var(--muted)}
  .badge.gold{background:var(--gold); border-color:var(--gold); color:#241D05; font-weight:700}
  .link-btn{background:none; border:none; color:var(--gold-dark); font-size:15px; font-weight:700; cursor:pointer; padding:4px 2px}
  body.dark .link-btn{color:var(--gold)}
  .danger{color:#D9534F}
  .filters{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .filters .full{grid-column:1 / -1}
  label.f{display:block; font-size:13px; color:var(--muted); margin:0 0 4px}
  select, input[type=text], input[type=number], textarea{width:100%; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:15px; font-family:inherit}
  textarea{line-height:1.5; resize:vertical}
  .chips{display:flex; gap:6px; flex-wrap:wrap}
  .chip{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:7px 13px; font-size:14px; cursor:pointer}
  .chip.active{background:var(--gold); border-color:var(--gold); color:#241D05; font-weight:700}
  .cover{width:100%; max-height:340px; object-fit:cover; border-radius:16px; border:1px solid var(--line)}
  .cover-tile{width:100%; height:210px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:96px; color:#fff}
  .reader-text{line-height:1.65; margin:14px 0; min-height:180px}
  .reader-img{width:100%; border-radius:14px; border:1px solid var(--line); margin:6px 0 4px}
  .reader-bar{display:flex; align-items:center; gap:8px; margin-top:14px}
  .dots{display:flex; gap:5px; flex:1; justify-content:center; flex-wrap:wrap}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--line); border:none; padding:0; cursor:pointer}
  .dot.on{background:var(--gold)}
  .font-storybook{font-family:Georgia,"Times New Roman",serif}
  .font-clean{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .font-typewriter{font-family:"Courier New",Courier,monospace}
  dialog{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:16px; max-width:520px; width:calc(100% - 28px); padding:18px}
  dialog::backdrop{background:rgba(10,8,25,.55)}
  .seg{display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 12px}
  .seg button{flex:1; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:10px; padding:9px 6px; font-size:14px; cursor:pointer; min-width:96px}
  .seg button.active{background:var(--gold); border-color:var(--gold); color:#241D05; font-weight:700}
  .emoji-pick{font-size:24px; background:transparent; border:1px solid var(--line); border-radius:10px; padding:5px 8px; cursor:pointer}
  .emoji-pick.active{border-color:var(--gold); background:var(--gold)}
  input[type=range]{width:100%}
  .small{font-size:13px; color:var(--muted)}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#232038; color:#F2EFE6; padding:10px 16px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:50; max-width:92vw; text-align:center}
  .toast.show{opacity:1}
  .hidden{display:none !important}
  a{color:var(--gold-dark)}
  body.dark a{color:var(--gold)}
  .src-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line)}
  .src-row:last-child{border-bottom:none}
</style>
</head>
<body class="dark">
<header>
  <div class="logo" id="logoHome">🌙 <span>Nightlight</span></div>
  <nav>
    <button data-nav="shelf" class="active">Shelf</button>
    <button data-nav="find">Find</button>
    <button data-nav="create">Create</button>
  </nav>
  <button class="hbtn" id="brightToggle" title="Switch light mode">☀️</button>
  <button class="hbtn" id="settingsBtn" title="Reading settings">🎚️</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

  <h2 style="margin-top:0">Reading settings</h2>
  <label class="f">LIGHT</label>
  <div class="seg" id="segLight">
    <button data-v="bright">☀️ Bright — daytime</button>
    <button data-v="dark">🌙 Dark — night friendly</button>
  </div>
  <label class="f">FONT</label>
  <div class="seg" id="segFont">

     "text": "Sam was the shepherd boy of a quiet village on a green hill. Every day he took the sheep to graze, and every day he grew bored. 'Nothing ever happens here,' he sighed. 'I wish something exciting would happen.' One day, as he sat on a rock, he had an idea — a very bad idea.",

var db = null;
function save(){ lsSet(DB_KEY, JSON.stringify(db)); }
function load(){
  var raw = lsGet(DB_KEY);
  if(raw){ try { db = JSON.parse(raw); } catch(e){ db = null; } }
  if(!db || !db.stories || !db.children){
    db = JSON.parse(JSON.stringify(SEED));
    // self-heal: if a stored DB predates a seed fix, keep user data but restore library stories
  }
  if(!db.settings) db.settings = {light:"dark", font:"storybook", textSize:21};
  if(!db.shelf) db.shelf = {};
  if(!db.sources) db.sources = [];
  save();
}
/* ---------- helpers ---------- */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function toast(msg){ var t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function(){ t.classList.remove("show"); }, 2400); }
var THEMES = {fun:"Fun & silly", learning:"Learning", life_lesson:"Life lesson", fable:"Fable", calm:"Calm & sleepy", christmas:"Christmas", custom:"Custom topic"};
var TILE_COLORS = {fun:"#E8873A", learning:"#3E8E5A", life_lesson:"#7C5CBF", fable:"#2E7DA6", calm:"#4457A8", christmas:"#B03A3A", custom:"#8A6D3B"};
function storyById(id){ for(var i=0;i<db.stories.length;i++) if(db.stories[i].id === id) return db.stories[i]; return null; }
function activeChild(){ for(var i=0;i<db.children.length;i++) if(db.children[i].id === db.activeChildId) return db.children[i]; return db.children[0] || null; }
function wordsOf(story){ return story.pages.reduce(function(n,p){ return n + (p.text ? p.text.split(/\s+/).filter(Boolean).length : 0); }, 0); }
function coverOf(story){ return story.has_cover ? COVER : ""; }
function tileHTML(story, big){
  var cover = coverOf(story);
  if(cover) return '<img src="' + cover + '" alt="">';
  return esc(story.emoji || "📖");
}
function tileStyle(story){ var cover = coverOf(story); return cover ? "" : ' style="background:' + (TILE_COLORS[story.theme] || "#4457A8") + '"'; }
function badges(story){
  var b = '<span class="badge gold">' + story.reading_minutes + ' min</span>';
  b += '<span class="badge">' + esc(THEMES[story.theme] || story.theme) + '</span>';
  b += '<span class="badge">' + (story.has_drawings ? "Drawings" : "Text only") + '</span>';
  if(story.source_name) b += '<span class="badge">' + esc(story.source_name) + '</span>';
  else if(story.source === "ai" || story.source === "generated") b += '<span class="badge">Made for you</span>';
  else if(story.source === "family") b += '<span class="badge">Your story</span>';
  else b += '<span class="badge">Free classic</span>';
  return b;
}
function applySettings(){
  document.body.className = db.settings.light === "dark" ? "dark" : "bright";
  $("#brightToggle").textContent = db.settings.light === "dark" ? "☀️" : "🌙";
  $("#sizeRange").value = db.settings.textSize;
  $("#sizeLabel").textContent = db.settings.textSize + "px";
  $("#sizePreview").style.fontSize = db.settings.textSize + "px";
  $("#sizePreview").className = "font-" + db.settings.font;
  $$("#segLight button").forEach(function(b){ b.classList.toggle("active", b.dataset.v === db.settings.light); });
  $$("#segFont button").forEach(function(b){ b.classList.toggle("active", b.dataset.v === db.settings.font); });
}
/* ---------- navigation ---------- */
var view = "shelf";
function go(v){ view = v; $$("nav button").forEach(function(b){ b.classList.toggle("active", b.dataset.nav === v); }); render(); window.scrollTo(0,0); }
$$("nav button").forEach(function(b){ b.addEventListener("click", function(){ go(b.dataset.nav); }); });
$("#logoHome").addEventListener("click", function(){ go("shelf"); });
$("#brightToggle").addEventListener("click", function(){ db.settings.light = db.settings.light === "dark" ? "bright" : "dark"; save(); applySettings(); });
/* ---------- reading settings dialog ---------- */
$("#settingsBtn").addEventListener("click", function(){ applySettings(); $("#settingsDlg").showModal(); });
$("#settingsClose").addEventListener("click", function(){ $("#settingsDlg").close(); if(view === "reader") render(); });
$$("#segLight button").forEach(function(b){ b.addEventListener("click", function(){ db.settings.light = b.dataset.v; save(); applySettings(); }); });
$$("#segFont button").forEach(function(b){ b.addEventListener("click", function(){ db.settings.font = b.dataset.v; save(); applySettings(); }); });
$("#sizeRange").addEventListener("input", function(e){ db.settings.textSize = parseInt(e.target.value, 10); save(); applySettings(); });
</script>
<script>
"use strict";
var app = document.getElementById("app");
var detailId = null, readerState = null;
var findF = {len: 0, kind: "", q: "", age: 8, gender: "any", style: ""};
var CHILD_EMOJIS = ["🌙","⭐","🦊","🐻","🐰","🦄","🐢","🐳"];
function greeting(){ var h = new Date().getHours(); return h < 12 ? "GOOD MORNING" : (h < 18 ? "GOOD AFTERNOON" : "GOOD EVENING"); }
function shelfOf(childId){ return (db.shelf[childId] || []).map(storyById).filter(Boolean); }
function isSaved(childId, storyId){ return (db.shelf[childId] || []).indexOf(storyId) >= 0; }
function toggleSave(childId, storyId){
  if(!db.shelf[childId]) db.shelf[childId] = [];
  var i = db.shelf[childId].indexOf(storyId);
  if(i >= 0) db.shelf[childId].splice(i, 1); else db.shelf[childId].push(storyId);
  save();
}
function storyCard(story, opts){
  opts = opts || {};
  var child = activeChild();
  var saved = child && isSaved(child.id, story.id);
  var h = '<div class="card story-card"><div class="tile"' + tileStyle(story) + '>' + tileHTML(story) + '</div><div class="story-main">';
  h += '<p class="story-title">' + esc(story.title) + '</p>';
  h += '<p class="story-meta">' + esc(story.author) + ' · ages ' + story.age_min + '–' + story.age_max + '</p>';
  h += '<p class="story-sum">' + esc(story.summary) + '</p>';
  h += '<div class="badges">' + badges(story) + '</div>';
  h += '<div class="row">';
  h += '<button class="link-btn" data-read="' + story.id + '">Read</button>';
  if(opts.shelf){ h += '<button class="link-btn danger" data-remove="' + story.id + '">Remove from shelf</button>'; }
  else if(child){ h += '<button class="link-btn" data-save="' + story.id + '">' + (saved ? "✓ On " + esc(child.name) + "'s shelf" : "Save to shelf") + '</button>'; }
  if(story.source === "family"){ h += '<button class="link-btn" data-edit-story="' + story.id + '">Edit</button>'; }
  h += '</div></div></div>';
  return h;
}
function bindCards(root){
  $$("[data-read]", root).forEach(function(b){ b.addEventListener("click", function(){ detailId = b.dataset.read; view = "detail"; render(); window.scrollTo(0,0); }); });
  $$("[data-save]", root).forEach(function(b){ b.addEventListener("click", function(){ var c = activeChild(); if(!c) return; toggleSave(c.id, b.dataset.save); render(); toast("Shelf updated"); }); });
  $$("[data-remove]", root).forEach(function(b){ b.addEventListener("click", function(){ var c = activeChild(); if(!c) return; toggleSave(c.id, b.dataset.remove); render(); }); });
  $$("[data-edit-story]", root).forEach(function(b){ b.addEventListener("click", function(){ editStoryId = b.dataset.editStory; go("create"); }); });
}
/* ---------- SHELF ---------- */
function renderShelf(){
  var child = activeChild();
  var h = '<p class="kicker">' + greeting() + '</p>';
  h += '<h1>What shall we read' + (child ? ' to ' + esc(child.name) : '') + ' tonight?</h1>';
  h += '<p class="sub">Free classic stories, fables and gentle tales — or a brand-new one written just for tonight.</p>';
  h += '<div class="row"><button class="gold-btn" id="surpriseBtn">🎲 Surprise me</button><button class="ghost-btn" id="findBtn">Find a story</button><button class="ghost-btn" id="createBtn">Create a story</button></div>';
  h += '<h2>Readers</h2>';
  db.children.forEach(function(c){
    h += '<div class="card child-card"><div class="child-emoji">' + esc(c.emoji) + '</div><div style="flex:1"><div class="child-name">' + esc(c.name) + (c.id === db.activeChildId ? ' <span class="badge gold">reading now</span>' : '') + '</div><div class="child-meta">' + c.age + ' years · ' + esc(c.gender === "any" ? "prefer not to say" : c.gender) + '</div></div>';
    if(c.id !== db.activeChildId) h += '<button class="ghost-btn" data-switch-child="' + c.id + '">Switch</button>';
    h += '<button class="ghost-btn" data-edit-child="' + c.id + '">✏️ Edit</button></div>';
  });
  h += '<button class="ghost-btn" id="addChildBtn">＋ Add child</button>';
  if(child){
    h += '<h2>' + esc(child.name) + "'s shelf</h2>";
    var shelf = shelfOf(child.id);
    if(!shelf.length) h += '<p class="sub">Nothing saved yet — find a story and tap “Save to shelf”.</p>';
    shelf.forEach(function(s){ h += storyCard(s, {shelf: true}); });
  }
  h += '<h2>Your library data</h2><div class="card"><p class="small" style="margin-top:0">Everything lives on this device. Export a backup file to keep in Google Drive, and import it on another device or browser to move your readers, shelves, your own stories, sources and settings.</p><div class="row"><button class="ghost-btn" id="exportBtn">⬇ Export backup</button><button class="ghost-btn" id="importBtn">⬆ Import backup</button></div></div>';
  app.innerHTML = h;
  $("#surpriseBtn").addEventListener("click", function(){ var s = db.stories[Math.floor(Math.random() * db.stories.length)]; detailId = s.id; view = "detail"; render(); window.scrollTo(0,0); });
  $("#findBtn").addEventListener("click", function(){ go("find"); });
  $("#createBtn").addEventListener("click", function(){ go("create"); });
  $("#addChildBtn").addEventListener("click", function(){ openChildDlg(null); });
  $$("[data-switch-child]").forEach(function(b){ b.addEventListener("click", function(){ db.activeChildId = b.dataset.switchChild; save(); render(); }); });
  $$("[data-edit-child]").forEach(function(b){ b.addEventListener("click", function(){ openChildDlg(b.dataset.editChild); }); });
  $("#exportBtn").addEventListener("click", exportBackup);
  $("#importBtn").addEventListener("click", function(){ $("#importFile").click(); });
  bindCards(app);
}
/* ---------- FIND ---------- */
function findMatches(){
  return db.stories.filter(function(s){
    if(findF.len && s.reading_minutes > findF.len) return false;
    if(findF.kind && s.theme !== findF.kind) return false;
    if(findF.q){ var q = findF.q.toLowerCase(); if((s.title + " " + s.author).toLowerCase().indexOf(q) < 0) return false; }
    if(findF.age){ if(s.age_min > findF.age || s.age_max < findF.age) return false; }
    if(findF.gender && findF.gender !== "any" && s.gender !== "any" && s.gender !== findF.gender) return false;
    if(findF.style === "drawings" && !s.has_drawings) return false;
    if(findF.style === "text" && s.has_drawings) return false;
    return true;
  });
}
function renderFind(){
  var child = activeChild();
  if(child && !findF._init){ findF.age = child.age; findF.gender = child.gender; findF._init = true; }
  var h = '<p class="kicker">Library & open sources</p><h1>Find tonight\'s story</h1>';
  h += '<p class="sub">Fables, fairy tales, myths and classic tales — from your built-in library, plus open collections like Project Gutenberg, Internet Archive and Wikisource, and free children\'s story websites.</p>';
  h += '<div class="card"><div class="filters">';
  h += '<div class="full"><label class="f">Reading length</label><div class="chips" id="lenChips">';
  [[0,"Any length"],[5,"5 min"],[10,"10 min"],[15,"15 min"]].forEach(function(o){ h += '<button class="chip' + (findF.len === o[0] ? " active" : "") + '" data-len="' + o[0] + '">' + o[1] + '</button>'; });
  h += '</div></div>';
  h += '<div><label class="f">Story kind</label><select id="fKind"><option value="">Any kind</option>';
  Object.keys(THEMES).forEach(function(k){ h += '<option value="' + k + '"' + (findF.kind === k ? " selected" : "") + '>' + THEMES[k] + '</option>'; });
  h += '</select></div>';
  h += '<div><label class="f">Style</label><select id="fStyle"><option value="">Any style</option><option value="drawings"' + (findF.style === "drawings" ? " selected" : "") + '>Drawings included</option><option value="text"' + (findF.style === "text" ? " selected" : "") + '>Text only</option></select></div>';
  h += '<div class="full"><label class="f">Title or author</label><input type="text" id="fQ" placeholder="e.g. Andersen, Ugly Duckling" value="' + esc(findF.q) + '"></div>';
  h += '<div><label class="f">Child\'s age</label><input type="number" id="fAge" min="1" max="14" value="' + findF.age + '"></div>';
  h += '<div><label class="f">Gender</label><select id="fGender"><option value="any">Any</option><option value="girl"' + (findF.gender === "girl" ? " selected" : "") + '>Girl</option><option value="boy"' + (findF.gender === "boy" ? " selected" : "") + '>Boy</option></select></div>';
  h += '</div><p class="small">Text-only stories show a picture prompt for each page in the reader — the words the original app used to draw from.</p>';
  h += '<div class="row"><button class="ghost-btn" id="fReset">Reset</button></div></div>';
  var m = findMatches();
  h += '<h2>Matches: ' + m.length + ' stor' + (m.length === 1 ? 'y' : 'ies') + '</h2>';
  if(!m.length) h += '<p class="sub">No stories match those filters in the built-in library — try widening them, or look in the open collections below.</p>';
  m.forEach(function(s){ h += storyCard(s, {}); });
  h += '<h2>From open sources</h2><div class="card">';
  h += '<p class="small" style="margin-top:0">Open collections are one tap away — thousands more free, out-of-copyright stories to read online:</p>';
  [["Project Gutenberg — children's bookshelf", "https://www.gutenberg.org/ebooks/bookshelf/28"], ["Internet Archive — children's library", "https://archive.org/details/iacl"], ["Wikisource — children's literature", "https://en.wikisource.org/wiki/Portal:Children%27s_literature"], ["Storynory — free audio stories", "https://www.storynory.com"], ["SooperBooks", "https://sooperbooks.com"]].forEach(function(l){
    h += '<div class="src-row"><span style="flex:1">📚 ' + esc(l[0]) + '</span><a href="' + l[1] + '" target="_blank" rel="noopener">Open</a></div>';
  });
  h += '<p class="small"><b>Your own story websites</b> — searched alongside the open collections in the original app; here they are kept as your bookmarks:</p>';
  db.sources.forEach(function(src){
    var url = /^https?:\/\//.test(src.website) ? src.website : "https://" + src.website;
    h += '<div class="src-row"><span style="flex:1">🔗 ' + esc(src.name) + ' <span class="small">' + esc(src.website) + '</span></span><a href="' + esc(url) + '" target="_blank" rel="noopener">Open</a><button class="link-btn danger" data-del-src="' + src.id + '">Remove</button></div>';
  });
  h += '<div class="row" style="margin-top:10px"><input type="text" id="srcName" placeholder="Website name" style="flex:1"><input type="text" id="srcUrl" placeholder="Website address" style="flex:1"><button class="gold-btn" id="srcAdd">Add</button></div>';
  h += '</div>';
  app.innerHTML = h;
  $$("#lenChips .chip").forEach(function(c){ c.addEventListener("click", function(){ findF.len = parseInt(c.dataset.len, 10); render(); }); });
  $("#fKind").addEventListener("change", function(e){ findF.kind = e.target.value; render(); });
  $("#fStyle").addEventListener("change", function(e){ findF.style = e.target.value; render(); });
  $("#fQ").addEventListener("input", function(e){ findF.q = e.target.value; var pos = e.target.selectionStart; render(); var q = $("#fQ"); q.focus(); try { q.setSelectionRange(pos, pos); } catch(_){} });
  $("#fAge").addEventListener("change", function(e){ findF.age = parseInt(e.target.value, 10) || 0; render(); });
  $("#fGender").addEventListener("change", function(e){ findF.gender = e.target.value; render(); });
  $("#fReset").addEventListener("click", function(){ findF = {len:0, kind:"", q:"", age: child ? child.age : 8, gender: child ? child.gender : "any", style:"", _init:true}; render(); });
  $$("[data-del-src]").forEach(function(b){ b.addEventListener("click", function(){ db.sources = db.sources.filter(function(s){ return s.id !== b.dataset.delSrc; }); save(); render(); }); });
  $("#srcAdd").addEventListener("click", function(){
    var n = $("#srcName").value.trim(), u = $("#srcUrl").value.trim();
    if(!n || !u){ toast("Add a name and an address"); return; }
    db.sources.push({id: "src" + Date.now(), name: n, website: u}); save(); render(); toast("Website added");
  });
  bindCards(app);
}
/* ---------- STORY DETAIL + READER ---------- */
function renderDetail(){
  var s = storyById(detailId); if(!s){ go("shelf"); return; }
  var child = activeChild();
  var saved = child && isSaved(child.id, s.id);
  var cover = coverOf(s);
  var h = '<button class="link-btn" id="backBtn">← Back</button>';
  h += cover ? '<img class="cover" src="' + cover + '" alt="Cover">' : '<div class="cover-tile" style="background:' + (TILE_COLORS[s.theme] || "#4457A8") + '">' + esc(s.emoji || "📖") + '</div>';
  h += '<h1 style="margin-top:14px">' + esc(s.title) + '</h1>';
  h += '<p class="story-meta" style="font-size:15px">' + esc(s.author) + ' · ages ' + s.age_min + '–' + s.age_max + ' · ' + s.pages.length + ' pages · ~' + wordsOf(s) + ' words</p>';
  h += '<div class="badges">' + badges(s) + (saved ? '<span class="badge gold">✓ Saved to shelf</span>' : '') + '</div>';
  h += '<p style="line-height:1.6">' + esc(s.summary) + '</p>';
  if(s.topic) h += '<p class="small">Topic: ' + esc(s.topic) + '</p>';
  h += '<div class="row"><button class="gold-btn" id="startBtn">Start reading</button>';
  if(child) h += '<button class="ghost-btn" id="saveBtn">' + (saved ? "Remove from shelf" : "Save to shelf") + '</button>';
  h += '<button class="ghost-btn" id="shareBtn">Share story</button></div>';
  app.innerHTML = h;
  $("#backBtn").addEventListener("click", function(){ go("shelf"); });
  $("#startBtn").addEventListener("click", function(){ readerState = {id: s.id, page: 0}; view = "reader"; render(); window.scrollTo(0,0); });
  var sv = $("#saveBtn"); if(sv) sv.addEventListener("click", function(){ toggleSave(child.id, s.id); render(); });
  $("#shareBtn").addEventListener("click", function(){ shareStory(s); });
}
function shareStory(s){
  var text = s.title + " — " + s.summary;
  if(navigator.share){ navigator.share({title: s.title, text: text}).catch(function(){}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(function(){ toast("Story copied — paste it anywhere to share"); }); }
  else toast(text);
}
function renderReader(){
  var s = storyById(readerState.id); if(!s){ go("shelf"); return; }
  var p = s.pages[readerState.page];
  var child = activeChild();
  var saved = child && isSaved(child.id, s.id);
  var h = '<div class="row" style="justify-content:space-between"><button class="link-btn" id="rBack">← Back</button><span class="small">' + esc(s.title) + '</span><span class="small">' + (saved ? "✓ Saved to shelf" : "") + '</span></div>';
  if(p.image && IMGS[p.image]) h += '<img class="reader-img" src="' + IMGS[p.image] + '" alt="Illustration for page ' + (readerState.page + 1) + '">';
  else if(readerState.page === 0 && coverOf(s)) h += '<img class="reader-img" src="' + coverOf(s) + '" alt="Illustration for page 1">';
  h += '<div class="reader-text font-' + db.settings.font + '" style="font-size:' + db.settings.textSize + 'px">' + esc(p.text) + '</div>';
  if(p.image_prompt) h += '<p class="small">🖼️ Picture idea for this page: ' + esc(p.image_prompt) + '</p>';
  h += '<div class="reader-bar"><button class="ghost-btn" id="smallerBtn" title="Smaller text">A−</button>';
  h += '<button class="ghost-btn" id="prevBtn"' + (readerState.page === 0 ? " disabled" : "") + '>Back</button>';
  h += '<div class="dots">' + s.pages.map(function(_, i){ return '<button class="dot' + (i === readerState.page ? " on" : "") + '" data-page="' + i + '"></button>'; }).join("") + '</div>';
  h += '<span class="small">' + (readerState.page + 1) + ' · ' + s.pages.length + '</span>';
  if(readerState.page < s.pages.length - 1) h += '<button class="gold-btn" id="nextBtn">Next</button>';
  else h += '<button class="gold-btn" id="endBtn">The End 🌙</button>';
  h += '<button class="ghost-btn" id="biggerBtn" title="Larger text">A+</button></div>';
  app.innerHTML = h;
  $("#rBack").addEventListener("click", function(){ detailId = s.id; view = "detail"; render(); });
  $("#prevBtn").addEventListener("click", function(){ if(readerState.page > 0){ readerState.page--; render(); window.scrollTo(0,0); } });
  var nx = $("#nextBtn"); if(nx) nx.addEventListener("click", function(){ readerState.page++; render(); window.scrollTo(0,0); });
  var en = $("#endBtn"); if(en) en.addEventListener("click", function(){ detailId = s.id; view = "detail"; render(); toast("Sweet dreams 🌙"); });
  $$(".dot").forEach(function(d){ d.addEventListener("click", function(){ readerState.page = parseInt(d.dataset.page, 10); render(); window.scrollTo(0,0); }); });
  $("#smallerBtn").addEventListener("click", function(){ db.settings.textSize = Math.max(14, db.settings.textSize - 1); save(); applySettings(); render(); });
  $("#biggerBtn").addEventListener("click", function(){ db.settings.textSize = Math.min(32, db.settings.textSize + 1); save(); applySettings(); render(); });
}
/* ---------- CREATE (write your own) ---------- */
var editStoryId = null;
function renderCreate(){
  var editing = editStoryId ? storyById(editStoryId) : null;
  if(editing && editing.source !== "family") editing = null;
  var h = '<p class="kicker">Made for tonight</p><h1>' + (editing ? "Edit your story" : "Write your own story") + '</h1>';
  h += '<p class="sub">In the original app, an AI wrote the story. Here, the storyteller is you: write or paste a story, split it into pages, and it joins the shelf in the same reader. (The picture prompts below each page in the reader show what the original would have drawn.)</p>';
  h += '<div class="card">';
  h += '<label class="f">Title</label><input type="text" id="cTitle" value="' + (editing ? esc(editing.title) : "") + '" placeholder="e.g. The Brave Little Tooth">';
  h += '<div class="filters" style="margin-top:10px"><div><label class="f">Author</label><input type="text" id="cAuthor" value="' + (editing ? esc(editing.author) : "Made for your family") + '"></div>';
  h += '<div><label class="f">Story kind</label><select id="cTheme">';
  Object.keys(THEMES).forEach(function(k){ h += '<option value="' + k + '"' + (editing && editing.theme === k ? " selected" : "") + '>' + THEMES[k] + '</option>'; });
  h += '</select></div>';
  h += '<div><label class="f">Youngest age</label><input type="number" id="cAgeMin" min="1" max="14" value="' + (editing ? editing.age_min : 4) + '"></div>';
  h += '<div><label class="f">Oldest age</label><input type="number" id="cAgeMax" min="1" max="16" value="' + (editing ? editing.age_max : 10) + '"></div></div>';
  h += '<label class="f" style="margin-top:10px">Pages — separate each page with a line containing only ---</label>';
  h += '<textarea id="cPages" rows="12" placeholder="Page one text…\n---\nPage two text…">' + (editing ? esc(editing.pages.map(function(p){ return p.text; }).join("\n---\n")) : "") + '</textarea>';
  h += '<div class="row" style="margin-top:12px"><button class="gold-btn" id="cSave">' + (editing ? "Save changes" : "Save story to shelf") + '</button>';
  if(editing) h += '<button class="ghost-btn" id="cCancelEdit">Cancel edit</button><button class="ghost-btn danger" id="cDelete">Delete story</button>';
  h += '</div></div>';
  var mine = db.stories.filter(function(s){ return s.source === "family"; });
  if(mine.length){ h += '<h2>Your stories</h2>'; mine.forEach(function(s){ h += storyCard(s, {}); }); }
  h += '<h2>Story ideas</h2><div class="card">';
  h += '<p class="small" style="margin-top:0">A draft found in the original app\'s Create page, kept for you:</p><p>“' + esc(db.createDraft || "") + '”</p>';
  h += '<p class="small">More ideas from the original: “A shy little fox learns that trying again is braver than winning.” · “A gentle story about the sea and the tide going to sleep.”</p></div>';
  app.innerHTML = h;
  $("#cSave").addEventListener("click", function(){
    var title = $("#cTitle").value.trim();
    var raw = $("#cPages").value.trim();
    if(!title){ toast("Give the story a title"); return; }
    if(!raw){ toast("Write at least one page"); return; }
    var pages = raw.split(/\n\s*---\s*\n/).map(function(t){ return t.trim(); }).filter(Boolean).map(function(t){ return {text: t, image_prompt: ""}; });
    if(!pages.length){ toast("Write at least one page"); return; }
    var words = pages.reduce(function(n, p){ return n + p.text.split(/\s+/).filter(Boolean).length; }, 0);
    var data = {title: title, author: $("#cAuthor").value.trim() || "Made for your family", theme: $("#cTheme").value,
      age_min: parseInt($("#cAgeMin").value, 10) || 4, age_max: parseInt($("#cAgeMax").value, 10) || 10,
      pages: pages, reading_minutes: Math.max(1, Math.round(words / 130)),
      summary: pages[0].text.slice(0, 140) + (pages[0].text.length > 140 ? "…" : "")};
    if(editing){ Object.keys(data).forEach(function(k){ editing[k] = data[k]; }); toast("Story updated"); }
    else {
      var child = activeChild();
      var ns = Object.assign({id: "story" + Date.now(), source: "family", source_name: "", topic: "", gender: "any", has_drawings: false, is_free: true, emoji: "✏️"}, data);
      db.stories.unshift(ns);
      if(child){ if(!db.shelf[child.id]) db.shelf[child.id] = []; db.shelf[child.id].unshift(ns.id); }
      toast("Story saved to the shelf");
    }
    editStoryId = null; save(); go("shelf");
  });
  var ce = $("#cCancelEdit"); if(ce) ce.addEventListener("click", function(){ editStoryId = null; render(); });
  var cd = $("#cDelete"); if(cd) cd.addEventListener("click", function(){
    if(!confirm("Delete this story?")) return;
    db.stories = db.stories.filter(function(s){ return s.id !== editing.id; });
    Object.keys(db.shelf).forEach(function(k){ db.shelf[k] = db.shelf[k].filter(function(id){ return id !== editing.id; }); });
    editStoryId = null; save(); go("shelf");
  });
  bindCards(app);
}
/* ---------- child dialog ---------- */
var childEditId = null, childEmoji = "🐰";
function openChildDlg(id){
  childEditId = id;
  var c = id ? db.children.filter(function(x){ return x.id === id; })[0] : null;
  $("#childDlgTitle").textContent = c ? "Edit reader" : "Add a reader";
  $("#childName").value = c ? c.name : "";
  $("#childAge").value = c ? c.age : 8;
  $("#childGender").value = c ? c.gender : "girl";
  childEmoji = c ? c.emoji : "🐰";
  $("#childDelete").classList.toggle("hidden", !c);
  var row = $("#emojiRow"); row.innerHTML = "";
  CHILD_EMOJIS.forEach(function(e){
    var b = document.createElement("button"); b.className = "emoji-pick" + (e === childEmoji ? " active" : ""); b.textContent = e; b.type = "button";
    b.addEventListener("click", function(){ childEmoji = e; $$("#emojiRow .emoji-pick").forEach(function(x){ x.classList.toggle("active", x.textContent === e); }); });
    row.appendChild(b);
  });
  $("#childDlg").showModal();
}
$("#childCancel").addEventListener("click", function(){ $("#childDlg").close(); });
$("#childSave").addEventListener("click", function(){
  var name = $("#childName").value.trim(); if(!name){ toast("Add a name"); return; }
  var data = {name: name, age: Math.min(14, Math.max(1, parseInt($("#childAge").value, 10) || 8)), gender: $("#childGender").value, emoji: childEmoji};
  if(childEditId){ var c = db.children.filter(function(x){ return x.id === childEditId; })[0]; Object.keys(data).forEach(function(k){ c[k] = data[k]; }); }
  else { var nc = Object.assign({id: "child" + Date.now()}, data); db.children.push(nc); db.shelf[nc.id] = []; if(!db.activeChildId) db.activeChildId = nc.id; }
  save(); $("#childDlg").close(); render();
});
$("#childDelete").addEventListener("click", function(){
  if(!childEditId || !confirm("Delete this reader and their shelf?")) return;
  db.children = db.children.filter(function(x){ return x.id !== childEditId; });
  delete db.shelf[childEditId];
  if(db.activeChildId === childEditId) db.activeChildId = db.children.length ? db.children[0].id : null;
  save(); $("#childDlg").close(); render();
});
/* ---------- backup ---------- */
function exportBackup(){
  var blob = new Blob([JSON.stringify(db, null, 1)], {type: "application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nightlight-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  toast("Backup downloaded");
}
$("#importFile").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var data = JSON.parse(r.result);
      if(!data.stories || !data.children) throw new Error("bad file");
      if(!confirm("Import this backup? It replaces the readers, shelves, stories, sources and settings on this device.")) return;
      db = data; save(); applySettings(); go("shelf"); toast("Backup imported");
    } catch(_){ toast("That file is not a Nightlight backup"); }
    e.target.value = "";
  };
  r.readAsText(f);
});
/* ---------- main render ---------- */
function render(){
  $$("nav button").forEach(function(b){ b.classList.toggle("active", b.dataset.nav === view); });
  if(view === "shelf") renderShelf();
  else if(view === "find") renderFind();
  else if(view === "detail") renderDetail();
  else if(view === "reader") renderReader();
  else if(view === "create") renderCreate();
  else renderShelf();
}
load();
applySettings();
render();
window.DT = { getDB: function(){ return db; } };
</script>
