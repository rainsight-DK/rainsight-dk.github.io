<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf6ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Good News Daily</title>
<style>
  :root{
    --bg:#faf6ef; --card:#ffffff; --ink:#2b2620; --muted:#7a7264;
    --accent:#e4572e; --accent2:#f2a03d; --line:#eadfd0; --chip:#f6ecdd;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  .wrap{max-width:680px; margin:0 auto; padding:20px 16px 48px;}
  header{padding:10px 0 4px;}
  .brand{font-size:.8rem; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:700;}
  h1{font-family:Georgia,"Times New Roman",serif; font-size:2rem; line-height:1.15; margin:.3em 0 .15em;}
  .tagline{color:var(--muted); font-size:.95rem;}
  .dateline{color:var(--muted); font-size:.9rem; margin-top:14px;}
  .greeting{font-family:Georgia,serif; font-size:1.3rem; margin:2px 0 4px;}
  .sub{color:var(--muted); font-size:.92rem;}
  .stats{display:flex; gap:10px; margin:20px 0 8px;}
  .stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 10px; text-align:center;}
  .stat b{display:block; font-size:1.5rem; font-family:Georgia,serif;}
  .stat span{font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  h2.section{font-family:Georgia,serif; font-size:1.25rem; margin:26px 0 4px;}
  .section-sub{color:var(--muted); font-size:.85rem; margin-bottom:10px;}
  a.card{display:block; text-decoration:none; color:inherit; background:var(--card);
    border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:12px;}
  a.card:active{transform:scale(.995);}
  .thumb{width:100%; height:170px; object-fit:cover; display:block; background:linear-gradient(135deg,var(--accent2),var(--accent));}
  .thumb-fallback{height:88px; background:linear-gradient(135deg,#ffe8c9,var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:2rem;}
  .body{padding:12px 14px 14px;}
  .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
  .chip{background:var(--chip); color:#8a5a12; font-size:.68rem; font-weight:700; letter-spacing:.05em;
    text-transform:uppercase; padding:3px 8px; border-radius:999px;}
  .source{font-size:.78rem; color:var(--muted);}
  .read{font-size:.78rem; color:var(--muted); margin-left:auto;}
  .title{font-family:Georgia,serif; font-size:1.12rem; line-height:1.3; margin:2px 0 6px;}
  .summary{font-size:.9rem; color:#4c463c; line-height:1.45;}
  .list .thumb{display:none;}
  .updated{color:var(--muted); font-size:.78rem; text-align:center; margin-top:24px;}
  .err{background:#fff3f0; border:1px solid #f3c6b8; color:#8a3b22; border-radius:12px; padding:12px 14px; font-size:.9rem;}
</style>

function cardHTML(s, featured){
  const img = s.image
    ? '<img class="thumb" src="'+esc(s.image)+'" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;thumb-fallback&quot;>🌞</div>\'">'
    : (featured ? '<div class="thumb-fallback">🌞</div>' : '');
  return '<a class="card" href="'+esc(s.link)+'" target="_blank" rel="noopener">'
    + img
    + '<div class="body"><div class="meta">'
    + '<span class="chip">'+esc(s.category)+'</span>'
    + '<span class="source">'+esc(s.source)+'</span>'
    + '<span class="read">'+(s.read_minutes||1)+' min</span></div>'
    + '<div class="title">'+esc(s.title)+'</div>'
    + '<div class="summary">'+esc(s.summary)+'</div>'
    + '</div></a>';
}

fetch('stories.json?t=' + Date.now(), { cache:'no-store' })
  .then(r => { if(!r.ok) throw new Error('feed'); return r.json(); })
  .then(data => {
    const stories = data.stories || [];
    const todayStr = now.toDateString();
    const newToday = stories.filter(s => s.published && new Date(s.published).toDateString() === todayStr).length;
    document.getElementById('stat-new').textContent = newToday;
    document.getElementById('stat-total').textContent = stories.length;
    document.getElementById('more-sub').textContent = stories.length + ' stories and counting';
    document.getElementById('featured').innerHTML = stories.slice(0,3).map(s => cardHTML(s,true)).join('');
    document.getElementById('more').innerHTML = stories.slice(3).map(s => cardHTML(s,false)).join('');
    if (data.generated_at){
      const g = new Date(data.generated_at);
      document.getElementById('updated').textContent =
        'Stories refreshed ' + g.toLocaleDateString(undefined,{month:'short',day:'numeric'})
        + ' ' + g.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})
        + ' · Sources: Good News Network, Positive News, The Optimist Daily, Reasons to be Cheerful';
    }
  })
  .catch(() => {
    document.getElementById('featured').innerHTML =
      '<div class="err">Could not load the latest stories. Check your connection and reopen the app.</div>';
  });
</script>
</body>
</html>
