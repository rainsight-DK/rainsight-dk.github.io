<link rel="manifest" href='data:application/manifest+json,{"name":"MyDayPlan","short_name":"MyDayPlan","start_url":".","display":"standalone","background_color":"%230369A1","theme_color":"%230369A1","icons":[{"src":"icon.svg","sizes":"any","type":"image/svg+xml"}]}'>
<meta name="theme-color" content="#0369A1">
<style>
:root{--sky:#0369A1;--sky-d:#075985;--bg:#E0F2FE;--card:#FFFFFF;--ink:#0C4A6E;--mut:#64748B;--line:#BAE6FD;--danger:#B91C1C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--sky);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .brand{font-size:19px;font-weight:800}
header .sub{font-size:12.5px;opacity:.9;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px}
button.primary{background:var(--sky);border-color:var(--sky);color:#fff;font-weight:700}
button.danger{color:var(--danger);border-color:#F3C2C2}
button.small{padding:6px 10px;font-size:13px}
a.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:10px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:52px;resize:vertical}
label.fl{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
label.fl:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fix{flex:0 0 auto}
.mut{color:var(--mut);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;border:none;border-radius:0;padding:10px 0 12px;font-size:11.5px;color:var(--mut)}
nav button.on{color:var(--sky);font-weight:800}
h2.sec{font-size:17px;margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#0C4A6E;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:9;max-width:90vw;text-align:center}
.big{font-size:22px;font-weight:800}
.task{display:flex;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:9px;margin-top:9px}
.task input[type=checkbox]{width:22px;height:22px;flex:0 0 auto}
.done-t{text-decoration:line-through;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="brand">🌅 MyDayPlan</div>
  <div class="sub">Plan your perfect day</div>
</header>
<main id="main"></main>
<nav>
  <button data-nav="home" class="on">🏠 Home</button>
  <button data-nav="morning">🌅 Morning</button>
  <button data-nav="day">☀️ Day</button>
  <button data-nav="evening">🌙 Evening</button>
  <button data-nav="settings">⚙️ Settings</button>
  <button data-nav="backup">💾 Backup</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">
<script>
"use strict";
var LS_KEY = "myDayPlanV1";
var SEED = {"settings": {"morningAffirmation": "", "eveningAffirmation": "", "dailyQuote": "", "quoteTheme": "Motivation", "locationName": "", "lat": null, "lon": null}, "days": {}};
var MEM = null;
function lsGet(){ try { return window.localStorage.getItem(LS_KEY); } catch(e){ return MEM; } }
function lsSet(v){ MEM = v; try { window.localStorage.setItem(LS_KEY, v); } catch(e){} }
function save(){ lsSet(JSON.stringify(DB)); }
function seedDB(){ return JSON.parse(JSON.stringify(SEED)); }
var DB;
try { var raw = lsGet(); DB = raw ? JSON.parse(raw) : seedDB(); if(!DB || !DB.settings || !DB.days) DB = seedDB(); }
catch(e){ DB = seedDB(); }
save();

var MOODS = ["Relaxing","Energetic","Focus","Happy","Calm","Workout"];
var MEAL_SLOTS = [["breakfast","🍳 Breakfast"],["lunchbox","🥪 Lunchbox"],["snacks","🍎 Snacks"]];
var view = "home", selDate = todayISO(), wxCache = {};
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function $(id){ return document.getElementById(id); }
function toast(msg){ var t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(function(){ t.style.display = "none"; }, 2600); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function todayISO(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function addDays(iso, n){ var p = iso.split("-"); var d = new Date(parseInt(p[0],10), parseInt(p[1],10) - 1, parseInt(p[2],10) + n); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function fmtDate(iso){ var p = iso.split("-"); var d = new Date(parseInt(p[0],10), parseInt(p[1],10) - 1, parseInt(p[2],10)); var D = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return D[d.getDay()] + ", " + M[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }
function day(iso){ if(!DB.days[iso]) DB.days[iso] = { meals: { breakfast: "", lunchbox: "", snacks: "" }, tasks: [], mood: "Relaxing" }; return DB.days[iso]; }
function setNav(){ var bs = document.querySelectorAll("nav button"); for(var i=0;i<bs.length;i++) bs[i].className = bs[i].getAttribute("data-nav") === view ? "on" : ""; }
document.querySelector("nav").addEventListener("click", function(e){ var b = e.target.closest("[data-nav]"); if(b){ view = b.getAttribute("data-nav"); render(); window.scrollTo(0,0); } });

/* ---------- weather (Open-Meteo, keyless) ---------- */
var WX = {0:["☀️","Clear"],1:["🌤️","Mostly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],45:["🌫️","Fog"],48:["🌫️","Fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌦️","Drizzle"],61:["🌧️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],66:["🌧️","Freezing rain"],67:["🌧️","Freezing rain"],71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["🌨️","Heavy snow"],77:["🌨️","Snow grains"],80:["🌦️","Showers"],81:["🌧️","Showers"],82:["⛈️","Violent showers"],85:["🌨️","Snow showers"],86:["🌨️","Snow showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm + hail"],99:["⛈️","Thunderstorm + hail"]};
function wxHTML(iso){
  var s = DB.settings;
  if(s.lat == null || s.lon == null) return '<p class="mut" style="margin:0">Set your location for weather — in Settings, or use the button on the Morning page.</p>';
  var c = wxCache[iso];
  if(c === "loading") return '<p class="mut" style="margin:0">Loading weather for ' + esc(s.locationName || "") + '…</p>';
  if(!c) { loadWx(iso); return '<p class="mut" style="margin:0">Loading weather for ' + esc(s.locationName || "") + '…</p>'; }
  if(c === "error") return '<p class="mut" style="margin:0">Weather is unavailable right now (Open-Meteo).</p>';
  var w = WX[c.code] || ["🌡️",""];
  return '<div style="font-size:16px">' + w[0] + ' <b>' + Math.round(c.temp) + '°F</b> ' + w[1] + ' · Hi ' + Math.round(c.hi) + '° / Lo ' + Math.round(c.lo) + '°' + (c.rain != null ? ' · Rain chance ' + Math.round(c.rain) + '%' : '') + '</div><div class="mut">' + esc(s.locationName || "") + ' · Open-Meteo</div>';
}
function loadWx(iso){
  if(wxCache[iso]) return; wxCache[iso] = "loading";
  var s = DB.settings;
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + s.lat + "&longitude=" + s.lon + "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&start_date=" + iso + "&end_date=" + iso;
  fetch(url).then(function(r){ return r.json(); }).then(function(j){
    wxCache[iso] = { temp: j.current.temperature_2m, code: j.current.weather_code, hi: j.daily.temperature_2m_max[0], lo: j.daily.temperature_2m_min[0], rain: (j.daily.precipitation_probability_max || [null])[0] };
    if(view === "morning" || view === "day" || view === "home") render();
  }).catch(function(){ wxCache[iso] = "error"; });
}
function geocode(name, done){
  fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=" + encodeURIComponent(name)).then(function(r){ return r.json(); }).then(function(j){
    if(j.results && j.results.length){ var g = j.results[0]; DB.settings.lat = g.latitude; DB.settings.lon = g.longitude; DB.settings.locationName = g.name + (g.admin1 ? ", " + g.admin1 : ""); save(); wxCache = {}; done(true); }
    else done(false);
  }).catch(function(){ done(false); });
}

/* ---------- shared pieces ---------- */
function dateBar(){
  return '<div class="card"><div class="row"><button class="fix" id="dPrev">‹</button><div style="text-align:center"><b>' + fmtDate(selDate) + '</b>' + (selDate === todayISO() ? ' <span class="mut">(today)</span>' : '') + '</div><button class="fix" id="dNext">›</button><button class="fix" id="dToday">Today</button></div>' +
    '<input type="date" id="dPick" value="' + selDate + '" style="margin-top:8px"></div>';
}
function bindDateBar(){
  $("dPrev").addEventListener("click", function(){ selDate = addDays(selDate, -1); render(); });
  $("dNext").addEventListener("click", function(){ selDate = addDays(selDate, 1); render(); });
  $("dToday").addEventListener("click", function(){ selDate = todayISO(); render(); });
  $("dPick").addEventListener("change", function(){ if(this.value) selDate = this.value; render(); });
}
function mealsHTML(d){
  return '<div class="card"><h2 class="sec">🍽️ Meals</h2>' + MEAL_SLOTS.map(function(ms){
    var v = d.meals[ms[0]] || "";
    return '<label class="fl">' + ms[1] + '</label><div class="row"><input data-meal="' + ms[0] + '" value="' + esc(v) + '" placeholder="Type a meal or paste a recipe URL">' +
      '<a class="btn fix" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(ms[0] + " recipe ideas") + '">Need ideas?</a></div>' +
      (v && v.indexOf("http") === 0 ? '<div style="margin-top:4px"><a href="' + esc(v) + '" target="_blank" rel="noopener">Open recipe ↗</a></div>' : '');
  }).join("") + '<button class="primary" id="saveMealsBtn" style="margin-top:12px">Save meals</button></div>';
}
function bindMeals(d){
  var b = $("saveMealsBtn"); if(!b) return;
  b.addEventListener("click", function(){ document.querySelectorAll("[data-meal]").forEach(function(el){ d.meals[el.getAttribute("data-meal")] = el.value; }); save(); toast("Meals saved"); });
}
function musicHTML(d){
  return '<div class="card"><h2 class="sec">🎵 Music</h2><div class="row"><select id="moodSel">' + MOODS.map(function(mo){ return '<option' + (d.mood === mo ? " selected" : "") + '>' + mo + '</option>'; }).join("") + '</select><input id="moodText" placeholder="Or type a mood…"></div>' +
    '<button class="primary" id="musicBtn" style="margin-top:10px">Find Music on Spotify</button></div>';
}
function bindMusic(d){
  $("musicBtn").addEventListener("click", function(){
    var custom = $("moodText").value.trim(); var mood = custom || $("moodSel").value;
    d.mood = $("moodSel").value; save();
    window.open("https://open.spotify.com/search/" + encodeURIComponent(mood + " music"), "_blank");
  });
}
function tasksHTML(d, title){
  var done = d.tasks.filter(function(t){ return t.done; }).length;
  var h = '<div class="card"><h2 class="sec">' + title + ' (' + done + '/' + d.tasks.length + ')</h2>';
  if(!d.tasks.length) h += '<p class="mut" style="margin:0">No tasks yet — add one below.</p>';
  d.tasks.forEach(function(t, i){
    h += '<div class="task"><input type="checkbox" data-tog="' + i + '"' + (t.done ? " checked" : "") + '><input data-ttext="' + i + '" value="' + esc(t.text) + '" class="' + (t.done ? "done-t" : "") + '" style="border:none;padding:4px"><input data-ttime="' + i + '" value="' + esc(t.time || "") + '" placeholder="Set a time…" style="border:none;padding:4px;max-width:110px"><button class="small danger" data-tdel="' + i + '">✕</button></div>';
  });
  h += '<div class="row" style="margin-top:12px"><input id="newTask" placeholder="Add a task"><button class="primary fix" id="addTaskBtn">Add</button></div><button id="saveTasksBtn" style="margin-top:10px">Save tasks</button></div>';
  return h;
}
function bindTasks(d){
  function sync(){ document.querySelectorAll("[data-ttext]").forEach(function(el){ d.tasks[parseInt(el.getAttribute("data-ttext"),10)].text = el.value; }); document.querySelectorAll("[data-ttime]").forEach(function(el){ d.tasks[parseInt(el.getAttribute("data-ttime"),10)].time = el.value; }); }
  document.querySelectorAll("[data-tog]").forEach(function(c){ c.addEventListener("change", function(){ sync(); d.tasks[parseInt(c.getAttribute("data-tog"),10)].done = c.checked; save(); render(); }); });
  document.querySelectorAll("[data-tdel]").forEach(function(b){ b.addEventListener("click", function(){ sync(); d.tasks.splice(parseInt(b.getAttribute("data-tdel"),10), 1); save(); render(); }); });
  $("addTaskBtn").addEventListener("click", function(){ sync(); var v = $("newTask").value.trim(); if(!v) return; d.tasks.push({ text: v, time: "", done: false }); save(); render(); });
  $("saveTasksBtn").addEventListener("click", function(){ sync(); save(); toast("Tasks saved"); });
}
function affCard(kind){
  var s = DB.settings, v = kind === "morning" ? s.morningAffirmation : s.eveningAffirmation;
  return '<div class="card"><h2 class="sec">' + (kind === "morning" ? "🌅 Morning Affirmation" : "🌙 Evening Affirmation") + '</h2>' +
    (v ? '<div style="font-size:16px">' + esc(v) + '</div>' : '<p class="mut" style="margin:0">Not set — go to Settings.</p>') + '</div>';
}

/* ---------- pages ---------- */
function renderHome(){
  var hNow = new Date().getHours();
  var greet = hNow < 12 ? "Good Morning 🌞" : (hNow < 18 ? "Good Afternoon ☀️" : "Good Evening 🌙");
  var d = day(selDate), done = d.tasks.filter(function(t){ return t.done; }).length;
  var mealsSet = MEAL_SLOTS.filter(function(ms){ return d.meals[ms[0]]; }).length;
  var q = DB.settings.dailyQuote;
  $("main").innerHTML = '<div class="card"><div class="big">' + greet + '</div><div class="mut">' + fmtDate(selDate) + '</div>' +
    '<p style="margin:10px 0 0">What does your perfect day look like?</p>' + (q ? '<p style="margin:8px 0 0;font-style:italic">“' + esc(q) + '”</p>' : '') + '</div>' +
    '<div class="card"><h2 class="sec">Today at a glance</h2><div id="wxBox">' + wxHTML(selDate) + '</div>' +
    '<p class="mut" style="margin:8px 0 0">Key tasks: ' + done + '/' + d.tasks.length + ' done · Meals planned: ' + mealsSet + '/3</p></div>' +
    '<div class="card" data-go="morning" style="cursor:pointer"><b>🌅 Morning Routine</b><div class="mut">Start your day with purpose and energy</div></div>' +
    '<div class="card" data-go="day" style="cursor:pointer"><b>☀️ During the Day</b><div class="mut">Stay on track with your daily rhythm</div></div>' +
    '<div class="card" data-go="evening" style="cursor:pointer"><b>🌙 Evening Routine</b><div class="mut">Wind down and prepare for tomorrow</div></div>';
  document.querySelectorAll("[data-go]").forEach(function(c){ c.addEventListener("click", function(){ view = c.getAttribute("data-go"); render(); window.scrollTo(0,0); }); });
}
function renderMorning(){
  var d = day(selDate);
  $("main").innerHTML = dateBar() + affCard("morning") +
    '<div class="card"><h2 class="sec">🌤️ Weather</h2>' + wxHTML(selDate) +
    '<div class="row" style="margin-top:10px"><input id="wxCity" placeholder="City or ZIP"><button class="fix" id="wxSet">Set</button><button class="fix" id="wxHere">Use Current Location</button></div></div>' +
    mealsHTML(d) + musicHTML(d);
  bindDateBar(); bindMeals(d); bindMusic(d);
  $("wxSet").addEventListener("click", function(){ var v = $("wxCity").value.trim(); if(!v) return; geocode(v, function(ok){ if(ok){ render(); toast("Location set"); } else alert("Place not found."); }); });
  $("wxHere").addEventListener("click", function(){
    if(!navigator.geolocation){ alert("Geolocation is not available."); return; }
    navigator.geolocation.getCurrentPosition(function(pos){ DB.settings.lat = pos.coords.latitude; DB.settings.lon = pos.coords.longitude; DB.settings.locationName = "Current location"; save(); wxCache = {}; render(); }, function(){ alert("Could not get your location."); });
  });
}
function renderDay(){
  var d = day(selDate);
  $("main").innerHTML = dateBar() + '<div class="card"><h2 class="sec">🌤️ Weather</h2>' + wxHTML(selDate) + '</div>' + tasksHTML(d, "✅ Key Tasks") + musicHTML(d);
  bindDateBar(); bindTasks(d); bindMusic(d);
}
function renderEvening(){
  var tomorrow = addDays(selDate, 1), dT = day(tomorrow);
  $("main").innerHTML = dateBar() + affCard("evening") +
    '<div class="card"><h2 class="sec">📋 Next Day Tasks — for ' + fmtDate(tomorrow) + '</h2><div id="tmBox"></div></div>' +
    mealsHTML(day(selDate)) + musicHTML(day(selDate));
  function renderTm(){
    var h = dT.tasks.length ? "" : '<p class="mut" style="margin:0">No tasks yet — add one below.</p>';
    dT.tasks.forEach(function(t, i){ h += '<div class="task"><span style="flex:1">' + esc(t.text) + (t.time ? ' <span class="mut">' + esc(t.time) + '</span>' : '') + '</span><button class="small danger" data-tmdel="' + i + '">✕</button></div>'; });
    h += '<div class="row" style="margin-top:12px"><input id="tmNew" placeholder="Plan for tomorrow"><button class="primary fix" id="tmAdd">Add a task</button></div>';
    $("tmBox").innerHTML = h;
    document.querySelectorAll("[data-tmdel]").forEach(function(b){ b.addEventListener("click", function(){ dT.tasks.splice(parseInt(b.getAttribute("data-tmdel"),10), 1); save(); renderTm(); }); });
    $("tmAdd").addEventListener("click", function(){ var v = $("tmNew").value.trim(); if(!v) return; dT.tasks.push({ text: v, time: "", done: false }); save(); renderTm(); toast("Added to " + fmtDate(tomorrow)); });
  }
  renderTm(); bindDateBar(); bindMeals(day(selDate)); bindMusic(day(selDate));
}
function renderSettingsPage(){
  var s = DB.settings;
  $("main").innerHTML = '<div class="card"><h2 class="sec">Daily Affirmations</h2>' +
    '<label class="fl">Morning affirmation</label><textarea id="s_morn">' + esc(s.morningAffirmation || "") + '</textarea>' +
    '<label class="fl">Evening affirmation</label><textarea id="s_eve">' + esc(s.eveningAffirmation || "") + '</textarea></div>' +
    '<div class="card"><h2 class="sec">Daily Quote</h2><label class="fl">Quote</label><textarea id="s_quote">' + esc(s.dailyQuote || "") + '</textarea>' +
    '<label class="fl">Theme</label><select id="s_theme">' + ["Motivation","Focus","Gratitude","Calm"].map(function(t){ return '<option' + (s.quoteTheme === t ? " selected" : "") + '>' + t + '</option>'; }).join("") + '</select></div>' +
    '<div class="card"><h2 class="sec">Weather</h2><label class="fl">Location</label><div class="row"><input id="s_loc" value="' + esc(s.locationName || "") + '" placeholder="City or ZIP"><button class="fix" id="s_locSet">Set</button></div>' +
    '<p class="mut">Your settings are saved directly to this device\'s storage.</p>' +
    '<button class="primary" id="s_save" style="width:100%;padding:12px">Save settings</button></div>';
  $("s_locSet").addEventListener("click", function(){ var v = $("s_loc").value.trim(); if(!v) return; geocode(v, function(ok){ if(ok){ render(); toast("Location set: " + DB.settings.locationName); } else alert("Place not found."); }); });
  $("s_save").addEventListener("click", function(){ s.morningAffirmation = $("s_morn").value; s.eveningAffirmation = $("s_eve").value; s.dailyQuote = $("s_quote").value; s.quoteTheme = $("s_theme").value; save(); toast("Settings saved"); });
}

/* ---------- Backup ---------- */
function renderBackup(){
  $("main").innerHTML = '<div class="card"><h2 class="sec">Backup</h2><p class="mut" style="margin-top:0">Your day plans and settings live only on this device. Export a backup file and keep it somewhere safe (for example Google Drive); import it on another device or browser to restore everything.</p>' +
    '<div class="row"><button id="exportBtn">⬇ Export backup</button><button id="importBtn">⬆ Import backup</button></div></div>';
  $("exportBtn").addEventListener("click", function(){ download("mydayplan-backup.json", JSON.stringify(DB, null, 2)); });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
}
function download(name, text){
  var blob = new Blob([text], {type: "application/json"}); var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
$("importFile").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ try { var data = JSON.parse(rd.result); if(!data || !data.settings || !data.days) throw 0;
    if(confirm("Import this backup? It will replace all current plans and settings.")){ DB = data; save(); view = "home"; render(); toast("Backup imported"); } } catch(e){ alert("That file is not a valid MyDayPlan backup."); } };
  rd.readAsText(f); this.value = "";
});

function render(){ setNav(); if(view === "home") renderHome(); else if(view === "morning") renderMorning(); else if(view === "day") renderDay(); else if(view === "evening") renderEvening(); else if(view === "settings") renderSettingsPage(); else if(view === "backup") renderBackup(); }
render();
window.MDP = { getDB: function(){ return DB; }, setDate: function(iso){ selDate = iso; }, todayISO: todayISO, addDays: addDays };
</script>
</body>
</html>
