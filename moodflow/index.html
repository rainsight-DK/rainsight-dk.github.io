<link rel="manifest" href='data:application/manifest+json,{"name":"3MoodFlow","short_name":"MoodFlow","start_url":".","display":"standalone","background_color":"%2386198F","theme_color":"%2386198F","icons":[{"src":"icon.svg","sizes":"any","type":"image/svg+xml"}]}'>
<meta name="theme-color" content="#86198F">
<style>
:root{--main:#7C3AED;--bg:#F5F3FF;--card:#FFFFFF;--ink:#2E1065;--mut:#64748B;--line:#DDD6FE;--danger:#B91C1C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--main);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .brand{font-size:19px;font-weight:800}
header .sub{font-size:12.5px;opacity:.92;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px}
button.primary{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
button.danger{color:var(--danger);border-color:#F3C2C2}
button.small{padding:6px 10px;font-size:13px}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label.fl{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
label.fl:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fix{flex:0 0 auto}
.mut{color:var(--mut);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;border:none;border-radius:0;padding:11px 0 13px;font-size:12.5px;color:var(--mut)}
nav button.on{color:var(--main);font-weight:800}
h2.sec{font-size:17px;margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#2E1065;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:9;max-width:90vw;text-align:center}
.steps{display:flex;gap:8px}
.step{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:9px 4px;font-size:13px;cursor:pointer;background:#fff}
.step.done{background:#EDE9FE;border-color:var(--main)}
.step.cur{border-color:var(--main);border-width:2px;font-weight:700}
.faces{display:flex;flex-wrap:wrap;gap:6px}
.face{font-size:24px;padding:7px 9px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;line-height:1}
.face.on{border-color:var(--main);border-width:2px;background:#EDE9FE}
.face small{display:block;font-size:10px;color:var(--mut)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--main);color:#fff;border-color:var(--main);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{text-align:center;font-size:11px;color:var(--mut);padding:3px 0;font-weight:700}
.day{min-height:40px;border-radius:8px;padding:3px;font-size:12.5px;text-align:center;border:1px solid transparent}
.day .avg{font-size:10.5px;font-weight:700}
.day.out{opacity:.3}
.day.today{border-color:var(--main);border-width:2px}
.day.sel{outline:2px solid var(--main)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--main);min-height:2px}
.bar span{font-size:9.5px;color:var(--mut);margin-top:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px}
.legend span{font-size:12px;color:var(--mut)}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
</style>
</head>
<body>
<header>
  <div class="brand">😊 3MoodFlow</div>
  <div class="sub">3× Daily Mood Tracker — Morning · Afternoon · Evening</div>
</header>
<main id="main"></main>
<nav>
  <button data-nav="home" class="on">🏠 Check-in</button>
  <button data-nav="stats">📊 Stats</button>
  <button data-nav="settings">⚙️ Settings</button>

var MEM = null;

var view = "home", selSlot = null, selRating = 0, selEmotion = "", selTrigger = "", statYear = new Date().getFullYear(), statMonth = new Date().getMonth(), statSelDay = null;

function fmtDate(iso){ if(!iso) return ""; var p = iso.split("-"); var M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; var D = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]; var d = new Date(parseInt(p[0],10), parseInt(p[1],10) - 1, parseInt(p[2],10)); return D[d.getDay()] + ", " + M[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }

/* ---------- Home / check-in ---------- */
function renderHome(){

      '<div class="row" style="margin-top:8px"><input id="ownTrigger" placeholder="Add your own trigger…"><button class="fix" id="addTrigger">Add</button></div>' +

    $("addTrigger").addEventListener("click", function(){ var v = $("ownTrigger").value.trim(); if(!v) return; if(allTriggers().indexOf(v) < 0) DB.customTriggers.push(v); selTrigger = v; save(); renderHome(); });

/* ---------- Stats ---------- */
function patterns(){
  var es = DB.entries;
  if(!es.length) return null;
  var avg = es.reduce(function(n, e){ return n + e.rating; }, 0) / es.length;
  function top(key){ var c = {}, best = "", bn = 0; es.forEach(function(e){ if(e[key]){ c[e[key]] = (c[e[key]] || 0) + 1; if(c[e[key]] > bn){ bn = c[e[key]]; best = e[key]; } } }); return { name: best, n: bn }; }
  var slotAvg = {}; SLOTS.forEach(function(s){ var l = es.filter(function(e){ return e.slot === s[0]; }); slotAvg[s[0]] = l.length ? (l.reduce(function(n, e){ return n + e.rating; }, 0) / l.length) : null; });
  var dates = {}; es.forEach(function(e){ (dates[e.date] = dates[e.date] || []).push(e); });
  var dayList = Object.keys(dates).sort();
  var bestDay = "", bestV = -1, worstDay = "", worstV = 99, fullDays = 0;
  dayList.forEach(function(d){ var a = dayAvg(d); if(a > bestV){ bestV = a; bestDay = d; } if(a < worstV){ worstV = a; worstDay = d; } if(dates[d].length >= 3) fullDays++; });
  var streak = 0; var d = new Date();
  if(!dates[todayISO()]) d.setDate(d.getDate() - 1);
  while(true){ var iso = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); if(dates[iso]){ streak++; d.setDate(d.getDate() - 1); } else break; }
  return { count: es.length, avg: avg, topEmotion: top("emotion"), topTrigger: top("trigger"), slotAvg: slotAvg, days: dayList.length, bestDay: bestDay, bestV: bestV, worstDay: worstDay, worstV: worstV, fullDays: fullDays, streak: streak };
}
function renderStats(){
  var p = patterns();
  var first = new Date(statYear, statMonth, 1); var startDow = first.getDay(); var start = new Date(statYear, statMonth, 1 - startDow);
  var cells = ['<div class="dow">Su</div><div class="dow">Mo</div><div class="dow">Tu</div><div class="dow">We</div><div class="dow">Th</div><div class="dow">Fr</div><div class="dow">Sa</div>'];
  for(var i = 0; i < 42; i++){
    var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    var iso = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    var a = dayAvg(iso);
    var bg = "";
    if(a !== null) bg = a >= 8 ? "#BFDBFE" : (a >= 5 ? "#FEF08A" : "#FECACA");
    else if(iso < todayISO()) bg = "#E5E7EB";
    cells.push('<div class="day' + (d.getMonth() !== statMonth ? " out" : "") + (iso === todayISO() ? " today" : "") + (iso === statSelDay ? " sel" : "") + '" data-day="' + iso + '" style="background:' + bg + '">' + d.getDate() + (a !== null ? '<div class="avg">' + a.toFixed(1) + '</div>' : '') + '</div>');
    if(i >= 34 && d.getMonth() !== statMonth && d.getDay() === 6) break;
  }
  var MN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var h = '<div class="card"><h2 class="sec">Mood History</h2><div class="row"><button class="fix" id="cmPrev">‹</button><b style="text-align:center">' + MN[statMonth] + ' ' + statYear + '</b><button class="fix" id="cmNext">›</button></div>' +
    '<div class="cal" style="margin-top:9px">' + cells.join("") + '</div>' +
    '<div class="legend" style="margin-top:9px"><span><span class="sw" style="background:#BFDBFE"></span>8–10</span><span><span class="sw" style="background:#FEF08A"></span>5–7</span><span><span class="sw" style="background:#FECACA"></span>1–4</span><span><span class="sw" style="background:#E5E7EB"></span>Missed</span></div><div id="dayBox"></div></div>';
  var N = DB.settings.trackingDays;
  var bars = "";
  for(var k = N - 1; k >= 0; k--){
    var dd = new Date(); dd.setDate(dd.getDate() - k);
    var iso2 = dd.getFullYear() + "-" + pad(dd.getMonth() + 1) + "-" + pad(dd.getDate());
    var av = dayAvg(iso2);
    bars += '<div class="bar">' + (av !== null ? '<i style="height:' + Math.round(av * 10) + '%"></i>' : '<i style="height:2px;background:#E5E7EB"></i>') + '<span>' + (dd.getMonth() + 1) + '/' + dd.getDate() + '</span></div>';
  }
  h += '<div class="card"><h2 class="sec">Last ' + N + ' Days — Daily Average</h2><div class="bars">' + bars + '</div></div>';
  if(p){
    h += '<div class="card"><h2 class="sec">Your Patterns</h2><p class="mut" style="margin-top:0">Computed from your entries — this replaces the original\'s AI analysis.</p>' +
      '<p style="margin:5px 0">📈 <b>' + p.count + ' entries</b> over ' + p.days + ' days · overall average <b>' + p.avg.toFixed(1) + '</b></p>' +
      '<p style="margin:5px 0">🌅 Morning ' + (p.slotAvg.morning ? p.slotAvg.morning.toFixed(1) : "—") + ' · ☀️ Afternoon ' + (p.slotAvg.afternoon ? p.slotAvg.afternoon.toFixed(1) : "—") + ' · 🌙 Evening ' + (p.slotAvg.evening ? p.slotAvg.evening.toFixed(1) : "—") + '</p>' +
      '<p style="margin:5px 0">Most frequent emotion: <b>' + esc(p.topEmotion.name) + '</b> (' + p.topEmotion.n + '×) · trigger: <b>' + esc(p.topTrigger.name) + '</b> (' + p.topTrigger.n + '×)</p>' +
      '<p style="margin:5px 0">Best day: ' + fmtDate(p.bestDay) + ' (' + p.bestV.toFixed(1) + ') · Lowest day: ' + fmtDate(p.worstDay) + ' (' + p.worstV.toFixed(1) + ')</p>' +
      '<p style="margin:5px 0">Full 3-check-in days: ' + p.fullDays + ' · current streak: ' + p.streak + ' day' + (p.streak === 1 ? "" : "s") + '</p></div>';
  }
  var recent = DB.entries.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; }).slice(0, 20);
  h += '<div class="card"><h2 class="sec">Recent Entries</h2>' + (recent.length ? recent.map(function(e){
    return '<div class="row" style="border-top:1px dashed var(--line);padding:7px 0"><span>' + FACES[e.rating - 1] + ' <b>' + e.rating + '</b> · ' + esc(e.emotion) + ' <span class="mut">' + esc(e.trigger || "") + '</span></span><span class="mut fix">' + e.date.slice(5) + ' ' + slotName(e.slot) + '</span><button class="small danger fix" data-edel="' + e.id + '">✕</button></div>';
  }).join("") : '<p class="mut" style="margin:0">No entries yet.</p>') + '</div>';
  $("main").innerHTML = h;
  function shift(n){ statMonth += n; if(statMonth < 0){ statMonth = 11; statYear--; } if(statMonth > 11){ statMonth = 0; statYear++; } renderStats(); }
  $("cmPrev").addEventListener("click", function(){ shift(-1); });
  $("cmNext").addEventListener("click", function(){ shift(1); });
  document.querySelectorAll("[data-day]").forEach(function(el){ el.addEventListener("click", function(){ statSelDay = el.getAttribute("data-day"); renderStats(); }); });

  }
}

    '<label class="fl">Tracking Period</label><select id="s_days">' + [10, 15, 20, 30].map(function(n){ return '<option value="' + n + '"' + (s.trackingDays === n ? " selected" : "") + '>Last ' + n + ' days</option>'; }).join("") + '</select>' +
    '<label class="fl">Theme Color</label><div class="chips">' + Object.keys(THEMES).map(function(t){ return '<span class="chip' + (s.theme === t ? " on" : "") + '" data-theme="' + t + '"><span class="sw" style="background:' + THEMES[t].main + '"></span>' + t[0].toUpperCase() + t.slice(1) + '</span>'; }).join("") + '</div>' +
    '<label class="fl">Notifications</label><div class="row"><span>Browser notifications at check-in times</span><select id="s_notif" style="max-width:110px"><option value="1"' + (s.notifications ? " selected" : "") + '>On</option><option value="0"' + (!s.notifications ? " selected" : "") + '>Off</option></select></div>' +
    '<button id="grantBtn" style="margin-top:9px">Grant Browser Permission</button>' +
    '<p class="mut">Reminders can only fire while this app is open in the browser — a static app has no background service. The check-in steps on Home always show what is still missing today.</p>' +
    '<button class="primary" id="saveSettings" style="width:100%;margin-top:6px;padding:11px">Save Settings</button></div>';
  document.querySelectorAll("[data-theme]").forEach(function(ch){ ch.addEventListener("click", function(){ DB.settings.theme = ch.getAttribute("data-theme"); save(); applyTheme(); renderSettings(); }); });
  $("grantBtn").addEventListener("click", function(){ if("Notification" in window) Notification.requestPermission().then(function(p){ toast("Permission: " + p); }); else toast("Notifications not supported here"); });
  $("saveSettings").addEventListener("click", function(){
    SLOTS.forEach(function(sl){ DB.settings[sl[0] + "Time"] = $("t_" + sl[0]).value || DB.settings[sl[0] + "Time"]; });
    DB.settings.trackingDays = parseInt($("s_days").value, 10);
    DB.settings.notifications = $("s_notif").value === "1";
    save(); scheduleReminders(); toast("Settings saved");
  });
}
function scheduleReminders(){
  if(!DB.settings.notifications || !("Notification" in window) || Notification.permission !== "granted") return;
  var now = new Date();
  SLOTS.forEach(function(sl){
    var parts = DB.settings[sl[0] + "Time"].split(":");
    var at = new Date(); at.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);
    var delay = at - now;
    if(delay > 0 && !entryFor(todayISO(), sl[0])){
      setTimeout(function(){ try { new Notification("3MoodFlow", { body: "Time for your " + slotName(sl[0]).toLowerCase() + " check-in 🌿" }); } catch(e){} }, delay);
    }
  });
}

/* ---------- Backup ---------- */
function renderBackup(){
  $("main").innerHTML = '<div class="card"><h2 class="sec">Backup</h2><p class="mut" style="margin-top:0">Your mood entries and settings live only on this device. Export a backup file and keep it somewhere safe (for example Google Drive); import it on another device or browser to restore everything.</p>' +
    '<div class="row"><button id="exportBtn">⬇ Export backup</button><button id="importBtn">⬆ Import backup</button></div></div>';
  $("exportBtn").addEventListener("click", function(){ download("moodflow-backup.json", JSON.stringify(DB, null, 2)); });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
}
function download(name, text){
  var blob = new Blob([text], {type: "application/json"}); var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
$("importFile").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ try { var data = JSON.parse(rd.result); if(!data || !Array.isArray(data.entries) || !data.settings) throw 0;
    if(confirm("Import this backup? It will replace all current mood data.")){ DB = data; save(); applyTheme(); view = "home"; selSlot = null; render(); toast("Backup imported"); } } catch(e){ alert("That file is not a valid 3MoodFlow backup."); } };
  rd.readAsText(f); this.value = "";
});

function render(){ applyTheme(); setNav(); if(view === "home") renderHome(); else if(view === "stats") renderStats(); else if(view === "settings") renderSettings(); else if(view === "backup") renderBackup(); }
applyTheme();
render();
scheduleReminders();
window.MF = { getDB: function(){ return DB; }, patterns: patterns, dayAvg: dayAvg, currentSlot: currentSlot };
</script>
</body>
</html>
