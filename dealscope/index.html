<link rel="manifest" href='data:application/manifest+json,{"name":"DealScope","short_name":"DealScope","start_url":".","display":"standalone","background_color":"%23854D0E","theme_color":"%23854D0E","icons":[{"src":"icon.svg","sizes":"any","type":"image/svg+xml"}]}'>
<meta name="theme-color" content="#854D0E">
<style>
:root{--br:#854D0E;--br-d:#713F12;--bg:#FEFCE8;--card:#FFFFFF;--ink:#422006;--mut:#78716C;--line:#FDE68A;--chip:#FEF9C3;--danger:#B91C1C;--go:#15803D;--cau:#B45309;--no:#B91C1C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--br);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .brand{font-size:20px;font-weight:800}
header .sub{font-size:12.5px;opacity:.9;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px}
button.primary{background:#16A34A;border-color:#16A34A;color:#fff;font-weight:700}
button.accent{background:var(--br);border-color:var(--br);color:#fff;font-weight:700}
button.danger{color:var(--danger);border-color:#F3C2C2}
button.small{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:56px;resize:vertical}
label.fl{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
label.fl:first-child{margin-top:0}
.row{display:flex;gap:8px}.row>*{flex:1}
.mut{color:var(--mut);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.pill.on{background:var(--br);color:#fff;border-color:var(--br);font-weight:700}
.badge{border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:var(--chip);border:1px solid var(--line);display:inline-block}
.badge.go{background:#DCFCE7;color:var(--go);border-color:#BBF7D0}
.badge.caution{background:#FEF3C7;color:var(--cau);border-color:#FDE68A}
.badge.nogo{background:#FEE2E2;color:var(--no);border-color:#FECACA}
.score{font-size:30px;font-weight:800}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;border:none;border-radius:0;padding:11px 0 13px;font-size:13px;color:var(--mut)}
nav button.on{color:var(--br);font-weight:800}
h2.sec{font-size:17px;margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#422006;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:9;max-width:90vw;text-align:center}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.bar-row .nm{width:38%;font-size:13px}
.bar-track{flex:1;height:16px;background:#F5F5F4;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--br)}
.bar-row .val{width:22%;text-align:right;font-size:13px;font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.gallery img{width:100%;border-radius:10px;margin-bottom:8px}
input[type=range]{padding:0}
</style>
</head>
<body>
<header>
  <div class="brand">🏷️ DealScope</div>
  <div class="sub">Stop overpaying. Start comparing.</div>
</header>
<main id="main"></main>
<nav>
  <button data-nav="home" class="on">🏠 Home</button>
  <button data-nav="history">🕘 History</button>
  <button data-nav="check">📷 Check</button>
  <button data-nav="profile">👤 Profile</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">
<script>
"use strict";
var LS_KEY = "dealScopeV1";
var MEM = null, SAVE_FAILED = false;
function lsGet(){ try { return window.localStorage.getItem(LS_KEY); } catch(e){ return MEM; } }
function lsSet(v){ MEM = v; try { window.localStorage.setItem(LS_KEY, v); SAVE_FAILED = false; } catch(e){ SAVE_FAILED = true; } }
function save(){ lsSet(JSON.stringify(DB)); if(SAVE_FAILED) alert("Storage is full on this device — the newest change could not be saved. Removing a photo or two from a deal usually frees enough space."); }
function seedDB(){
  return {
    deals: [],
    profile: { current: "", wants: "", mustHaves: "", notes: "" },
    autos: [
      { label: "Mini van", brand: "Honda", model: "Odyssey", year: 2021, mileage: 80000, accident: "1_minor" },
      { label: "EV", brand: "Kia", model: "EV9", year: 2026, mileage: 10000, accident: "none" }
    ],
    home: { label: "", city: "Canton", zip: "30115", price: 350000, sqft: 3305, yearBuilt: 2016, beds: 5, baths: 4.5 },
    prefs: { sortBy: "monthly_payment_asc", customCategories: ["Bank account"] }
  };
}
var DB;
try { var raw = lsGet(); DB = raw ? JSON.parse(raw) : seedDB(); if(!DB || !Array.isArray(DB.deals) || !DB.profile) DB = seedDB(); }
catch(e){ DB = seedDB(); }
save();

var BASE_CATS = ["Bank account","Credit card","Water softener","Cable & internet","Mobile carrier"];
function allCats(){
  var out = [];
  BASE_CATS.concat(DB.prefs.customCategories || []).concat(DB.deals.map(function(d){ return d.offerType; })).forEach(function(c){ if(c && out.indexOf(c) < 0) out.push(c); });
  return out;
}
var view = "home", currentDealId = null, histFilter = "all", cmpCat = null, cmpMetric = "monthly", formState = null;
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function $(id){ return document.getElementById(id); }
function toast(msg){ var t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(function(){ t.style.display = "none"; }, 2600); }
function fmtDate(iso){ if(!iso) return "—"; var p = iso.split("-"); var M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return M[parseInt(p[1],10)-1] + " " + parseInt(p[2],10) + ", " + p[0]; }
function daysUntil(iso){ if(!iso) return null; var t = new Date(); t.setHours(0,0,0,0); var d = new Date(iso + "T00:00:00"); return Math.round((d - t) / 86400000); }
function money(v){ if(v === "" || v === null || v === undefined) return "—"; return "$" + Number(v).toLocaleString("en-US"); }
function dealById(id){ for(var i=0;i<DB.deals.length;i++) if(DB.deals[i].id === id) return DB.deals[i]; return null; }
function verdictBadge(d){
  if(d.verdict === "go") return '<span class="badge go">Go' + (d.score !== "" && d.score !== null ? " · " + d.score : "") + '</span>';
  if(d.verdict === "caution") return '<span class="badge caution">Caution' + (d.score !== "" && d.score !== null ? " · " + d.score : "") + '</span>';
  if(d.verdict === "nogo") return '<span class="badge nogo">No go' + (d.score !== "" && d.score !== null ? " · " + d.score : "") + '</span>';
  return '<span class="badge">Not scored</span>';
}
function sortDeals(list){
  var sb = DB.prefs.sortBy || "monthly_payment_asc";
  var arr = list.slice();
  function num(v){ var n = parseFloat(v); return isNaN(n) ? Infinity : n; }
  if(sb === "monthly_payment_asc") arr.sort(function(a, b){ return num(a.monthly) - num(b.monthly); });
  else if(sb === "monthly_payment_desc") arr.sort(function(a, b){ return num(b.monthly) - num(a.monthly); });
  else if(sb === "score_desc") arr.sort(function(a, b){ return num(b.score) - num(a.score); });
  else if(sb === "newest") arr.sort(function(a, b){ return (b.created || "") < (a.created || "") ? -1 : 1; });
  return arr;
}

function setNav(){ var eff = (view === "deal" || view === "compare") ? "home" : view; var bs = document.querySelectorAll("nav button"); for(var i=0;i<bs.length;i++) bs[i].className = bs[i].getAttribute("data-nav") === eff ? "on" : ""; }
document.querySelector("nav").addEventListener("click", function(e){ var b = e.target.closest("[data-nav]"); if(b){ view = b.getAttribute("data-nav"); if(view === "check") formState = null; render(); window.scrollTo(0,0); } });

/* ---------- Home ---------- */
function renderHome(){
  var cats = allCats();
  var expiring = DB.deals.filter(function(d){ var du = daysUntil(d.expiry); return du !== null && du <= 30; }).sort(function(a, b){ return daysUntil(a.expiry) - daysUntil(b.expiry); });
  var recent = DB.deals.slice().sort(function(a, b){ return (b.created || "") < (a.created || "") ? -1 : 1; }).slice(0, 3);
  var h = '<div class="card"><h2 class="sec">Compare deals</h2><p class="mut" style="margin-top:0">Pick a category to compare the deals you have checked, sorted the way you like.</p>' +
    '<button class="primary" id="checkBtn" style="width:100%;padding:13px">📷 Check a New Deal</button>' +
    '<div class="pills">' + cats.map(function(c){ var n = DB.deals.filter(function(d){ return d.offerType === c; }).length; return '<span class="pill" data-cat="' + esc(c) + '">' + esc(c) + (n ? " (" + n + ")" : "") + '</span>'; }).join("") + '</div>' +
    '<p class="mut">Comparisons use only the deals you entered yourself — no estimated market prices.</p></div>';
  if(expiring.length){

/* ---------- Compare ---------- */
function renderCompare(){

  var labels = { monthly: "Monthly payment", rate: "Interest rate", price: "Total price" };
  var h = '<button class="small" id="backBtn">← Home</button><div class="card" style="margin-top:10px"><h2 class="sec">Compare — ' + esc(cmpCat || "") + '</h2>' +
    '<div class="pills">' + cats.map(function(c){ return '<span class="pill' + (c === cmpCat ? " on" : "") + '" data-ccat="' + esc(c) + '">' + esc(c) + '</span>'; }).join("") + '</div>' +
    '<div class="pills" style="margin-top:10px">' + ["monthly","rate","price"].map(function(m){ return '<span class="pill' + (cmpMetric === m ? " on" : "") + '" data-metric="' + m + '">' + labels[m] + '</span>'; }).join("") + '</div>' +
    '<p class="mut">Sorted by monthly payment (low → high), your saved preference.</p>';

    });

  $("main").innerHTML = h;
  $("backBtn").addEventListener("click", function(){ view = "home"; render(); window.scrollTo(0,0); });

  document.querySelectorAll("[data-metric]").forEach(function(p){ p.addEventListener("click", function(){ cmpMetric = p.getAttribute("data-metric"); renderCompare(); }); });
  document.querySelectorAll("[data-open]").forEach(function(a){ a.addEventListener("click", function(ev){ ev.preventDefault(); currentDealId = a.getAttribute("data-open"); view = "deal"; render(); window.scrollTo(0,0); }); });
}

/* ---------- Check / edit deal form ---------- */
function startForm(existing){
  formState = existing ? JSON.parse(JSON.stringify(existing)) :
    { id: "", title: "", offerType: allCats()[0] || "Bank account", keyTerms: "", price: "", monthly: "", rate: "", expiry: "", summary: "", pros: "", cons: "", risks: "", score: "", verdict: "", link: "", images: [], created: "" };

}
function renderCheck(){

    '<div class="row"><div><label class="fl">Offer expires</label><input id="d_expiry" type="date" value="' + esc(f.expiry) + '"></div><div><label class="fl">Provider / details link</label><input id="d_link" value="' + esc(f.link) + '" placeholder="https://…"></div></div></div>' +
    '<div class="card"><h2 class="sec">Your analysis</h2>' +
    '<label class="fl">Summary</label><textarea id="d_summary">' + esc(f.summary) + '</textarea>' +
    '<label class="fl">Pros (one per line)</label><textarea id="d_pros">' + esc(f.pros) + '</textarea>' +
    '<label class="fl">Cons (one per line)</label><textarea id="d_cons">' + esc(f.cons) + '</textarea>' +
    '<label class="fl">Risks (one per line)</label><textarea id="d_risks">' + esc(f.risks) + '</textarea>' +
    '<div class="row"><div><label class="fl">Score (0–100)</label><input id="d_score" type="number" min="0" max="100" value="' + esc(f.score) + '"></div>' +
    '<div><label class="fl">Verdict</label><select id="d_verdict"><option value="">Not scored</option><option value="go"' + (f.verdict === "go" ? " selected" : "") + '>Go</option><option value="caution"' + (f.verdict === "caution" ? " selected" : "") + '>Caution</option><option value="nogo"' + (f.verdict === "nogo" ? " selected" : "") + '>No go</option></select></div></div>' +
    '<div class="row" style="margin-top:14px"><button class="primary" id="d_save">' + (f.id ? "Save changes" : "Save deal") + '</button><button id="d_cancel">Cancel</button></div></div>' +
    '<div class="card"><h2 class="sec">🤖 Evaluate with an AI</h2>' +
    '<p class="mut" style="margin-top:0">The prompt below is built from this deal — its terms, your vehicles or home when relevant, and any flyer photos attached above (attach the same photos in the AI app; it reads the terms, including fine print). The AI compares current competing offers, then answers with a verdict block this app can file straight into the form.</p>' +
    '<label class="fl">Your evaluation prompt</label><textarea id="aiPrompt" rows="9" readonly></textarea>' +
    '<div class="row" style="margin-top:9px"><button class="primary" id="aiChatGPT">💬 Open in ChatGPT</button><button id="aiClaude">✳️ Open in Claude</button></div>' +
    '<div class="row" style="margin-top:8px"><button id="aiGemini">✨ Copy + open Gemini</button><button id="aiCopy">📋 Copy prompt</button></div>' +
    '<label class="fl" style="margin-top:12px">Paste the AI’s answer — apply it to this deal</label><textarea id="aiAnswer" rows="6" placeholder="Paste the whole answer…"></textarea>' +
    '<label class="fl">Answered by</label><select id="aiSource"><option>ChatGPT</option><option>Claude</option><option>Gemini</option><option>Muse (in chat)</option><option>Other AI</option></select>' +
    '<div class="row" style="margin-top:9px"><button class="primary" id="aiApplyBtn">Apply to this deal</button></div>' +
    '<p class="mut" id="aiMsg" style="margin-bottom:0"></p></div>';
  $("main").innerHTML = h;
  function sync(){
    f.title = $("d_title").value; f.keyTerms = $("d_terms").value; f.price = $("d_price").value; f.monthly = $("d_monthly").value;
    f.rate = $("d_rate").value; f.expiry = $("d_expiry").value; f.link = $("d_link").value; f.summary = $("d_summary").value;
    f.pros = $("d_pros").value; f.cons = $("d_cons").value; f.risks = $("d_risks").value; f.score = $("d_score").value; f.verdict = $("d_verdict").value;
    var tv = $("d_type").value; f.offerType = tv === "__new" ? ($("d_newtype").value.trim() || f.offerType) : tv;
  }
  function dsCopy(t, done){
    function fallback(){ var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch(e){} ta.remove(); if(done) done(); }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){ if(done) done(); }, fallback); else fallback();
  }
  function buildDealPrompt(){
    var L = [];
    L.push("Evaluate this consumer offer for me and tell me whether it is a good deal.");
    L.push("");
    L.push("Offer: " + (f.title || "(untitled)") + " \u2014 category: " + (f.offerType || ""));
    if(f.keyTerms) L.push("Terms as I have them: " + f.keyTerms);
    var nums = [];
    if(f.price) nums.push("total price $" + f.price);
    if(f.monthly) nums.push("$" + f.monthly + "/month");
    if(f.rate) nums.push("rate " + f.rate + "%");
    if(f.expiry) nums.push("offer expires " + f.expiry);
    if(nums.length) L.push("Numbers: " + nums.join(", ") + ".");
    if(f.link) L.push("Offer link: " + f.link);
    if(f.images && f.images.length) L.push("(I am attaching " + f.images.length + " photo(s) of the flyer/brochure to this message \u2014 read every term from them, including the fine print.)");
    var hay = ((f.title || "") + " " + (f.offerType || "")).toLowerCase();
    if(DB.profile && (DB.profile.current || DB.profile.wants || DB.profile.mustHaves || DB.profile.notes)){
      L.push("About me, from my DealScope profile: " + [DB.profile.current, DB.profile.wants, DB.profile.mustHaves, DB.profile.notes].filter(Boolean).join(" "));
    }
    if(/car|auto|vehicle|lease|van|truck|ev\b|dealer/.test(hay) && DB.autos){
      L.push("My current vehicles, for replacement/trade-in context: " + DB.autos.map(function(v){ return v.year + " " + v.brand + " " + v.model + ", " + Number(v.mileage).toLocaleString("en-US") + " miles, " + (v.accident === "none" ? "no accidents" : "1 minor accident"); }).join("; ") + ".");
    }
    if(/home|mortgage|roof|solar|water|hvac|internet|cable|security|pest|lawn/.test(hay) && DB.home){
      var hm = DB.home;
      L.push("My home, for context: " + hm.city + ", GA " + hm.zip + " \u2014 bought for $" + Number(hm.price).toLocaleString("en-US") + " (" + hm.yearBuilt + "), " + Number(hm.sqft).toLocaleString("en-US") + " sq ft, " + hm.beds + " bed / " + hm.baths + " bath.");
    }
    L.push("");
    L.push("Do this:");
    L.push("1. Extract the offer's complete real terms: total cost, all fees, conditions, exclusions, deadlines, and what changes after any promotional period.");
    L.push("2. Judge whether it is a good deal against current competing offers \u2014 search the live web and cite your sources by name.");
    L.push("3. List the pros, the cons, and the risks or traps (fine print, auto-renewal, eligibility, penalties).");
    L.push("");
    L.push("Then end your answer with EXACTLY this block, so my app can file it:");
    L.push("===DEALSCOPE===");
    L.push("VERDICT: <GO, CAUTION, or NO GO>");
    L.push("SCORE: <0-100; higher means a better deal>");
    L.push("SUMMARY: <one or two sentences>");
    L.push("PROS: <points separated by ; >");
    L.push("CONS: <points separated by ; >");
    L.push("RISKS: <points separated by ; >");
    L.push("===END===");
    return L.join("\n");
  }
  function parseDealAi(text){
    var bm = /===DEALSCOPE===([\s\S]*?)===END===/.exec(text);
    var out = { verdict: "", score: "", summary: "", pros: "", cons: "", risks: "", structured: !!bm };
    var s = bm ? bm[1] : text, m;
    if((m = /^VERDICT:\s*(NO GO|CAUTION|GO)/im.exec(s))) out.verdict = m[1].toUpperCase() === "GO" ? "go" : (m[1].toUpperCase() === "CAUTION" ? "caution" : "nogo");
    if((m = /^SCORE:\s*(\d{1,3})/im.exec(s))) out.score = Math.min(100, parseInt(m[1], 10));
    if((m = /^SUMMARY:\s*(.+)$/im.exec(s))) out.summary = m[1].trim();
    ["pros", "cons", "risks"].forEach(function(k){
      var mm = new RegExp("^" + k.toUpperCase() + ":\\s*(.+)$", "im").exec(s);
      if(mm) out[k] = mm[1].split(/\s*;\s*/).filter(Boolean).join("\n");
    });
    return out;
  }
  function refreshAiPrompt(){ sync(); $("aiPrompt").value = buildDealPrompt(); }
  $("d_type").addEventListener("change", function(){ $("d_newtype").style.display = this.value === "__new" ? "block" : "none"; });
  document.querySelectorAll("[data-delimg]").forEach(function(b){ b.addEventListener("click", function(){ sync(); f.images.splice(parseInt(b.getAttribute("data-delimg"),10), 1); renderCheck(); }); });
  $("d_photos").addEventListener("change", function(){
    sync();
    var files = Array.prototype.slice.call(this.files || []);
    if(!files.length) return;
    var room = 6 - f.images.length;
    files.slice(0, room).forEach(function(file){
      var rd = new FileReader();
      rd.onload = function(){
        var img = new Image();
        img.onload = function(){
          var scale = Math.min(1, 1000 / Math.max(img.width, img.height));
          var cv = document.createElement("canvas"); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
          cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
          f.images.push(cv.toDataURL("image/jpeg", 0.72));
          renderCheck();
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(file);
    });
    if(files.length > room) alert("Only the first " + room + " photo(s) fit — the limit is 6 per deal.");
  });
  $("d_cancel").addEventListener("click", function(){ formState = null; view = f.id ? "deal" : "home"; render(); });
  $("aiPrompt").value = buildDealPrompt();
  $("aiChatGPT").addEventListener("click", function(){ refreshAiPrompt(); window.open("https://chatgpt.com/?q=" + encodeURIComponent($("aiPrompt").value), "_blank"); });
  $("aiClaude").addEventListener("click", function(){ refreshAiPrompt(); window.open("https://claude.ai/new?q=" + encodeURIComponent($("aiPrompt").value), "_blank"); });
  $("aiGemini").addEventListener("click", function(){ refreshAiPrompt(); dsCopy($("aiPrompt").value, function(){ toast("Prompt copied \u2014 paste it in Gemini"); window.open("https://gemini.google.com/app", "_blank"); }); });
  $("aiCopy").addEventListener("click", function(){ refreshAiPrompt(); dsCopy($("aiPrompt").value, function(){ toast("Prompt copied"); }); });
  $("aiApplyBtn").addEventListener("click", function(){
    var text = $("aiAnswer").value.trim(); var msg = $("aiMsg");
    if(!text){ msg.textContent = "Paste the AI\u2019s answer first."; return; }
    sync();
    var r = parseDealAi(text);
    if(r.verdict) f.verdict = r.verdict;
    if(r.score !== "") f.score = r.score;
    if(r.summary) f.summary = r.summary; else if(!r.structured && !f.summary) f.summary = text.slice(0, 600);
    if(r.pros) f.pros = r.pros;
    if(r.cons) f.cons = r.cons;
    if(r.risks) f.risks = r.risks;
    f.aiText = text; f.aiSource = $("aiSource").value; f.aiDate = new Date().toISOString();
    renderCheck();
    toast(r.structured ? "AI evaluation applied \u2014 review, then Save deal" : "AI text saved on this deal \u2014 no format block was found");
  });
  $("d_save").addEventListener("click", function(){
    sync();
    if(!f.title.trim()){ alert("Give the deal a title."); return; }
    if(!f.id){ f.id = "d" + Date.now(); f.created = new Date().toISOString(); DB.deals.push(f); }
    else { var ix = -1; DB.deals.forEach(function(x, i){ if(x.id === f.id) ix = i; }); if(ix >= 0) DB.deals[ix] = f; }
    if(f.offerType && BASE_CATS.indexOf(f.offerType) < 0 && (DB.prefs.customCategories || []).indexOf(f.offerType) < 0) DB.prefs.customCategories.push(f.offerType);
    save(); formState = null; currentDealId = f.id; view = "deal"; render(); toast("Deal saved");
  });
}

/* ---------- History ---------- */
function renderHistory(){
  var list = sortDeals(DB.deals.filter(function(d){ return histFilter === "all" || d.verdict === histFilter; })).sort(function(a, b){ return (b.created || "") < (a.created || "") ? -1 : 1; });

    '<div class="pills">' + [["all","All"],["go","Go"],["caution","Caution"],["nogo","No go"]].map(function(x){ return '<span class="pill' + (histFilter === x[0] ? " on" : "") + '" data-hf="' + x[0] + '">' + x[1] + '</span>'; }).join("") + '</div></div>';
  if(!DB.deals.length) h += '<div class="card" style="text-align:center;padding:26px 14px"><b>No deals checked yet.</b><p class="mut">Check your first deal to start your history.</p><button class="primary" id="firstBtn">Check your first deal →</button></div>';
  else if(!list.length) h += '<div class="card mut">No deals with this verdict yet.</div>';
  list.forEach(function(d){
    h += '<div class="card" data-open="' + d.id + '" style="cursor:pointer"><b>' + esc(d.title) + '</b> ' + verdictBadge(d) + '<div class="mut">' + esc(d.offerType) + (d.monthly ? ' · ' + money(d.monthly) + '/mo' : '') + (d.price ? ' · ' + money(d.price) : '') + (d.expiry ? ' · expires ' + fmtDate(d.expiry) : '') + '</div>' + (d.summary ? '<p class="mut" style="margin:6px 0 0">' + esc(d.summary) + '</p>' : '') + '</div>';
  });
  $("main").innerHTML = h;
  var fb = $("firstBtn"); if(fb) fb.addEventListener("click", function(){ startForm(null); });
  document.querySelectorAll("[data-hf]").forEach(function(p){ p.addEventListener("click", function(){ histFilter = p.getAttribute("data-hf"); renderHistory(); }); });
  document.querySelectorAll("[data-open]").forEach(function(c){ c.addEventListener("click", function(){ currentDealId = c.getAttribute("data-open"); view = "deal"; render(); window.scrollTo(0,0); }); });
}

/* ---------- Profile ---------- */
function renderProfile(){
  var p = DB.profile, s = DB.settings || {};
  var h = '<div class="card"><h2 class="sec">My Profile</h2><p class="mut" style="margin-top:0">This feeds every deal analysis — keep it in mind when you score a deal, or paste it to Muse with a flyer.</p>' +
    '<label class="fl">Current Products</label><textarea id="p_current" placeholder="e.g. Chase Sapphire card, AT&T mobile $80/mo, Geico auto insurance">' + esc(p.current) + '</textarea>' +
    '<label class="fl">What I Want</label><textarea id="p_wants" placeholder="e.g. Lower monthly payment, better rewards, no annual fee">' + esc(p.wants) + '</textarea>' +
    '<label class="fl">Must-Haves</label><textarea id="p_must" placeholder="e.g. Must have no foreign transaction fees, must be month-to-month">' + esc(p.mustHaves) + '</textarea>' +
    '<label class="fl">Notes</label><textarea id="p_notes" placeholder="e.g. I travel internationally 3x a year, I prefer digital-only banks">' + esc(p.notes) + '</textarea>' +
    '<button class="primary" id="p_save" style="width:100%;margin-top:12px">Save Profile</button></div>' +
    '<div class="card"><h2 class="sec">My cars</h2><div id="autoBox"></div>' +
    '<div class="row"><input id="a_label" placeholder="Label (e.g. EV)"><input id="a_brand" placeholder="Brand"><input id="a_model" placeholder="Model"></div>' +
    '<div class="row" style="margin-top:8px"><input id="a_year" type="number" placeholder="Year"><input id="a_miles" type="number" placeholder="Mileage"><select id="a_acc"><option value="none">No accidents</option><option value="1_minor">1 minor accident</option><option value="1_major">1 major accident</option><option value="multiple">Multiple accidents</option></select></div>' +
    '<button id="a_add" style="width:100%;margin-top:8px">+ Add car</button></div>' +
    '<div class="card"><h2 class="sec">My home</h2>' +
    '<div class="row"><div><label class="fl">City</label><input id="h_city" value="' + esc(DB.home.city) + '"></div><div><label class="fl">ZIP</label><input id="h_zip" value="' + esc(DB.home.zip) + '"></div></div>' +
    '<div class="row"><div><label class="fl">Value ($)</label><input id="h_price" type="number" value="' + esc(DB.home.price) + '"></div><div><label class="fl">Size (sq ft)</label><input id="h_sqft" type="number" value="' + esc(DB.home.sqft) + '"></div><div><label class="fl">Year built</label><input id="h_year" type="number" value="' + esc(DB.home.yearBuilt) + '"></div></div>' +
    '<div class="row"><div><label class="fl">Bedrooms</label><input id="h_beds" type="number" step="0.5" value="' + esc(DB.home.beds) + '"></div><div><label class="fl">Bathrooms</label><input id="h_baths" type="number" step="0.5" value="' + esc(DB.home.baths) + '"></div></div>' +
    '<button class="accent" id="h_save" style="width:100%;margin-top:12px">Save home</button></div>' +
    '<div class="card"><h2 class="sec">Preferences</h2>' +
    '<label class="fl">Sort comparisons by</label><select id="pr_sort"><option value="monthly_payment_asc"' + (DB.prefs.sortBy === "monthly_payment_asc" ? " selected" : "") + '>Monthly payment (low → high)</option><option value="monthly_payment_desc"' + (DB.prefs.sortBy === "monthly_payment_desc" ? " selected" : "") + '>Monthly payment (high → low)</option><option value="score_desc"' + (DB.prefs.sortBy === "score_desc" ? " selected" : "") + '>Score (high → low)</option><option value="newest"' + (DB.prefs.sortBy === "newest" ? " selected" : "") + '>Newest first</option></select>' +
    '<label class="fl">Custom categories</label><div id="catBox"></div>' +
    '<div class="row" style="margin-top:8px"><input id="c_name" placeholder="Category name"><button id="c_add">+ Add</button></div>' +
    '<div class="row" style="margin-top:14px"><button id="pr_save">Save preferences</button><button id="bkBtn2">💾 Backup</button></div></div>';
  $("main").innerHTML = h;
  function renderAutos(){
    $("autoBox").innerHTML = DB.autos.map(function(a, i){
      return '<div style="border-top:1px dashed var(--line);padding:7px 0"><b>' + esc(a.label || (a.brand + " " + a.model)) + '</b> <span class="mut">' + esc(a.brand) + ' ' + esc(a.model) + ' · ' + a.year + ' · ' + Number(a.mileage).toLocaleString("en-US") + ' mi · ' + esc(String(a.accident).replace("_", " ")) + '</span> <button class="small danger" data-delauto="' + i + '">✕</button></div>';
    }).join("") || '<span class="mut">No cars yet.</span>';
    document.querySelectorAll("[data-delauto]").forEach(function(b){ b.addEventListener("click", function(){ DB.autos.splice(parseInt(b.getAttribute("data-delauto"),10), 1); save(); renderAutos(); }); });
  }
  function renderCats(){
    $("catBox").innerHTML = (DB.prefs.customCategories || []).map(function(c, i){ return '<span class="badge" style="margin:0 6px 6px 0">' + esc(c) + ' <a href="#" data-delcat="' + i + '" style="color:var(--danger);text-decoration:none">✕</a></span>'; }).join("") || '<span class="mut">None — "Bank account" came over from the original app.</span>';
    document.querySelectorAll("[data-delcat]").forEach(function(a){ a.addEventListener("click", function(ev){ ev.preventDefault(); DB.prefs.customCategories.splice(parseInt(a.getAttribute("data-delcat"),10), 1); save(); renderCats(); }); });
  }
  renderAutos(); renderCats();
  $("p_save").addEventListener("click", function(){ p.current = $("p_current").value; p.wants = $("p_wants").value; p.mustHaves = $("p_must").value; p.notes = $("p_notes").value; save(); toast("Profile saved"); });
  $("a_add").addEventListener("click", function(){
    DB.autos.push({ label: $("a_label").value, brand: $("a_brand").value, model: $("a_model").value, year: parseInt($("a_year").value,10) || "", mileage: parseInt($("a_miles").value,10) || 0, accident: $("a_acc").value });
    save(); renderProfile(); toast("Car added");
  });
  $("h_save").addEventListener("click", function(){
    DB.home.city = $("h_city").value; DB.home.zip = $("h_zip").value; DB.home.price = parseFloat($("h_price").value) || 0; DB.home.sqft = parseInt($("h_sqft").value,10) || 0;
    DB.home.yearBuilt = parseInt($("h_year").value,10) || ""; DB.home.beds = parseFloat($("h_beds").value) || 0; DB.home.baths = parseFloat($("h_baths").value) || 0; save(); toast("Home saved");
  });
  $("c_add").addEventListener("click", function(){ var n = $("c_name").value.trim(); if(!n) return; DB.prefs.customCategories = DB.prefs.customCategories || []; if(DB.prefs.customCategories.indexOf(n) < 0) DB.prefs.customCategories.push(n); save(); renderCats(); });
  $("pr_save").addEventListener("click", function(){ DB.prefs.sortBy = $("pr_sort").value; save(); toast("Preferences saved"); });
  $("bkBtn2").addEventListener("click", function(){ view = "backup"; render(); window.scrollTo(0,0); });
}

/* ---------- Backup ---------- */
function renderBackup(){
  $("main").innerHTML = '<div class="card"><h2 class="sec">Backup</h2><p class="mut" style="margin-top:0">Your deals (including flyer photos), profile, cars, home and preferences live only on this device. Export a backup file and keep it somewhere safe (for example Google Drive); import it on another device or browser to restore everything.</p>' +
    '<div class="row"><button id="exportBtn">⬇ Export backup</button><button id="importBtn">⬆ Import backup</button></div></div>';
  $("exportBtn").addEventListener("click", function(){ download("dealscope-backup.json", JSON.stringify(DB, null, 2)); });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
}
function download(name, text){
  var blob = new Blob([text], {type: "application/json"}); var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
$("importFile").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ try { var data = JSON.parse(rd.result); if(!data || !Array.isArray(data.deals) || !data.profile) throw 0;
    if(confirm("Import this backup? It will replace all current deals and profile data.")){ DB = data; save(); view = "home"; render(); toast("Backup imported"); } } catch(e){ alert("That file is not a valid DealScope backup."); } };
  rd.readAsText(f); this.value = "";
});

function render(){ setNav(); if(view === "home") renderHome(); else if(view === "compare") renderCompare(); else if(view === "check") renderCheck(); else if(view === "deal") renderDeal(); else if(view === "history") renderHistory(); else if(view === "profile") renderProfile(); else if(view === "backup") renderBackup(); }
render();
window.DS = { getDB: function(){ return DB; } };
</script>
