<style>
:root{--fu:#A21CAF;--fu-d:#86198F;--bg:#FAE8FF;--card:#FFFFFF;--ink:#3B0764;--mut:#64748B;--line:#F0ABFC;--danger:#B91C1C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--fu);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .brand{font-size:19px;font-weight:800}
header .sub{font-size:12.5px;opacity:.9;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px}
button.primary{background:var(--fu);border-color:var(--fu);color:#fff;font-weight:700}
button.danger{color:var(--danger);border-color:#F3C2C2}
button.small{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:56px;resize:vertical}
label.fl{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
label.fl:first-child{margin-top:0}
.row{display:flex;gap:8px}.row>*{flex:1}
.mut{color:var(--mut);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.pill.on{background:var(--fu);color:#fff;border-color:var(--fu);font-weight:700}
.badge{background:#FDF4FF;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;border:none;border-radius:0;padding:11px 0 13px;font-size:13px;color:var(--mut)}
nav button.on{color:var(--fu);font-weight:800}
h2.sec{font-size:17px;margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#3B0764;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:9;max-width:90vw;text-align:center}
.sheet{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px 20px;color:#111}
.sheet h1{font-size:20px;margin:0 0 4px}
.sheet h3{margin:18px 0 8px;font-size:15px}
.sheet ol{margin:0;padding-left:22px}
.sheet li{margin:0 0 12px;line-height:1.5}
.sheet .ans{color:#86198F;font-weight:700}
.cursive{font-family:"Dancing Script",cursive;font-size:36px;line-height:1.2;color:#334}
.ruled{border-bottom:2px solid #CBD5E1;height:46px;margin-bottom:10px}
.trace{color:#C4B5FD}
@media print{
  header, nav, .noprint, .toast{display:none !important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .sheet{border:none;border-radius:0}
}
</style>
</head>

function startBuilder(profile){

}
function shuffle(a){ for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function genArithmetic(b){
  var qs = [], seen = {};
  function push(q, a){ var k = q; if(seen[k]) return; seen[k] = 1; qs.push({ q: q, a: String(a) }); }
  var guard = 0;
  while(qs.length < b.count && guard++ < 500){
    var op = b.ops[Math.floor(Math.random() * b.ops.length)];
    if(op === "x"){ var t = b.tables[Math.floor(Math.random() * b.tables.length)] || 4; var m = 2 + Math.floor(Math.random() * 11); push(t + " x " + m + " = ?", t * m); }
    else if(op === "÷"){ var d = b.tables[Math.floor(Math.random() * b.tables.length)] || 4; var qt = 2 + Math.floor(Math.random() * 11); push((d * qt) + " ÷ " + d + " = ?", qt); }
    else if(op === "+"){ var x = 1 + Math.floor(Math.random() * b.maxNum), y = 1 + Math.floor(Math.random() * b.maxNum); push(x + " + " + y + " = ?", x + y); }
    else if(op === "-"){ var x2 = 1 + Math.floor(Math.random() * b.maxNum), y2 = 1 + Math.floor(Math.random() * x2); push(x2 + " - " + y2 + " = ?", x2 - y2); }
  }
  return qs;
}

  var asb = $("addSecBtn"); if(asb) asb.addEventListener("click", function(){ syncManual(); b.manual.push({ title: "Section " + (b.manual.length + 1), text: "" }); renderManual(); });
  function ptCopy(t, done){
    function fallback(){ var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch(e){} ta.remove(); if(done) done(); }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){ if(done) done(); }, fallback); else fallback();
  }
  function buildTutorPrompt(){
    sync();
    var p = profileById(b.profileId);
    var L = [];
    L.push("Create a practice worksheet for my student.");
    L.push("");
    L.push("Student: " + (p ? p.name : "Student") + (b.grade ? " \u2014 " + b.grade : "") + (p ? " (complexity level " + p.level + " of 5)" : ""));
    L.push("Subject: " + (b.subject || (p ? p.subject : "")));
    if(b.baseline) L.push("Difficulty baseline: " + b.baseline);
    if(p && p.baseline && p.baseline !== b.baseline) L.push("Student baseline on file: " + p.baseline);
    if(p && p.notes) L.push("Focus notes for this student: " + p.notes);
    if(b.context) L.push("Topic / goals for this worksheet: " + b.context);
    L.push("Questions: about " + b.count + ", in 1\u20133 sections. Layout style: " + b.layout + ". Timeline: " + (b.timeline === "multi" ? "multi-day progressive" : "single session") + ".");
    L.push("");
    L.push("Write clear, age-appropriate questions with exactly one correct answer each, ordered from easier to harder. The answer key goes in the block below \u2014 my app hides it until I choose to show it.");
    L.push("");
    L.push("End your answer with EXACTLY this block, so my app can save it as a printable worksheet:");
    L.push("===WORKSHEET===");
    L.push("TITLE: <worksheet title>");
    L.push("SECTION: <section title>");
    L.push("Q: <question> | A: <answer>");
    L.push("...one Q line per question; repeat SECTION lines as needed...");
    L.push("METRICS: <reading level / difficulty / skills practiced, in one line>");
    L.push("===END===");
    return L.join("\n");
  }
  function parseWorksheet(text){
    var bm = /===WORKSHEET===([\s\S]*?)===END===/.exec(text);
    var src2 = bm ? bm[1] : text;
    var title = "", metricsLine = "", sections = [], cur = null, m;
    function sec(t){ cur = { title: t || "Practice", questions: [] }; sections.push(cur); }
    src2.split(/\r?\n/).forEach(function(raw){
      var line = raw.trim(); if(!line) return;
      if((m = /^TITLE:\s*(.+)$/i.exec(line))){ title = m[1].trim(); return; }
      if((m = /^METRICS:\s*(.+)$/i.exec(line))){ metricsLine = m[1].trim(); return; }
      if((m = /^SECTION:\s*(.+)$/i.exec(line))){ sec(m[1].trim()); return; }
      if((m = /^Q:\s*(.+?)\s*\|\s*A:\s*(.*)$/i.exec(line))){ if(!cur) sec("Practice"); cur.questions.push({ q: m[1].trim(), a: m[2].trim() }); return; }
      if((m = /^Q:\s*(.+)$/i.exec(line))){ if(!cur) sec("Practice"); cur.questions.push({ q: m[1].trim(), a: "" }); return; }
    });
    sections = sections.filter(function(s){ return s.questions.length; });
    return { title: title, metricsLine: metricsLine, sections: sections, structured: !!bm };
  }
  $("b_profile").addEventListener("change", function(){ sync(); var p = profileById(this.value); if(p){ b.grade = p.gradeAge; b.subject = p.subject; b.baseline = p.baseline; } renderBuilder(); });
  document.querySelectorAll("[data-kind]").forEach(function(p){ p.addEventListener("click", function(){ sync(); b.kind = p.getAttribute("data-kind"); renderBuilder(); }); });
  document.querySelectorAll("[data-op]").forEach(function(p){ p.addEventListener("click", function(){ sync(); var k = p.getAttribute("data-op"); var ix = b.ops.indexOf(k); if(ix >= 0 && b.ops.length > 1) b.ops.splice(ix, 1); else if(ix < 0) b.ops.push(k); renderBuilder(); }); });
  document.querySelectorAll("[data-table]").forEach(function(p){ p.addEventListener("click", function(){ sync(); var k = parseInt(p.getAttribute("data-table"), 10); var ix = b.tables.indexOf(k); if(ix >= 0 && b.tables.length > 1) b.tables.splice(ix, 1); else if(ix < 0) b.tables.push(k); renderBuilder(); }); });
  if(b.kind === "ai"){
    var gb = $("genBtn"); if(gb) gb.style.display = "none";
    $("aiPrompt").value = buildTutorPrompt();
    $("aiChatGPT").addEventListener("click", function(){ $("aiPrompt").value = buildTutorPrompt(); window.open("https://chatgpt.com/?q=" + encodeURIComponent($("aiPrompt").value), "_blank"); });
    $("aiClaude").addEventListener("click", function(){ $("aiPrompt").value = buildTutorPrompt(); window.open("https://claude.ai/new?q=" + encodeURIComponent($("aiPrompt").value), "_blank"); });
    $("aiGemini").addEventListener("click", function(){ $("aiPrompt").value = buildTutorPrompt(); ptCopy($("aiPrompt").value, function(){ toast("Prompt copied \u2014 paste it in Gemini"); window.open("https://gemini.google.com/app", "_blank"); }); });
    $("aiCopy").addEventListener("click", function(){ $("aiPrompt").value = buildTutorPrompt(); ptCopy($("aiPrompt").value, function(){ toast("Prompt copied"); }); });
    $("aiImportBtn").addEventListener("click", function(){
      var text = $("aiAnswer").value.trim();
      if(!text){ $("aiMsg").textContent = "Paste the AI\u2019s answer first."; return; }
      sync();
      var r = parseWorksheet(text);
      var prof = profileById(b.profileId);
      var secs = r.sections.length ? r.sections : [{ title: "AI worksheet (unparsed)", questions: [{ q: "This answer did not arrive in worksheet format \u2014 its full text is kept on this session (see below).", a: "" }] }];
      var base = { id: "s" + Date.now(), profileId: b.profileId, profileName: prof ? prof.name : "", subject: b.subject, grade: b.grade,
        layout: b.layout, timeline: b.timeline, baseline: b.baseline, context: b.context, kind: "ai", status: "in_progress", created: todayISO(),
        title: r.title || (b.subject || "Worksheet") + " \u2014 AI worksheet",
        count: secs.reduce(function(n, s){ return n + s.questions.length; }, 0), sections: secs,
        outline: secs.map(function(s, i){ return "Section " + (i + 1) + ": " + s.title + " (" + s.questions.length + " questions)"; }).join(". ") + ".",
        metrics: { lexile: "", difficulty: "", bloom: "", notes: r.metricsLine || "" },
        aiText: text, aiSource: $("aiSource").value, aiDate: new Date().toISOString() };
      DB.sessions.push(base); save();
      currentSessionId = base.id; showKey = false; view = "worksheet"; render();
      toast(r.sections.length ? "Worksheet saved to the student\u2019s sessions" : "Saved \u2014 no Q:/A: lines found, so the text is kept on the session");
    });
  }
  $("genBtn").addEventListener("click", function(){
    sync();
    var prof = profileById(b.profileId);
    var base = { id: "s" + Date.now(), profileId: b.profileId, profileName: prof ? prof.name : "", subject: b.subject, grade: b.grade,
      layout: b.layout, timeline: b.timeline, baseline: b.baseline, context: b.context, kind: b.kind, status: "in_progress", created: todayISO(), metrics: null, outline: "" };
    if(b.kind === "arithmetic"){
      var qs = genArithmetic(b);
      if(!qs.length){ alert("Pick at least one operation."); return; }
      base.title = (b.subject || "Arithmetic") + " — drill (" + b.ops.join(" ") + ")";
      base.count = qs.length; base.sections = [{ title: "Practice", questions: qs }];
      base.outline = "Generated drill: operations " + b.ops.join(", ") + (b.tables.length ? "; tables " + b.tables.join(", ") : "") + ".";
    } else if(b.kind === "cursive"){
      var lines = b.lines.split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
      if(!lines.length){ alert("Type at least one word or sentence."); return; }
      base.title = (b.subject || "Cursive writing") + " — practice sheet";
      base.count = lines.length; base.lines = lines; base.sections = [];
    } else {
      var secs = b.manual.map(function(sec){
        var qs2 = sec.text.split("\n").map(function(x){ return x.trim(); }).filter(Boolean).map(function(line){
          var parts = line.split("|"); return { q: parts[0].trim(), a: parts.length > 1 ? parts[1].trim() : "" };
        });
        return { title: sec.title || "Section", questions: qs2 };
      }).filter(function(sec){ return sec.questions.length; });
      if(!secs.length){ alert("Add at least one question (Question | Answer per line)."); return; }
      base.title = b.subject || "Worksheet";
      base.count = secs.reduce(function(n, sec){ return n + sec.questions.length; }, 0); base.sections = secs;
    }
    DB.sessions.push(base); save();
    currentSessionId = base.id; showKey = false; view = "worksheet"; render(); toast("Worksheet saved to the student's sessions");
  });
}

/* ---------- Backup ---------- */
function renderBackup(){
  $("main").innerHTML = '<div class="card"><h2 class="sec">Backup</h2><p class="mut" style="margin-top:0">Student profiles and worksheet sessions live only on this device. Export a backup file and keep it somewhere safe (for example Google Drive); import it on another device or browser to restore everything.</p>' +
    '<div class="row"><button id="exportBtn">⬇ Export backup</button><button id="importBtn">⬆ Import backup</button></div></div>';
  $("exportBtn").addEventListener("click", function(){ download("private-tutor-backup.json", JSON.stringify(DB, null, 2)); });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
}
function download(name, text){
  var blob = new Blob([text], {type: "application/json"}); var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
$("importFile").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ try { var data = JSON.parse(rd.result); if(!data || !Array.isArray(data.profiles) || !Array.isArray(data.sessions)) throw 0;
    if(confirm("Import this backup? It will replace all current profiles and sessions.")){ DB = data; save(); view = "home"; render(); toast("Backup imported"); } } catch(e){ alert("That file is not a valid PrivateTutor backup."); } };
  rd.readAsText(f); this.value = "";
});

function render(){ setNav(); if(view === "home") renderHome(); else if(view === "profile") renderProfile(); else if(view === "pform") renderProfileForm(); else if(view === "worksheet") renderWorksheet(); else if(view === "builder") renderBuilder(); else if(view === "backup") renderBackup(); }
render();
window.PT = { getDB: function(){ return DB; }, genArithmetic: genArithmetic };
</script>
</body>
</html>
