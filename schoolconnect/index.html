<meta name="theme-color" content="#1E40AF">
<style>
:root{--blue:#1E40AF;--blue2:#2563EB;--bg:#EFF6FF;--card:#FFFFFF;--ink:#172554;--mut:#64748B;--line:#BFDBFE;--danger:#B91C1C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--blue);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .brand{font-size:19px;font-weight:800}
header .sub{font-size:12.5px;opacity:.9;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
button.danger{color:var(--danger);border-color:#F3C2C2}
button.small{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:52px;resize:vertical}
label.fl{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
label.fl:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fix{flex:0 0 auto}
.mut{color:var(--mut);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;border:none;border-radius:0;padding:11px 0 13px;font-size:12.5px;color:var(--mut)}
nav button.on{color:var(--blue);font-weight:800}
h2.sec{font-size:17px;margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#172554;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:9;max-width:90vw;text-align:center}
.schoolcard{border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.mail{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.mail .snip{color:var(--mut);font-size:13px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.act li{margin:3px 0}
.histrow{cursor:pointer}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;color:#fff;font-weight:700}
a.ext{color:var(--blue2);font-weight:600}
</style>
</head>

var MEM = null;
function lsGet(){ try { return window.localStorage.getItem(LS_KEY); } catch(e){ return MEM; } }
function lsSet(v){ MEM = v; try { window.localStorage.setItem(LS_KEY, v); } catch(e){} }
function save(){ lsSet(JSON.stringify(DB)); }
function seedDB(){ return JSON.parse(JSON.stringify(SEED)); }
var DB;
try { var raw = lsGet(); DB = raw ? JSON.parse(raw) : seedDB(); if(!DB || !Array.isArray(DB.scans) || !Array.isArray(DB.schools)) DB = seedDB(); }
catch(e){ DB = seedDB(); }
save();

var COLORS = { orange: ["#EA580C", "#FFF7ED"], blue: ["#2563EB", "#EFF6FF"], green: ["#16A34A", "#F0FDF4"], purple: ["#9333EA", "#FAF5FF"], pink: ["#DB2777", "#FDF2F8"], teal: ["#0D9488", "#F0FDFA"] };
var view = "home", viewDate = todayISO(), rangeDays = 1, histQuery = "";
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function $(id){ return document.getElementById(id); }
function toast(msg){ var t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(function(){ t.style.display = "none"; }, 2800); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function todayISO(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function fmtDate(iso){ if(!iso) return ""; var p = iso.split("-"); var M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; var D = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]; var d = new Date(parseInt(p[0],10), parseInt(p[1],10) - 1, parseInt(p[2],10)); return D[d.getDay()] + ", " + M[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }
function schoolByName(name){ var s = null; DB.schools.forEach(function(x){ if(x.name === name) s = x; }); return s; }
function scanFor(date, schoolName){ var s = null; DB.scans.forEach(function(x){ if(x.scanDate === date && x.schoolName === schoolName) s = x; }); return s; }
function setNav(){ var bs = document.querySelectorAll("nav button"); for(var i=0;i<bs.length;i++) bs[i].className = bs[i].getAttribute("data-nav") === view ? "on" : ""; }
document.querySelector("nav").addEventListener("click", function(e){ var b = e.target.closest("[data-nav]"); if(b){ view = b.getAttribute("data-nav"); render(); window.scrollTo(0,0); } });

function scanHTML(scan, school){
  var c = COLORS[school ? school.color : "blue"] || COLORS.blue;
  var h = '<div class="schoolcard" style="background:' + c[1] + '"><div class="row"><b style="font-size:16px">' + esc(scan.schoolName) + '</b><span class="tag fix" style="background:' + c[0] + '">' + scan.emailCount + ' emails</span></div>';
  if(scan.viaScript) h += '<p class="mut" style="margin:6px 0 0">Fetched via your Gmail script — no AI summary for script scans.</p>';
  if(scan.summary) h += '<p style="margin:8px 0 0">' + esc(scan.summary) + '</p>';
  if(scan.actionItems && scan.actionItems.length) h += '<b style="display:block;margin-top:10px">Action items</b><ul class="act" style="margin:4px 0 0;padding-left:19px">' + scan.actionItems.map(function(a){ return '<li>' + esc(a) + '</li>'; }).join("") + '</ul>';
  if(!scan.emails.length) h += '<p class="mut" style="margin:8px 0 0">No emails in this scan.</p>';
  scan.emails.forEach(function(m){
    h += '<div class="mail"><b>' + esc(m.subject || "(no subject)") + '</b><div class="mut">' + esc(m.sender) + (m.senderEmail ? ' · ' + esc(m.senderEmail) : '') + (m.time ? ' · ' + esc(m.time) : '') + '</div>' + (m.snippet ? '<div class="snip">' + esc(m.snippet) + '</div>' : '') + '</div>';
  });
  return h + '</div>';
}
function gmailSearchURL(school, days){
  var parts = [];
  school.domains.forEach(function(d){ parts.push("from:" + d.replace(/^@/, "")); });
  school.keywords.forEach(function(k){ parts.push('"' + k + '"'); });
  var d = new Date(); d.setDate(d.getDate() - (days - 1));
  var after = d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate());
  var q = "(" + parts.join(" OR ") + ") after:" + after;
  return "https://mail.google.com/mail/u/0/#search/" + encodeURIComponent(q);
}
function renderHome(){
  var h = '<div class="card"><h2 class="sec">School Inbox</h2><div class="mut">' + fmtDate(viewDate) + '</div>' +
    '<label class="fl">View a day\'s scan</label><input type="date" id="viewDate" value="' + viewDate + '">' +
    '<label class="fl">Check range</label><select id="rangeSel">' + [[1, "Today only"], [2, "Yesterday + Today"], [3, "Last 3 days"], [7, "Last 7 days"], [14, "Last 14 days"]].map(function(r){ return '<option value="' + r[0] + '"' + (rangeDays === r[0] ? " selected" : "") + '>' + r[1] + '</option>'; }).join("") + '</select>' +
    '<button class="primary" id="checkBtn" style="width:100%;margin-top:12px;padding:12px">📧 Check Emails</button>' +
    '<div id="checkOut" style="margin-top:10px"></div></div>';
  var any = false;
  DB.schools.forEach(function(school){
    var scan = scanFor(viewDate, school.name);
    if(scan){ any = true; h += scanHTML(scan, school); }
    else { var c = COLORS[school.color] || COLORS.blue; h += '<div class="schoolcard" style="background:' + c[1] + '"><b style="font-size:16px">' + esc(school.name) + '</b><p class="mut" style="margin:6px 0 0">No scan for this date — pick a scanned date in History, or check emails above.</p></div>'; }
  });
  $("main").innerHTML = h;
  $("viewDate").addEventListener("change", function(){ viewDate = this.value; renderHome(); });
  $("rangeSel").addEventListener("change", function(){ rangeDays = parseInt(this.value, 10); });
  $("checkBtn").addEventListener("click", function(){ checkEmails(); });
}
function checkEmails(){
  var out = $("checkOut");
  var url = (DB.scriptUrl || "").trim();
  if(!url){ out.innerHTML = gmailFallbackHTML("No Gmail script URL is set (Settings)."); return; }
  out.innerHTML = '<p class="mut">Contacting your Gmail script…</p>';
  var full = url + (url.indexOf("?") >= 0 ? "&" : "?") + "days=" + rangeDays;
  fetch(full).then(function(r){ return r.text(); }).then(function(txt){
    var items = null;
    try { var data = JSON.parse(txt); items = Array.isArray(data) ? data : (data.emails || data.messages || null); } catch(e){}
    if(!items) throw new Error("bad");
    var norm = items.map(function(m){
      return { id: m.message_id || m.id || "", subject: m.subject || m.title || "", sender: m.sender || m.from || m.sender_name || "", senderEmail: m.sender_email || m.email || m.from_email || "", time: m.time || m.date || "", snippet: m.snippet || m.body || m.text || "" };
    });
    var added = 0;
    DB.schools.forEach(function(school){
      var doms = school.domains.map(function(d){ return d.replace(/^@/, "").toLowerCase(); });
      var mine = norm.filter(function(m){
        var em = (m.senderEmail || "").toLowerCase();
        for(var i = 0; i < doms.length; i++) if(em.indexOf(doms[i]) >= 0) return true;
        var hay = (m.subject + " " + m.snippet).toLowerCase();
        for(var j = 0; j < school.keywords.length; j++) if(hay.indexOf(school.keywords[j].toLowerCase()) >= 0) return true;
        return false;
      });
      var existing = scanFor(todayISO(), school.name);
      if(existing && existing.viaScript){ existing.emails = mine; existing.emailCount = mine.length; }
      else DB.scans.push({ id: "sc" + Date.now() + school.id, scanDate: todayISO(), schoolName: school.name, emailCount: mine.length, summary: "", actionItems: [], emails: mine, status: "done", viaScript: true });
      added += mine.length;
    });
    save(); viewDate = todayISO(); renderHome();
    toast("Script scan saved — " + added + " emails matched");
  }).catch(function(){
    out.innerHTML = gmailFallbackHTML("The Gmail script did not return usable data. It may need redeploying with open (\"anyone\") access — the deployment stored from Base44 currently answers 404 / a sign-in wall. Meanwhile, search Gmail directly:");
  });
}
function gmailFallbackHTML(msg){
  var h = '<p class="mut">' + esc(msg) + '</p>';
  DB.schools.forEach(function(school){ h += '<p style="margin:6px 0"><a class="ext" target="_blank" rel="noopener" href="' + gmailSearchURL(school, rangeDays) + '">🔍 Search Gmail — ' + esc(school.name) + ' (last ' + rangeDays + ' day' + (rangeDays > 1 ? "s" : "") + ')</a></p>'; });
  return h;
}

/* ---------- History ---------- */
function renderHistory(){
  var scans = DB.scans.slice().sort(function(a, b){ return a.scanDate < b.scanDate ? 1 : (a.scanDate > b.scanDate ? -1 : (a.schoolName < b.schoolName ? -1 : 1)); });
  var q = histQuery.trim().toLowerCase();
  if(q) scans = scans.filter(function(s){
    if(s.schoolName.toLowerCase().indexOf(q) >= 0 || (s.summary || "").toLowerCase().indexOf(q) >= 0 || (s.actionItems || []).join(" ").toLowerCase().indexOf(q) >= 0) return true;
    return s.emails.some(function(m){ return (m.subject + " " + m.sender + " " + (m.snippet || "")).toLowerCase().indexOf(q) >= 0; });
  });
  var h = '<div class="card"><h2 class="sec">Scan History</h2><input id="hq" type="search" placeholder="Search summaries, subjects, senders…" value="' + esc(histQuery) + '"><p class="mut" style="margin:8px 0 0">' + scans.length + ' scans · ' + DB.scans.reduce(function(n, s){ return n + s.emails.length; }, 0) + ' emails total in archive</p></div>';
  scans.forEach(function(s){
    var school = schoolByName(s.schoolName); var c = COLORS[school ? school.color : "blue"] || COLORS.blue;
    h += '<div class="card histrow" data-scan="' + s.id + '"><div class="row"><b>' + fmtDate(s.scanDate) + '</b><span class="tag fix" style="background:' + c[0] + '">' + esc(s.schoolName) + '</span></div><div class="mut" style="margin-top:3px">' + s.emailCount + ' emails' + (s.viaScript ? ' · via script' : '') + '</div>' + (s.summary ? '<p style="margin:6px 0 0">' + esc(s.summary.slice(0, 160)) + (s.summary.length > 160 ? "…" : "") + '</p>' : '') + '</div>';
  });
  if(!scans.length) h += '<div class="card"><p class="mut" style="margin:0">No scans match.</p></div>';
  $("main").innerHTML = h;
  $("hq").addEventListener("input", function(){ histQuery = this.value; var pos = this.selectionStart; renderHistory(); var el = $("hq"); el.focus(); el.setSelectionRange(pos, pos); });
  document.querySelectorAll("[data-scan]").forEach(function(el){ el.addEventListener("click", function(){
    var s = null; DB.scans.forEach(function(x){ if(x.id === el.getAttribute("data-scan")) s = x; });
    if(s){ viewDate = s.scanDate; view = "home"; render(); window.scrollTo(0,0); }
  }); });
}

    '<input id="scriptUrl" value="' + esc(DB.scriptUrl || "") + '" placeholder="https://script.google.com/macros/s/…/exec"><button class="primary" id="saveUrl" style="margin-top:9px">Save URL</button></div>' +
    '<div class="card"><h2 class="sec">Schools</h2><div id="schoolBox"></div>' +
    '<label class="fl">Add school / organization</label><input id="ns_name" placeholder="Name"><div class="row" style="margin-top:7px"><input id="ns_domains" placeholder="Domains, comma separated (@school.edu)"><input id="ns_keywords" placeholder="Keywords, comma separated"></div>' +
    '<div class="row" style="margin-top:7px"><select id="ns_color">' + Object.keys(COLORS).map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join("") + '</select><button class="primary fix" id="ns_add">Add School</button></div></div>';
  $("main").innerHTML = h;
  $("saveUrl").addEventListener("click", function(){ DB.scriptUrl = $("scriptUrl").value.trim(); save(); toast("Script URL saved"); });
  function renderSchools(){
    $("schoolBox").innerHTML = DB.schools.map(function(s, i){
      var c = COLORS[s.color] || COLORS.blue;
      return '<div style="border-top:1px dashed var(--line);padding-top:10px;margin-top:10px"><div class="row"><b style="color:' + c[0] + '">' + esc(s.name) + '</b><span class="fix"><button class="small" data-up="' + i + '">↑</button> <button class="small" data-down="' + i + '">↓</button> <button class="small danger" data-sdel="' + i + '">✕</button></span></div>' +
      '<label class="fl">Domains (comma separated)</label><input data-sdom="' + i + '" value="' + esc(s.domains.join(", ")) + '">' +
      '<label class="fl">Keywords (comma separated)</label><input data-skw="' + i + '" value="' + esc(s.keywords.join(", ")) + '">' +
      '<label class="fl">Color</label><select data-scol="' + i + '">' + Object.keys(COLORS).map(function(cc){ return '<option value="' + cc + '"' + (s.color === cc ? " selected" : "") + '>' + cc + '</option>'; }).join("") + '</select></div>';
    }).join("");
    function split(v){ return v.split(",").map(function(x){ return x.trim(); }).filter(Boolean); }
    document.querySelectorAll("[data-sdom]").forEach(function(inp){ inp.addEventListener("change", function(){ DB.schools[parseInt(inp.getAttribute("data-sdom"), 10)].domains = split(inp.value); save(); }); });
    document.querySelectorAll("[data-skw]").forEach(function(inp){ inp.addEventListener("change", function(){ DB.schools[parseInt(inp.getAttribute("data-skw"), 10)].keywords = split(inp.value); save(); }); });
    document.querySelectorAll("[data-scol]").forEach(function(sel){ sel.addEventListener("change", function(){ DB.schools[parseInt(sel.getAttribute("data-scol"), 10)].color = sel.value; save(); renderSchools(); }); });
    document.querySelectorAll("[data-sdel]").forEach(function(b){ b.addEventListener("click", function(){ if(confirm("Remove this school profile? Its saved scans stay in History.")){ DB.schools.splice(parseInt(b.getAttribute("data-sdel"), 10), 1); save(); renderSchools(); } }); });
    document.querySelectorAll("[data-up]").forEach(function(b){ b.addEventListener("click", function(){ var i = parseInt(b.getAttribute("data-up"), 10); if(i > 0){ var t = DB.schools[i-1]; DB.schools[i-1] = DB.schools[i]; DB.schools[i] = t; save(); renderSchools(); } }); });
    document.querySelectorAll("[data-down]").forEach(function(b){ b.addEventListener("click", function(){ var i = parseInt(b.getAttribute("data-down"), 10); if(i < DB.schools.length - 1){ var t = DB.schools[i+1]; DB.schools[i+1] = DB.schools[i]; DB.schools[i] = t; save(); renderSchools(); } }); });
  }
  renderSchools();
  $("ns_add").addEventListener("click", function(){
    var n = $("ns_name").value.trim(); if(!n) return;
    function split(v){ return v.split(",").map(function(x){ return x.trim(); }).filter(Boolean); }
    DB.schools.push({ id: "s" + Date.now(), name: n, keywords: split($("ns_keywords").value), domains: split($("ns_domains").value), color: $("ns_color").value });
    save(); renderSchools(); toast("School added");
  });
}

/* ---------- Backup ---------- */
function renderBackup(){
  $("main").innerHTML = '<div class="card"><h2 class="sec">Backup</h2><p class="mut" style="margin-top:0">The scan archive, school profiles and script URL live only on this device. Export a backup file and keep it somewhere safe (for example Google Drive); import it on another device or browser to restore everything.</p>' +
    '<div class="row"><button id="exportBtn">⬇ Export backup</button><button id="importBtn">⬆ Import backup</button></div></div>';
  $("exportBtn").addEventListener("click", function(){ download("schoolconnect-backup.json", JSON.stringify(DB, null, 2)); });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
}
function download(name, text){
  var blob = new Blob([text], {type: "application/json"}); var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
$("importFile").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ try { var data = JSON.parse(rd.result); if(!data || !Array.isArray(data.scans) || !Array.isArray(data.schools)) throw 0;
    if(confirm("Import this backup? It will replace all current SchoolConnect data.")){ DB = data; save(); view = "home"; render(); toast("Backup imported"); } } catch(e){ alert("That file is not a valid SchoolConnect backup."); } };
  rd.readAsText(f); this.value = "";
});

function render(){ setNav(); if(view === "home") renderHome(); else if(view === "history") renderHistory(); else if(view === "settings") renderSettings(); else if(view === "backup") renderBackup(); }
render();
window.SC = { getDB: function(){ return DB; }, gmailSearchURL: gmailSearchURL, scanFor: scanFor };
</script>
</body>
</html>
