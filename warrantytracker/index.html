<style>
:root{--red:#7F1D1D;--red2:#991B1B;--bg:#FEF2F2;--card:#FFFFFF;--ink:#450A0A;--mut:#64748B;--line:#FECACA;--danger:#B91C1C;--ok:#15803D;--warn:#B45309}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--red);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .brand{font-size:19px;font-weight:800}
header .sub{font-size:12.5px;opacity:.9;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px}
button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
button.danger{color:var(--danger);border-color:#F3C2C2}
button.small{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:52px;resize:vertical}
label.fl{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
label.fl:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fix{flex:0 0 auto}
.mut{color:var(--mut);font-size:13px}
.badge{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;border:1px solid var(--line);white-space:nowrap}
.st-Active,.st-Valid{background:#DCFCE7;color:var(--ok)}
.st-Expiring-Soon{background:#FEF3C7;color:var(--warn)}
.st-Expired{background:#FEE2E2;color:var(--danger)}
.st-No-Warranty{background:#F1F5F9;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;border:none;border-radius:0;padding:10px 0 12px;font-size:11px;color:var(--mut)}
nav button.on{color:var(--red);font-weight:800}
h2.sec{font-size:17px;margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#450A0A;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:9;max-width:90vw;text-align:center}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stats .card{flex:1 1 40%;text-align:center;padding:12px 4px;margin-bottom:8px}
.stats .n{font-size:22px;font-weight:800}
img.doc{width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:8px}
.donut{width:150px;height:150px;border-radius:50%;margin:0 auto;position:relative}
.donut:after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.bar-track{flex:1;background:#FEE2E2;border-radius:6px;height:16px;overflow:hidden}
.bar-fill{background:var(--red2);height:100%}
</style>
</head>

function $(id){ return document.getElementById(id); }
function toast(msg){ var t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(function(){ t.style.display = "none"; }, 2600); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function todayISO(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function fmtDate(iso){ if(!iso) return "—"; var p = iso.split("-"); var M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return M[parseInt(p[1],10)-1] + " " + parseInt(p[2],10) + ", " + p[0]; }
function daysUntil(iso){ if(!iso) return null; var a = new Date(todayISO() + "T00:00:00"), b = new Date(iso + "T00:00:00"); return Math.round((b - a) / 86400000); }
function money(n){ if(n == null || n === "") return ""; return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function addMonths(iso, months){ if(!iso) return ""; var p = iso.split("-"); var d = new Date(parseInt(p[0],10), parseInt(p[1],10) - 1 + months, parseInt(p[2],10)); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function purchaseStatus(p){
  if(!p.warrantyEnd) return "No Warranty";
  var d = daysUntil(p.warrantyEnd);
  if(d < 0) return "Expired";
  if(d <= 183) return "Expiring Soon";
  return "Active";
}
function expiryStatus(e){
  var d = daysUntil(e.expiryDate);
  if(d < 0) return "Expired";
  if(e.alertDate && todayISO() >= e.alertDate) return "Expiring Soon";
  return "Valid";
}

  var cols = { "Active": "#22C55E", "Expiring Soon": "#F59E0B", "Expired": "#EF4444", "No Warranty": "#94A3B8" };
  var acc = 0, segs = [];
  Object.keys(cols).forEach(function(k){ var pct = pc[k] / total * 100; if(pct > 0){ segs.push(cols[k] + " " + acc + "% " + (acc + pct) + "%"); acc += pct; } });
  var donut = segs.length ? "conic-gradient(" + segs.join(",") + ")" : "#F1F5F9";
  var months = [], counts = [];
  var now = new Date();
  for(var i = 0; i < 6; i++){
    var d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    var key = d.getFullYear() + "-" + pad(d.getMonth() + 1);
    var label = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()] + " " + d.getFullYear();
    var n = 0;
    DB.purchases.forEach(function(p){ if(p.warrantyEnd && p.warrantyEnd.slice(0, 7) === key) n++; });
    DB.expiries.forEach(function(e){ if(e.expiryDate && e.expiryDate.slice(0, 7) === key) n++; });
    months.push(label); counts.push(n);
  }
  var maxC = Math.max.apply(null, counts.concat([1]));
  var anyNext = counts.some(function(n){ return n > 0; });
  var cats = {};
  DB.expiries.forEach(function(e){ cats[e.category] = (cats[e.category] || 0) + 1; });
  $("main").innerHTML = '<div class="stats">' +
    ["Active","Expiring Soon","Expired","No Warranty"].map(function(k){ return '<div class="card"><div class="n">' + pc[k] + '</div><div class="mut">' + k + '</div></div>'; }).join("") + '</div>' +
    '<div class="card"><h2 class="sec">Warranty status</h2><div class="donut" style="background:' + donut + '"></div>' +
    '<div style="margin-top:12px">' + Object.keys(cols).map(function(k){ return '<div class="mut"><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:' + cols[k] + ';margin-right:6px"></span>' + k + ': ' + pc[k] + '</div>'; }).join("") + '</div></div>' +
    '<div class="card"><h2 class="sec">Expirations — Next 6 Months</h2>' + (anyNext ? months.map(function(mo, i){ return '<div class="bar-row"><span class="mut" style="width:74px">' + mo + '</span><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(counts[i] / maxC * 100) + '%"></div></div><b>' + counts[i] + '</b></div>'; }).join("") : '<p class="mut" style="margin:0">No data to chart yet — nothing expires in the next 6 months.</p>') + '</div>' +
    '<div class="card"><h2 class="sec">Expiry items by category</h2>' + Object.keys(cats).map(function(k){ return '<div class="bar-row"><span class="mut" style="width:110px">' + esc(k) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(cats[k] / DB.expiries.length * 100) + '%"></div></div><b>' + cats[k] + '</b></div>'; }).join("") + '</div>';
}

/* ---------- Purchases ---------- */
function renderPurchases(){
  var list = DB.purchases.slice();
  if(pQuery){ var q = pQuery.toLowerCase(); list = list.filter(function(p){ return (p.itemName + " " + p.brandModel + " " + p.serial).toLowerCase().indexOf(q) >= 0; }); }
  if(pSort === "newest") list.sort(function(a, b){ return (b.purchaseDate || "") < (a.purchaseDate || "") ? -1 : 1; });
  else if(pSort === "oldest") list.sort(function(a, b){ return (a.purchaseDate || "") < (b.purchaseDate || "") ? -1 : 1; });
  else if(pSort === "expiring") list.sort(function(a, b){ return (a.warrantyEnd || "9999") < (b.warrantyEnd || "9999") ? -1 : 1; });
  else if(pSort === "price") list.sort(function(a, b){ return (b.price || 0) - (a.price || 0); });
  var h = '<div class="card"><div class="row"><input id="pq" placeholder="Search purchases…" value="' + esc(pQuery) + '"><select id="psort" style="max-width:150px">' +
    [["newest","Newest First"],["oldest","Oldest First"],["expiring","Expiring Soon"],["price","Highest Price"]].map(function(o){ return '<option value="' + o[0] + '"' + (pSort === o[0] ? " selected" : "") + '>' + o[1] + '</option>'; }).join("") + '</select></div>' +
    '<button class="primary" id="newP" style="width:100%;margin-top:10px;padding:11px">+ New Purchase</button></div>';
  if(!list.length) h += '<div class="card"><p class="mut" style="margin:0">No purchases found.</p></div>';
  list.forEach(function(p){
    var st = purchaseStatus(p), d = daysUntil(p.warrantyEnd);
    h += '<div class="card" data-p="' + p.id + '" style="cursor:pointer"><div class="row"><b style="font-size:16px">' + esc(p.itemName) + '</b><span class="fix">' + badge(st) + '</span></div>' +
      '<div class="mut">' + (p.brandModel ? esc(p.brandModel) + '<br>' : '') + (p.price !== "" && p.price != null ? money(p.price) + ' · ' : '') + (p.purchaseDate ? 'Bought ' + fmtDate(p.purchaseDate) : '') +
      (p.warrantyEnd ? '<br>Warranty ends ' + fmtDate(p.warrantyEnd) + (d != null ? (d < 0 ? ' (' + Math.abs(d) + ' days ago)' : ' (' + d + ' days left)') : '') : '<br>No warranty end date') + '</div></div>';
  });
  $("main").innerHTML = h;
  $("pq").addEventListener("input", function(){ pQuery = this.value; var pos = this.selectionStart; renderPurchases(); var nq = $("pq"); nq.focus(); nq.setSelectionRange(pos, pos); });
  $("psort").addEventListener("change", function(){ pSort = this.value; renderPurchases(); });
  $("newP").addEventListener("click", function(){ startPForm(null); });
  document.querySelectorAll("[data-p]").forEach(function(el){ el.addEventListener("click", function(){ var p = null; DB.purchases.forEach(function(x){ if(x.id === el.getAttribute("data-p")) p = x; }); if(p) startPForm(p); }); });
}
function startPForm(existing){
  pForm = existing ? JSON.parse(JSON.stringify(existing)) : { id: "", itemName: "", brandModel: "", serial: "", additionalNumbers: "", purchaseDate: "", purchaseMethod: "", price: "", currency: "USD", warrantyMonths: "", warrantyEnd: "", warrantyNumber: "", registrationNumber: "", warrantyNotes: "", notes: "", documents: [] };
  view = "pform"; render(); window.scrollTo(0,0);
}
function renderPForm(){
  var f = pForm;
  $("main").innerHTML = '<div class="card"><h2 class="sec">' + (f.id ? "Purchase details" : "New Purchase") + '</h2>' +
    (f.id ? '<div style="margin-bottom:4px">' + badge(purchaseStatus(f)) + '</div>' : '') +
    '<label class="fl">Item Name *</label><input id="pf_name" value="' + esc(f.itemName) + '">' +
    '<label class="fl">Brand / Model</label><input id="pf_brand" value="' + esc(f.brandModel) + '">' +
    '<label class="fl">Serial Number</label><input id="pf_serial" value="' + esc(f.serial) + '">' +
    '<label class="fl">Other Reference Numbers</label><input id="pf_addl" value="' + esc(f.additionalNumbers) + '">' +
    '<div class="row"><div><label class="fl">Purchase Date *</label><input id="pf_date" type="date" value="' + esc(f.purchaseDate) + '"></div><div><label class="fl">Purchase Method</label><input id="pf_method" value="' + esc(f.purchaseMethod) + '"></div></div>' +
    '<div class="row"><div><label class="fl">Price</label><input id="pf_price" type="number" min="0" step="0.01" value="' + (f.price === "" ? "" : f.price) + '"></div><div><label class="fl">Currency</label><input id="pf_cur" value="' + esc(f.currency || "USD") + '"></div></div>' +
    '<div class="row"><div><label class="fl">Warranty Duration (months)</label><input id="pf_months" type="number" min="0" value="' + (f.warrantyMonths === "" ? "" : f.warrantyMonths) + '"></div><div><label class="fl">Warranty End Date</label><input id="pf_end" type="date" value="' + esc(f.warrantyEnd) + '"></div></div>' +
    '<button class="small" id="pf_calc" style="margin-top:6px">Set end date = purchase date + duration</button>' +
    '<label class="fl">Warranty / Claim Number</label><input id="pf_wnum" value="' + esc(f.warrantyNumber) + '">' +
    '<label class="fl">Registration Number</label><input id="pf_reg" value="' + esc(f.registrationNumber) + '">' +
    '<label class="fl">Warranty Notes</label><textarea id="pf_wnotes">' + esc(f.warrantyNotes) + '</textarea>' +
    '<label class="fl">General Notes</label><textarea id="pf_notes">' + esc(f.notes) + '</textarea>' +
    '<label class="fl">Documents</label><div id="pf_docs"></div><button id="pf_addDoc" style="margin-top:6px">Attach document photo</button>' +
    '<div class="row" style="margin-top:14px"><button class="primary" id="pf_save">Save</button><button id="pf_cancel">Cancel</button>' + (f.id ? '<button class="danger" id="pf_del">Delete</button>' : '') + '</div></div>';
  function sync(){
    f.itemName = $("pf_name").value; f.brandModel = $("pf_brand").value; f.serial = $("pf_serial").value; f.additionalNumbers = $("pf_addl").value;
    f.purchaseDate = $("pf_date").value; f.purchaseMethod = $("pf_method").value;
    f.price = $("pf_price").value === "" ? "" : parseFloat($("pf_price").value); f.currency = $("pf_cur").value || "USD";
    f.warrantyMonths = $("pf_months").value === "" ? "" : parseInt($("pf_months").value, 10); f.warrantyEnd = $("pf_end").value;
    f.warrantyNumber = $("pf_wnum").value; f.registrationNumber = $("pf_reg").value; f.warrantyNotes = $("pf_wnotes").value; f.notes = $("pf_notes").value;
  }
  function renderDocs(){
    $("pf_docs").innerHTML = f.documents.length ? f.documents.map(function(doc, i){ return '<div style="margin-bottom:8px"><img class="doc" src="' + doc + '"><button class="small danger" data-docdel="' + i + '">Remove document</button></div>'; }).join("") : '<p class="mut" style="margin:0">No documents attached.</p>';
    document.querySelectorAll("[data-docdel]").forEach(function(b){ b.addEventListener("click", function(){ sync(); f.documents.splice(parseInt(b.getAttribute("data-docdel"), 10), 1); renderPForm(); }); });
  }
  renderDocs();
  $("pf_calc").addEventListener("click", function(){ sync(); if(f.purchaseDate && f.warrantyMonths !== ""){ f.warrantyEnd = addMonths(f.purchaseDate, f.warrantyMonths); renderPForm(); } else alert("Set a purchase date and duration first."); });
  $("pf_addDoc").addEventListener("click", function(){ sync(); $("docFile").click(); });
  $("docFile").onchange = function(){
    var file = this.files && this.files[0]; this.value = ""; if(!file) return;
    var rd = new FileReader();
    rd.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 1200, scale = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement("canvas"); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        f.documents.push(cv.toDataURL("image/jpeg", 0.8)); renderPForm(); toast("Document attached");
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  };
  $("pf_cancel").addEventListener("click", function(){ pForm = null; view = "purchases"; render(); });
  $("pf_save").addEventListener("click", function(){
    sync();
    if(!f.itemName.trim()){ alert("Item name is required."); return; }
    if(!f.id){ f.id = "p" + Date.now(); DB.purchases.push(f); }
    else { var ix = -1; DB.purchases.forEach(function(x, i){ if(x.id === f.id) ix = i; }); if(ix >= 0) DB.purchases[ix] = f; }
    save(); pForm = null; view = "purchases"; render(); toast("Purchase saved");
  });
  var del = $("pf_del"); if(del) del.addEventListener("click", function(){ if(confirm("Delete this purchase?")){ DB.purchases = DB.purchases.filter(function(x){ return x.id !== f.id; }); save(); pForm = null; view = "purchases"; render(); } });
}

/* ---------- Expiries ---------- */
function icsForExpiries(){
  function ds(iso){ return iso.replace(/-/g, ""); }
  var evts = DB.expiries.map(function(e){
    var lines = ["BEGIN:VEVENT", "UID:" + e.id + "@warrantytracker", "DTSTART;VALUE=DATE:" + ds(e.expiryDate), "SUMMARY:" + (e.name + " expires").replace(/,/g, "\\,")];
    if(e.alertDate) lines.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + (e.name + " expires on " + e.expiryDate).replace(/,/g, "\\,"), "TRIGGER;VALUE=DATE-TIME:" + ds(e.alertDate) + "T090000", "END:VALARM");
    lines.push("END:VEVENT");
    return lines.join("\r\n");
  });
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//WarrantyTracker//EN"].concat(evts, ["END:VCALENDAR"]).join("\r\n");
}
function renderExpiries(){
  var ec = expiryCounts();
  var cats = {}; DB.expiries.forEach(function(e){ cats[e.category] = (cats[e.category] || 0) + 1; });
  var list = DB.expiries.slice().sort(function(a, b){ return a.expiryDate < b.expiryDate ? -1 : 1; });
  if(eQuery){ var q = eQuery.toLowerCase(); list = list.filter(function(e){ return (e.name + " " + e.category).toLowerCase().indexOf(q) >= 0; }); }
  var h = '<div class="card"><b>Sync to your calendar</b><div class="mut">Export all ' + DB.expiries.length + ' expiry dates as a .ics file and import it into Google Calendar, Apple Calendar, or Outlook — alert-date reminders included.</div><button class="primary" id="icsBtn" style="margin-top:9px">Export to Calendar</button></div>' +
    '<div class="card"><div class="row"><input id="eq" placeholder="Search expiry dates…" value="' + esc(eQuery) + '"><button class="fix primary" id="newE">+ New Expiry</button></div>' +
    '<p class="mut" style="margin:10px 0 0">Status — Valid ' + ec["Valid"] + ' · Expiring Soon ' + ec["Expiring Soon"] + ' · Expired ' + ec["Expired"] + '<br>By category — ' + Object.keys(cats).map(function(k){ return esc(k) + " " + cats[k]; }).join(" · ") + '</p></div>';
  if(!list.length) h += '<div class="card"><p class="mut" style="margin:0">No expiry items found.</p></div>';
  list.forEach(function(e){
    var st = expiryStatus(e), d = daysUntil(e.expiryDate);
    h += '<div class="card" data-e="' + e.id + '" style="cursor:pointer"><div class="row"><b style="font-size:16px">' + esc(e.name) + '</b><span class="fix">' + badge(st === "Valid" ? "Valid" : st) + '</span></div>' +
      '<div class="mut">' + esc(e.category) + ' · Expires ' + fmtDate(e.expiryDate) + (d < 0 ? ' (' + Math.abs(d) + ' days ago)' : ' (' + d + ' days left)') + '<br>Alert on ' + fmtDate(e.alertDate) + ' (' + e.alertLeadMonths + ' months ahead)</div></div>';
  });
  $("main").innerHTML = h;
  $("icsBtn").addEventListener("click", function(){ download("warranty-expiries.ics", icsForExpiries(), "text/calendar"); });
  $("eq").addEventListener("input", function(){ eQuery = this.value; var pos = this.selectionStart; renderExpiries(); var nq = $("eq"); nq.focus(); nq.setSelectionRange(pos, pos); });
  $("newE").addEventListener("click", function(){ startEForm(null); });
  document.querySelectorAll("[data-e]").forEach(function(el){ el.addEventListener("click", function(){ var e2 = null; DB.expiries.forEach(function(x){ if(x.id === el.getAttribute("data-e")) e2 = x; }); if(e2) startEForm(e2); }); });
}
function startEForm(existing){
  eForm = existing ? JSON.parse(JSON.stringify(existing)) : { id: "", name: "", category: "Other", documentNumber: "", expiryDate: "", alertLeadMonths: 6, alertDate: "", issuingAuthority: "", notes: "", documents: [] };
  view = "eform"; render(); window.scrollTo(0,0);
}
function renderEForm(){
  var f = eForm;
  var CATS = ["Passport", "Driver's License", "Insurance", "Membership", "Subscription", "Other"];
  if(CATS.indexOf(f.category) < 0) CATS.push(f.category);
  $("main").innerHTML = '<div class="card"><h2 class="sec">' + (f.id ? "Expiry details" : "New Expiry") + '</h2>' +
    (f.id ? '<div style="margin-bottom:4px">' + badge(expiryStatus(f)) + '</div>' : '') +
    '<label class="fl">Name *</label><input id="ef_name" value="' + esc(f.name) + '">' +
    '<label class="fl">Category</label><select id="ef_cat">' + CATS.map(function(c){ return '<option' + (f.category === c ? " selected" : "") + '>' + esc(c) + '</option>'; }).join("") + '</select>' +
    '<label class="fl">Document Number</label><input id="ef_doc" value="' + esc(f.documentNumber) + '">' +
    '<label class="fl">Expiry Date *</label><input id="ef_date" type="date" value="' + esc(f.expiryDate) + '">' +
    '<label class="fl">Alert Lead Time (months)</label><input id="ef_lead" type="number" min="0" value="' + f.alertLeadMonths + '">' +
    '<label class="fl">Alert Date (auto-calculated)</label><input id="ef_alert" type="date" value="' + esc(f.alertDate) + '">' +
    '<label class="fl">Issuing Authority</label><input id="ef_auth" value="' + esc(f.issuingAuthority) + '">' +
    '<label class="fl">Notes</label><textarea id="ef_notes">' + esc(f.notes) + '</textarea>' +
    '<div class="row" style="margin-top:14px"><button class="primary" id="ef_save">Save</button><button id="ef_cancel">Cancel</button>' + (f.id ? '<button class="danger" id="ef_del">Delete</button>' : '') + '</div></div>';
  function sync(recalc){
    f.name = $("ef_name").value; f.category = $("ef_cat").value; f.documentNumber = $("ef_doc").value;
    f.expiryDate = $("ef_date").value; f.alertLeadMonths = parseInt($("ef_lead").value, 10) || 0;
    f.issuingAuthority = $("ef_auth").value; f.notes = $("ef_notes").value;
    if(recalc && f.expiryDate) f.alertDate = addMonths(f.expiryDate, -f.alertLeadMonths); else f.alertDate = $("ef_alert").value;
  }
  $("ef_date").addEventListener("change", function(){ sync(true); $("ef_alert").value = f.alertDate; });
  $("ef_lead").addEventListener("change", function(){ sync(true); $("ef_alert").value = f.alertDate; });
  $("ef_cancel").addEventListener("click", function(){ eForm = null; view = "expiries"; render(); });
  $("ef_save").addEventListener("click", function(){
    sync(false);
    if(!f.name.trim()){ alert("A name is required."); return; }
    if(!f.expiryDate){ alert("An expiry date is required."); return; }
    if(!f.id){ f.id = "e" + Date.now(); DB.expiries.push(f); }
    else { var ix = -1; DB.expiries.forEach(function(x, i){ if(x.id === f.id) ix = i; }); if(ix >= 0) DB.expiries[ix] = f; }
    save(); eForm = null; view = "expiries"; render(); toast("Expiry saved");
  });
  var del = $("ef_del"); if(del) del.addEventListener("click", function(){ if(confirm("Delete this expiry item?")){ DB.expiries = DB.expiries.filter(function(x){ return x.id !== f.id; }); save(); eForm = null; view = "expiries"; render(); } });
}

/* ---------- Alerts ---------- */
function renderAlerts(){
  var list = DB.purchases.filter(function(p){ return p.warrantyEnd; }).slice().sort(function(a, b){ return a.warrantyEnd < b.warrantyEnd ? -1 : 1; });
  var h = '<div class="card"><h2 class="sec">Send Alert Email</h2><div class="row"><input id="alertEmail" type="email" placeholder="you@example.com" value="' + esc(alertEmail) + '"><button class="primary fix" id="alertSend">Compose alert email</button></div>' +
    '<p class="mut">Opens your mail app with the warranty list filled in — the original sent this from its server; the rebuild hands it to your own email, so you see and send it yourself.</p></div>';
  ["Active", "Expiring Soon", "Expired"].forEach(function(st){
    var group = list.filter(function(p){ return purchaseStatus(p) === st; });
    if(st === "Active" && !group.length) return;
    h += '<div class="card"><h2 class="sec">' + st.toUpperCase() + ' (' + group.length + ')</h2>';
    if(!group.length) h += '<p class="mut" style="margin:0">None.</p>';
    group.forEach(function(p){ var d = daysUntil(p.warrantyEnd); h += '<div style="border-top:1px dashed var(--line);padding-top:8px;margin-top:8px"><b>' + esc(p.itemName) + '</b><div class="mut">' + (d < 0 ? Math.abs(d) + ' days past' : d + ' days left') + ' — ' + fmtDate(p.warrantyEnd) + '</div></div>'; });
    h += '</div>';
  });
  $("main").innerHTML = h;
  $("alertEmail").addEventListener("input", function(){ alertEmail = this.value; });
  $("alertSend").addEventListener("click", function(){
    alertEmail = $("alertEmail").value.trim();
    var body = "WarrantyTracker — warranty status as of " + fmtDate(todayISO()) + ":\n\n" + list.map(function(p){ var d = daysUntil(p.warrantyEnd); return "• " + p.itemName + " — ends " + fmtDate(p.warrantyEnd) + " (" + (d < 0 ? Math.abs(d) + " days past" : d + " days left") + ", " + purchaseStatus(p) + ")"; }).join("\n");
    window.location.href = "mailto:" + encodeURIComponent(alertEmail) + "?subject=" + encodeURIComponent("WarrantyTracker expiration alerts") + "&body=" + encodeURIComponent(body);
  });
}

/* ---------- Backup ---------- */
function renderBackup(){
  $("main").innerHTML = '<div class="card"><h2 class="sec">Backup</h2><p class="mut" style="margin-top:0">Purchases, expiry items and document photos live only on this device. Export a backup file and keep it somewhere safe (for example Google Drive); import it on another device or browser to restore everything. Backups with documents can be large.</p>' +
    '<div class="row"><button id="exportBtn">⬇ Export backup</button><button id="importBtn">⬆ Import backup</button></div></div>';
  $("exportBtn").addEventListener("click", function(){ download("warrantytracker-backup.json", JSON.stringify(DB, null, 2), "application/json"); });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
}
function download(name, text, type){
  var blob = new Blob([text], {type: type || "application/octet-stream"}); var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
$("importFile").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ try { var data = JSON.parse(rd.result); if(!data || !Array.isArray(data.purchases) || !Array.isArray(data.expiries)) throw 0;
    if(confirm("Import this backup? It will replace all current purchases and expiry items.")){ DB = data; save(); view = "home"; render(); toast("Backup imported"); } } catch(e){ alert("That file is not a valid WarrantyTracker backup."); } };
  rd.readAsText(f); this.value = "";
});

function render(){ setNav(); if(view === "home") renderHome(); else if(view === "dashboard") renderDashboard(); else if(view === "purchases") renderPurchases(); else if(view === "pform") renderPForm(); else if(view === "expiries") renderExpiries(); else if(view === "eform") renderEForm(); else if(view === "alerts") renderAlerts(); else if(view === "backup") renderBackup(); }
render();
window.WT = { getDB: function(){ return DB; }, purchaseStatus: purchaseStatus, expiryStatus: expiryStatus, purchaseCounts: purchaseCounts, expiryCounts: expiryCounts, daysUntil: daysUntil, icsForExpiries: icsForExpiries };
</script>
</body>
