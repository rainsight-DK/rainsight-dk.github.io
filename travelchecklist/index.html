<style>
:root{--gr:#16A34A;--gr-d:#15803D;--bg:#F0FDF4;--card:#FFFFFF;--ink:#052E16;--mut:#64748B;--line:#BBF7D0;--chip:#F0FDF4;--danger:#B91C1C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--gr);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .brand{font-size:20px;font-weight:800;display:flex;gap:8px;align-items:center}
header .sub{font-size:12.5px;opacity:.9;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px}
button.primary{background:var(--gr);border-color:var(--gr);color:#fff;font-weight:700}
button.danger{color:var(--danger);border-color:#F3C2C2}
button.small{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:52px;resize:vertical}
label.fl{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
label.fl:first-child{margin-top:0}
.row{display:flex;gap:8px}.row>*{flex:1}
.mut{color:var(--mut);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.pill.on{background:var(--gr);color:#fff;border-color:var(--gr);font-weight:700}
.bar{height:10px;background:#E2E8F0;border-radius:999px;overflow:hidden;margin:8px 0 4px}
.bar>div{height:100%;background:var(--gr);border-radius:999px}
.item{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px dashed var(--line)}
.item .box{width:24px;height:24px;border:2px solid var(--gr);border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;cursor:pointer;background:#fff}
.item.done .box{background:var(--gr)}
.item.done .nm{color:var(--mut);text-decoration:line-through}
.item .nm{flex:1;cursor:pointer}
.item .del{border:none;background:none;color:var(--danger);font-size:15px;padding:4px 6px;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;border:none;border-radius:0;padding:11px 0 13px;font-size:13px;color:var(--mut)}
nav button.on{color:var(--gr);font-weight:800}
h2.sec{font-size:17px;margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#052E16;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:9;max-width:90vw;text-align:center}
.badge{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600}
</style>
</head>

/* ---------- Checklist ---------- */
function itemRow(t, ix){
  var i = t.items[ix];
  return '<div class="item' + (i.checked ? " done" : "") + '"><span class="box" data-tog="' + ix + '">' + (i.checked ? "✓" : "") + '</span><span class="nm" data-tog="' + ix + '">' + esc(i.name) + '</span><button class="del" data-del="' + ix + '" title="Remove item">✕</button></div>';
}
function renderChecklist(){
  var t = tripById(currentTripId); if(!t){ view = "trips"; render(); return; }
  var pr = progress(t);
  var h = '<button class="small" id="backBtn">← All trips</button>' +
    '<div class="card" style="margin-top:10px"><b style="font-size:18px">' + esc(t.title) + '</b>' +
    '<div class="mut" style="margin-top:3px">' + esc(t.origin) + ' → ' + esc(t.destination) + (t.otherPlaces ? '<br>Also: ' + esc(t.otherPlaces) : '') + '<br>' + fmtDate(t.start) + ' – ' + fmtDate(t.end) + ' · ' + esc(t.purpose) + ' · ' + esc((t.transport || []).join(", ")) + '</div>' +
    (t.otherDetails ? '<p class="mut">' + esc(t.otherDetails) + '</p>' : '') +
    '<div class="bar"><div style="width:' + pr.pct + '%"></div></div><div class="mut">' + pr.c + '/' + pr.n + ' items packed · ' + pr.pct + '%</div>' +
    '<div class="row" style="margin-top:10px"><button id="modeBtn">' + (listMode === "cat" ? "Full List view" : "Categorized view") + '</button><button id="editTripBtn">✏️ Edit trip</button></div>' +
    '<div class="row" style="margin-top:8px"><button id="shareBtn">Share</button><button class="danger" id="delTripBtn">Delete trip</button></div><div id="shareBox"></div></div>';
  if(listMode === "cat"){
    catsOf(t).forEach(function(cat){
      var items = t.items.map(function(it, ix){ return { it: it, ix: ix }; }).filter(function(x){ return x.it.cat === cat; });
      var done = items.filter(function(x){ return x.it.checked; }).length;
      h += '<div class="card"><h2 class="sec">' + esc(cat) + ' <span class="mut" style="font-size:13px">' + done + '/' + items.length + ' packed</span></h2>' + items.map(function(x){ return itemRow(t, x.ix); }).join("") + '</div>';
    });
  } else {
    h += '<div class="card"><h2 class="sec">Full List</h2>' + t.items.map(function(it, ix){ return itemRow(t, ix); }).join("") + '</div>';
  }
  h += '<div class="card"><h2 class="sec">Add Item</h2><div class="row"><input id="ai_name" placeholder="Item name"><select id="ai_cat">' +
    BASE_CATS.concat(catsOf(t).filter(function(c){ return BASE_CATS.indexOf(c) < 0; })).map(function(c){ return '<option>' + esc(c) + '</option>'; }).join("") + '<option value="__new">+ New category…</option></select></div>' +
    '<input id="ai_newcat" placeholder="New category name" style="display:none;margin-top:8px">' +
    '<button class="primary" id="ai_add" style="width:100%;margin-top:10px">+ Add Item</button></div>';
  $("main").innerHTML = h;
  $("backBtn").addEventListener("click", function(){ view = "trips"; render(); window.scrollTo(0,0); });
  $("modeBtn").addEventListener("click", function(){ listMode = listMode === "cat" ? "full" : "cat"; renderChecklist(); });
  $("editTripBtn").addEventListener("click", function(){ startForm(t); });
  $("delTripBtn").addEventListener("click", function(){ if(confirm("Delete this trip and its checklist?")){ DB.trips = DB.trips.filter(function(x){ return x.id !== t.id; }); save(); view = "trips"; render(); } });
  $("shareBtn").addEventListener("click", function(){
    var text = t.title + " — packing list (" + pr.c + "/" + pr.n + " packed)\n" + catsOf(t).map(function(cat){ return "\n" + cat + ":\n" + t.items.filter(function(i){ return i.cat === cat; }).map(function(i){ return (i.checked ? "☑ " : "☐ ") + i.name; }).join("\n"); }).join("");
    $("shareBox").innerHTML = '<div class="row" style="margin-top:10px"><button id="shWa">WhatsApp</button><button id="shSms">Text</button><button id="shMail">Email</button></div>';
    $("shWa").addEventListener("click", function(){ window.open("https://wa.me/?text=" + enc(text), "_blank"); });
    $("shSms").addEventListener("click", function(){ window.open("sms:?&body=" + enc(text), "_blank"); });
    $("shMail").addEventListener("click", function(){ window.open("mailto:?subject=" + enc(t.title + " — packing list") + "&body=" + enc(text), "_blank"); });
  });
  document.querySelectorAll("[data-tog]").forEach(function(el){ el.addEventListener("click", function(){ var ix = parseInt(el.getAttribute("data-tog"), 10); t.items[ix].checked = !t.items[ix].checked; save(); renderChecklist(); }); });
  document.querySelectorAll("[data-del]").forEach(function(el){ el.addEventListener("click", function(){ var ix = parseInt(el.getAttribute("data-del"), 10); t.items.splice(ix, 1); save(); renderChecklist(); }); });
  $("ai_cat").addEventListener("change", function(){ $("ai_newcat").style.display = this.value === "__new" ? "block" : "none"; });
  $("ai_add").addEventListener("click", function(){
    var name = $("ai_name").value.trim(); if(!name){ alert("Type the item name first."); return; }
    var cat = $("ai_cat").value === "__new" ? ($("ai_newcat").value.trim() || "Others") : $("ai_cat").value;
    t.items.push({ cat: cat, name: name, checked: false }); save(); renderChecklist(); toast("Item added");
  });
}

function startForm(existing){
  formState = existing ? JSON.parse(JSON.stringify(existing)) :
    { id: "", title: "", purpose: "Sightseeing", travelers: [owner()], origin: DB.settings.home, destination: "", otherPlaces: "",
      start: "", end: "", transport: [], transportOther: "", otherDetails: "", status: "in_preparation", items: [], starter: "smart", copyFrom: "" };
  view = "form"; render(); window.scrollTo(0,0);
}
function starterItems(f){
  var out = [], seen = {};
  function add(cat, name){ var k = cat + "|" + name.toLowerCase(); if(seen[k]) return; seen[k] = 1; out.push({ cat: cat, name: name, checked: false }); }
  DB.settings.defaults.forEach(function(d){ add(d.cat, d.name); });
  add("Travel Documents","Passport"); add("Travel Documents","Flight tickets"); add("Travel Documents","Travel insurance documents");
  add("Toiletries","Toothbrush"); add("Toiletries","Toothpaste"); add("Toiletries","Deodorant");
  add("Electronics","Phone"); add("Electronics","Portable charger");
  add("Clothing","Undergarments"); add("Clothing","Socks"); add("Clothing","Sleepwear"); add("Clothing","Comfortable walking shoes");
  add("Medical","Prescription medications"); add("Medical","Pain relievers"); add("Medical","First aid kit");
  add("Others","Backup payment method");
  var dest = (f.destination || "").toLowerCase();
  var intl = dest && dest.indexOf("united states") < 0 && dest.indexOf("usa") < 0;
  if(intl){ add("Travel Documents","Copy of important documents (passport, green card, etc.)"); add("Electronics","Travel adapter"); add("Financial","Cash (local currency)"); add("Financial","Credit/Debit cards"); }
  if(f.transport.indexOf("Flight") >= 0){ add("Others","Travel pillow"); add("Electronics","Headphones"); add("Travel Documents","Accommodation confirmation"); }
  if(f.transport.indexOf("Rental Car") >= 0){ add("Transportation","Rental car reservation confirmation"); add("Transportation","Driver's license"); add("Transportation","Insurance information"); if(intl) add("Travel Documents","International driving permit"); }
  if(f.purpose === "Business Trip"){ add("Electronics","Laptop and charger"); add("Clothing","Business professional suits"); add("Clothing","Business casual shirts"); add("Others","Notebook and pen"); }
  return out;
}

    var name = prompt("Person's name:"); if(!name) return;
    f.travelers.push({ name: name, nationality: "", visa: "", passport: "", age: "", gender: "", isPet: false, petType: "", isOwner: false }); renderTrav();
  });
  $("addPetBtn").addEventListener("click", function(){
    var name = prompt("Pet's name:"); if(!name) return; var type = prompt("Pet type (e.g. dog):", "dog") || "";
    f.travelers.push({ name: name, nationality: "", visa: "", passport: "", age: "", gender: "", isPet: true, petType: type, isOwner: false }); renderTrav();
  });
  document.querySelectorAll("[data-tr]").forEach(function(p){ p.addEventListener("click", function(){ var k = p.getAttribute("data-tr"); var ix = f.transport.indexOf(k); if(ix >= 0) f.transport.splice(ix,1); else f.transport.push(k); p.className = "pill" + (ix >= 0 ? "" : " on"); }); });
  document.querySelectorAll("[data-starter]").forEach(function(p){ p.addEventListener("click", function(){ syncBasics(); f.starter = p.getAttribute("data-starter"); renderForm(); }); });
  function syncBasics(){
    f.title = $("f_title").value; f.purpose = $("f_purpose").value; f.origin = $("f_origin").value; f.destination = $("f_dest").value;
    f.otherPlaces = $("f_other").value; f.start = $("f_start").value; f.end = $("f_end").value; f.transportOther = $("f_trother").value; f.otherDetails = $("f_details").value;
  }
  $("f_cancel").addEventListener("click", function(){ formState = null; view = f.id ? "checklist" : "trips"; if(f.id) currentTripId = f.id; render(); });
  $("f_save").addEventListener("click", function(){
    syncBasics();
    if($("f_copy")) f.copyFrom = $("f_copy").value;
    if(!f.id){
      f.id = "t" + Date.now();
      if(f.starter === "smart") f.items = starterItems(f);
      else if(f.starter === "copy"){ var src = tripById(f.copyFrom); f.items = src ? src.items.map(function(i){ return { cat: i.cat, name: i.name, checked: false }; }) : []; }
      else f.items = [];
      DB.trips.unshift(f);
    } else {
      var ix = -1; DB.trips.forEach(function(x, i){ if(x.id === f.id) ix = i; }); if(ix >= 0){ f.items = DB.trips[ix].items; DB.trips[ix] = f; }
    }
    save(); formState = null; currentTripId = f.id; view = "checklist"; listMode = "cat"; render(); toast("Trip saved");
  });
}

/* ---------- Settings ---------- */
function renderSettings(){
  var s = DB.settings;
  var h = '<div class="card"><h2 class="sec">Settings — Main Traveler</h2>' +
    '<div class="row"><div><label class="fl">Nationality</label><input id="s_nat" value="' + esc(s.nationality) + '"></div><div><label class="fl">Visa Status</label><input id="s_visa" value="' + esc(s.visa) + '"></div></div>' +
    '<label class="fl">Home Location</label><input id="s_home" value="' + esc(s.home) + '">' +
    '<div class="row"><div><label class="fl">Passport Expiry</label><input id="s_pass" type="date" value="' + esc(s.passport) + '"></div><div><label class="fl">Age</label><input id="s_age" type="number" min="0" value="' + s.age + '"></div>' +
    '<div><label class="fl">Gender</label><select id="s_gender"><option value="male"' + (s.gender === "male" ? " selected" : "") + '>Male</option><option value="female"' + (s.gender === "female" ? " selected" : "") + '>Female</option><option value="other"' + (s.gender === "other" ? " selected" : "") + '>Other</option></select></div></div>' +
    '<button class="primary" id="s_save" style="width:100%;margin-top:12px">Save Settings</button></div>' +
    '<div class="card"><h2 class="sec">Default Items</h2><p class="mut" style="margin-top:0">Added to every new trip\'s smart starter checklist.</p><div id="defBox"></div>' +
    '<div class="row" style="margin-top:8px"><select id="d_cat">' + BASE_CATS.map(function(c){ return '<option>' + c + '</option>'; }).join("") + '</select><input id="d_name" placeholder="Item name"><button id="d_add">+</button></div></div>';
  $("main").innerHTML = h;
  function renderDefs(){
    $("defBox").innerHTML = s.defaults.map(function(d, i){ return '<span class="badge" style="margin:0 6px 6px 0;display:inline-block">' + esc(d.cat) + ': ' + esc(d.name) + ' <a href="#" data-deldef="' + i + '" style="color:var(--danger);text-decoration:none">✕</a></span>'; }).join("") || '<span class="mut">None yet.</span>';
    document.querySelectorAll("[data-deldef]").forEach(function(a){ a.addEventListener("click", function(ev){ ev.preventDefault(); s.defaults.splice(parseInt(a.getAttribute("data-deldef"),10), 1); save(); renderDefs(); }); });
  }
  renderDefs();
  $("d_add").addEventListener("click", function(){ var n = $("d_name").value.trim(); if(!n) return; s.defaults.push({ cat: $("d_cat").value, name: n }); save(); renderDefs(); toast("Default added"); });
  $("s_save").addEventListener("click", function(){
    s.nationality = $("s_nat").value; s.visa = $("s_visa").value; s.home = $("s_home").value; s.passport = $("s_pass").value;
    s.age = parseInt($("s_age").value, 10) || s.age; s.gender = $("s_gender").value; save(); toast("Settings saved");
  });
}

/* ---------- Backup ---------- */
function renderBackup(){
  $("main").innerHTML = '<div class="card"><h2 class="sec">Backup</h2><p class="mut" style="margin-top:0">Your trips, checklists and settings live only on this device. Export a backup file and keep it somewhere safe (for example Google Drive); import it on another device or browser to restore everything.</p>' +
    '<div class="row"><button id="exportBtn">⬇ Export backup</button><button id="importBtn">⬆ Import backup</button></div></div>';
  $("exportBtn").addEventListener("click", function(){ download("travel-checklist-backup.json", JSON.stringify(DB, null, 2)); });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
}
function download(name, text){
  var blob = new Blob([text], {type: "application/json"}); var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
$("importFile").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ try { var data = JSON.parse(rd.result); if(!data || !Array.isArray(data.trips) || !data.settings) throw 0;
    if(confirm("Import this backup? It will replace all current trips and settings.")){ DB = data; save(); view = "trips"; render(); toast("Backup imported"); } } catch(e){ alert("That file is not a valid Travel Checklist backup."); } };
  rd.readAsText(f); this.value = "";
});

function render(){ setNav(); if(view === "trips") renderTrips(); else if(view === "checklist") renderChecklist(); else if(view === "form") renderForm(); else if(view === "settings") renderSettings(); else if(view === "backup") renderBackup(); }
render();
window.TC = { getDB: function(){ return DB; } };
</script>
</body>
</html>
